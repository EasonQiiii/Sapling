# Family Learning OS — local Postgres scaffold
# Status: draft / NOT production-validated
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flos
      POSTGRES_PASSWORD: flos
      POSTGRES_DB: family_learning_os
    ports:
      - "5432:5432"
    volumes:
      - flos_pg_data:/var/lib/postgresql/data

volumes:
  flos_pg_data:
