- id: G5V1-228
  answer: 质数不都是奇数。最小的质数是 2。理由：2 只有 1 和它本身两个因数，符合质数的定义，所以 2 是质数；而 2 是偶数，所以质数不都是奇数。
  answer_note: 结论题（判断与说理），题干数据完整。要点：质数的定义只看因数个数（只有 1 和它本身两个因数），与奇偶性无关；2 是唯一的偶质数，其余质数（3、5、7……）都是奇数，所以"质数都是奇数"的说法不对。
