  answer: 39 人的班和 40 人的班能分成人数相同的几个小组，41 人的班和 43 人的班不能。理由：39=3×13，因数有 1、3、13、39，可分成 3 组每组 13 人（或 13 组每组 3 人），每组不止 1 人且不止 1 组；40=4×10=2×20=5×8，因数有 1、2、4、5、8、10、20、40，如分成 4 组每组 10 人（或 5 组每组 8 人等），也符合要求；41 和 43 都只有 1 和它本身两个因数，是质数，若每组不止 1 人就只能分成 1 组，不符合"不止 1 组"，所以不能分。
  answer_note: 结论题（判断与说理），题干已给四个班人数 39、41、40、43，数据完整。要点：能按要求分组，人数必须是合数且除"1×本身"外还有因数搭配（因数对的两端都大于 1）；41、43 是质数，只有"全班 1 组"或"每组 1 人"两种分法，都不符合条件，故不能分。
