  answer: 6=2×3，6=3+3；10=2×5，10=3+7（或 5+5）；14=2×7，14=3+11（或 7+7）；28=2×2×7，28=5+23（或 11+17 等，填法不唯一）。乘法部分的质数是唯一的，加法部分除个别（如 6=3+3）外填法不唯一。
  answer_note: 数值题（填质数），题干数据完整（6、10、14、28）。要点：每个数分解质因数的结果是唯一的（6=2×3、10=2×5、14=2×7、28=2×2×7）；写成两个质数相加时，符合要求的填法可能不止一种，列举一种即可（答案不唯一的注明），所填的数必须是质数。
