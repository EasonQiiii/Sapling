- id: G5V1-129
  answer: 每面小旗面积：12 × 20 ÷ 2 = 120（平方厘米）；10 面小旗用纸：120 × 10 = 1200（平方厘米）
  answer_note: 数值题，题干已给两条直角边 12 厘米和 20 厘米、做 10 面，数据完整；按"至少需要"理解为单面剪纸、不加拼接余量，用直角三角形面积公式"两条直角边相乘 ÷ 2"先算一面，再乘 10。若教材意图考虑剪纸损耗或双面用纸，则需在 1200 平方厘米基础上适当增加，可结合课堂要求说明判断。
- id: G5V1-130
  answer: 装饰牌面积：（6 + 12）× 2 ÷ 2 = 18（平方米）；需油漆：18 × 1 = 18（千克）。18 千克 < 20 千克，20 千克油漆够了
  answer_note: 数值题兼判断题，题干已给上底 6 米、下底 12 米、高 2 米、每平方米 1 千克、油漆 20 千克，数据完整；先按梯形面积公式算出面积，再算所需油漆千克数，与 20 千克比较作出判断并说明理由。
- id: G5V1-131
  answer: 3 × 10000 = 30000，3 公顷 = 30000 平方米；60000 ÷ 10000 = 6，60000 平方米 = 6 公顷；5 × 100 = 500，5 平方千米 = 500 公顷；700 ÷ 100 = 7，700 公顷 = 7 平方千米
  answer_note: 单位换算题，四组逐组给出。依据：1 公顷 = 10000 平方米，1 平方千米 = 100 公顷；高级单位换算成低级单位乘进率，低级单位换算成高级单位除以进率。
- id: G5V1-133
  answer: 4.4 万平方米 = 44000 平方米，44000 ÷ 10000 = 4.4，4.4 万平方米 = 4.4 公顷
  answer_note: 单位换算题，依据 1 公顷 = 10000 平方米，平方米换算成公顷除以 10000。
- id: G5V1-136
  answer: 拼成的平行四边形的周长不唯一，不能只由"两个三角形面积都是 225 平方厘米"确定。理由：面积相等的三角形形状不唯一（如底 30 厘米、高 15 厘米，或底 45 厘米、高 10 厘米，都能拼成面积 225 平方厘米的三角形），两个完全相同的三角形拼成平行四边形时，平行四边形的底和高取决于三角形的底和高，因此周长不唯一；要知道三角形的底和高（即拼成的平行四边形的相邻两边长），才能用"（底 + 高）× 2"算出周长。
  answer_note: 结论题。题干只给两个三角形的面积 225 平方厘米，数据不充分，据面积无法确定三角形的形状与边长，故只能给出"周长不唯一、需知道底和高才能算"的结论及依据，不定唯一数值。
- id: G5V1-137
  answer: 每块等腰直角三角形的面积：2 × 2 ÷ 2 = 2（平方分米）；装饰图案面积：2 × 8 = 16（平方分米）
  answer_note: 数值题，题干已给腰长 2 分米、共 8 个三角形，数据完整；等腰直角三角形的两条腰互相垂直、可作底和高，先按"腰 × 腰 ÷ 2"算每块面积，再乘 8 得整体面积。
- id: G5V1-138
  answer: 面积没有变化。理由：斜放后前面由长方形变成近似的平行四边形，但它的底仍等于原来长方形的长（练习本的长），高仍等于原来长方形的宽（摞起的厚度），底和高都没有变，由"平行四边形面积 = 底 × 高"（长方形面积 = 长 × 宽，二者公式相同）可知面积不变。
  answer_note: 结论题，依据是长方形是特殊的平行四边形，斜放只改变形状、不改变底和高的长度，故面积不变。
