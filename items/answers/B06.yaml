- id: G5V1-141
  answer: null
  answer_note: 活动题（实地调查）。调查对象与数据因小组走访的农户不同而异，不能预先给出唯一结果，不得编造调查数据。完成标准：真实走访一户农家，按调查表逐项记录种植的作物（或养殖项目）、种植面积、种子（苗）、肥料、农药等成本，以及产量和售价等数据，数据与实际调查相符；能依据调查数据算出（或估算）该项种植的收入；能与同学交流调查过程和结果。
- id: G5V1-142
  answer: null
  answer_note: 开放题（方案设计）。农田面积为长方形，面积可算得 85 × 48 = 4080 平方米，但种植什么、各种多少等取决于第 141 题调查到的成本、产量、售价等数据，方案不唯一，不能编造调查数据给出唯一"标准方案"。完成标准：方案表包含种植作物、各种作物的种植面积（各作物面积之和等于农田面积 4080 平方米）、每项成本、预计产量、预计收入和预计利润等要素；面积、收入、利润的计算正确（面积 = 长 × 宽，收入 = 产量 × 售价，利润 = 收入 - 成本）；全年安排（如茬口搭配、轮作）合理，能结合调查数据说明设计理由。
- id: G5V1-143
  answer: null
  answer_note: 活动题（选题调查）。选题和研究结果取决于当地实际，不能预先给出唯一结果，不得编造调查数据。完成标准：能围绕当地特色农产品或水产品提出值得研究的问题（如种植（养殖）面积、年产量、销售渠道、价格变化等），并说明选题理由；选出一个问题开展调查研究，采用走访、查阅资料、问卷等合适的方法收集并整理数据；能用表格、图表或文字呈现调查结果并与同学交流。
- id: G5V1-144
  answer: null
  answer_note: 讨论题。讨论意见因当地农产品和市场情况而异，不能预先给出唯一结果。完成标准：能从产品质量、品牌、价格、包装、销售渠道（如批发市场、超市、电商直播）、季节与供需、宣传推广等方面讨论影响特色农产品市场销售的因素；结合因素交流营销策略和建议（如提高品质、注册商标、网络直播带货、举办采摘节等）；整理小组的意见和建议并形成简要记录，表达有条理。
