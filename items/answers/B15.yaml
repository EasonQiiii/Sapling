# 苏教版五年级上册 八、观察物体（三） G5V1-338 ~ G5V1-366
# 本批题目全部依赖教材插图中的物体摆放或指定视图（题库 figure 均为 null、题干未转写），
# 故全部按开放题处理：answer 为 null，answer_note 写完成标准，不编造图中具体数据。
- id: G5V1-338
  answer: null
  answer_note: 开放题（画视图类）：教材要求先用 6 个正方体摆一个物体，物体摆放未转写，须学生自己动手摆。完成标准：能根据自己摆出的物体，从前面、右面和上面三个方向观察，在方格纸上按看到的列数和每列最高层数分别画出三幅视图，且画出的图形与实际摆放一致；再让同桌只依据这三幅图摆出物体，同桌摆出的物体从这三个方向看应与原图形相同。
- id: G5V1-339
  answer: null
  answer_note: 开放题（画视图类）：教材插图中的物体未转写，须先看图确定物体形状。完成标准：分别从物体上面、右边拿走一个正方体后，观察新物体从前面看到的形状变化，在方格纸上画出变化后从前面看到的图形；画出的图形应与拿走后实际观察的结果一致（列数、每列最高层数正确），并能口头说出图形是怎么变的。
- id: G5V1-340
  answer: null
  answer_note: 开放题（移动/拿走类）：物体摆放未转写，须看图操作。完成标准：再拿走一个正方体后从右面看到的图形不变——拿走的应是右面视图中所占位置的列、层已被其他正方体"挡住"或仍被占住的方块（如被前面正方体完全遮住的），并说出理由；同理，拿走后从上面看到的图形不变——拿走的应是不影响上面视图列数与每列方块数的正方体（如被上面正方体覆盖着的）。答案不唯一，只要操作与理由正确即可。
- id: G5V1-341
  answer: null
  answer_note: 开放题（移动/添上类）：4 个正方体的物体摆放未转写，须看图先想再摆。完成标准：添上的 1 个正方体不能改变前面视图的列数和每列最高层数——应放在原有正方体的后面（或前面），且与某个已有正方体前后相邻、位于其正后方（正前方），从前面看被完全遮挡；能先说清想法再动手摆，摆完检验从前面看到的图形确实不变。
- id: G5V1-342
  answer: null
  answer_note: 开放题（移动/拿走类）：5 个正方体的物体摆放未转写，须看图操作。完成标准：移动其中 1 个正方体后，从上面看到的图形不变——移动前后该正方体在上面的投影位置须保持不变，即仍放在原来那一列（行）同一投影格内（如移到被移动前后位置上方重叠的地方），使上面视图的每个方格仍被占住；能说出移到哪个位置、为什么图形不变。
- id: G5V1-343
  answer: null
  answer_note: 开放题（移动/拿走类）：5 个正方体的物体摆放未转写，须看图操作。完成标准：拿走 1 个正方体后从右面看到的图形不变——拿走的应是右面视图中被其他正方体遮挡或同列同层位置仍被占住的那个（如右面方向被前排正方体挡住、其轮廓位置由其他正方体补上的），拿走后右面视图的列数与每列最高层数不变；能说出拿走哪一个、为什么图形不变。
- id: G5V1-344
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从前面看到的图形（视图）未转写。完成标准：用 5 个正方体摆出物体，从前面看列数、每列最高层数与教材指定的视图完全一致；摆法可能不唯一，多余的正方体应放在视图轮廓内部被遮挡的位置；摆完后对照指定视图逐一检验。
- id: G5V1-345
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从右面看到的图形（视图）未转写。完成标准：用 5 个正方体摆出物体，从右面看列数（对应前后方向的排数）、每列最高层数与教材指定的视图完全一致；摆法可能不唯一，多余正方体放在从右面看不到变化的位置；摆完后对照指定视图检验。
- id: G5V1-346
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从上面看到的图形（视图）未转写。完成标准：用 5 个正方体摆出物体，从上面看到的方格布局（行数、列数及占用位置）与教材指定的视图完全一致；高度不同的正方体都放在视图占用的格内，摆法可能不唯一；摆完后对照指定视图检验。
- id: G5V1-347
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从前面和从右面看到的两幅视图未转写。完成标准：用 4 个正方体摆出物体，使其从前面看到的图形符合第一幅要求、从右面看到的图形符合第二幅要求，即同时满足两个方向的列数与每列最高层数；能结合摆放说明理由（如某正方体为什么必须放在该位置才能同时满足两个视图）；摆完后两个方向都对照检验。
- id: G5V1-348
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从右面和从上面看到的两幅视图未转写。完成标准：用 4 个正方体摆出物体，使从右面、从上面看到的图形分别符合两幅指定视图；并尝试找出不同的摆法（如某格内正方体层数在两个视图共同允许范围内的不同安排），摆法可能不唯一，每一种摆法都要与两幅视图逐一对照检验。
- id: G5V1-349
  answer: null
  answer_note: 开放题（由视图反推类）：教材指定的从前面看到的视图未转写。完成标准：根据"用 5 个正方体摆成、从前面看符合指定图形"这一条件，推理物体可能的各种摆放方式，进而画出从右面和上面看到的图形可能是什么；由于摆法不唯一，答案可能不唯一，只要画出的图形与某一符合前面视图的摆法一致、并能说明推理过程即可。
- id: G5V1-350
  answer: null
  answer_note: 开放题（由视图反推类）：教材给出的从前面、右面和上面看到的三幅视图均未转写。完成标准：综合三个方向的视图，先由上面视图确定底面占用的格数和位置，再由前面、右面视图确定每个格上的最高层数，据此摆出对应的 6 个正方体物体；摆出的物体从三个方向看都必须与原图形一致（视图未转写时不编造具体数据），摆好后逐一方向检验。
- id: G5V1-351
  answer: null
  answer_note: 开放题（移动/拿走类）：6 个正方体的物体摆放未转写，须看图操作。完成标准：每次移动 1 个正方体后从前面看到的图形不变——移动前后该正方体在前面视图中的投影位置（所在列、层）不变，即仍落在原来那一列同一层的位置或被遮挡不变的位置；能说出移到哪个位置、为什么图形不变；可移动多次，每次都检验。
- id: G5V1-352
  answer: null
  answer_note: 开放题（移动/拿走类）：物体摆放未转写，须看图操作。完成标准：每次移动 1 个正方体后从右面看到的图形不变——移动前后该正方体在右面视图中的投影位置不变（前后排位置、层数不变或被其他正方体遮挡）；能说出移到哪个位置、为什么右面视图的列数与每列最高层数不变；每次移动后对照检验。
- id: G5V1-353
  answer: null
  answer_note: 开放题（移动/拿走类）：物体摆放未转写，须看图操作。完成标准：每次移动 1 个正方体后从上面看到的图形不变——移动前后该正方体在底面上的投影格不变，即仍放在原来那一格或原格仍被其他正方体占住的位置（如本格上方有正方体可移至其正下方）；能说出移到哪个位置、为什么图形不变；每次移动后对照检验。
- id: G5V1-354
  answer: null
  answer_note: 开放题（移动/拿走类）：6 个正方体的物体摆放未转写，须看图操作。完成标准：每次拿走 1 个正方体后从前面看到的图形不变——拿走的应是前面视图中被其他正方体完全遮挡的正方体（或其列、层位置拿走后仍被同列同层的其他正方体占住）；能说出拿走哪一个、为什么图形不变；每次拿走后对照检验。
- id: G5V1-355
  answer: null
  answer_note: 开放题（移动/拿走类）：物体摆放未转写，须看图操作。完成标准：每次拿走 1 个正方体后从上面看到的图形不变——拿走的应是其底面投影格仍被其他正方体占住的正方体（如叠在其他正方体上面的那一个），使上面视图占用的方格位置不变；能说出拿走哪一个、为什么图形不变；每次拿走后对照检验。
- id: G5V1-356
  answer: null
  answer_note: 开放题（移动/拿走类，含说理）：物体摆放未转写，须看图判断。完成标准：判断"要使从右面看到的图形不变，可不可以拿走上面那个正方体"——应先观察该正方体在右面视图中的位置：若它拿走后同列同层位置仍被其他正方体占住（被遮挡），则可以拿走；若它的轮廓在右面视图中不能由其他正方体补上，则不能拿走；结论与教材图中实际情况一致，并能说明理由。
- id: G5V1-357
  answer: null
  answer_note: 开放题（移动/添上类）：5 个正方体的物体摆放未转写，须看图操作。完成标准：每次添上 1 个正方体后从右面看到的图形不变——添上的正方体应放在右面视图中已被占住的位置内（如原有某正方体的正前方或正后方，且层高不超过该列原有最高层），使右面视图的列数与每列最高层数不变；能说出添到哪个位置、为什么图形不变；每次添上后对照检验。
- id: G5V1-358
  answer: null
  answer_note: 开放题（移动/添上类，含说理）：物体摆放未转写，须看图操作。完成标准：添上 1 个正方体使从上面和前面看到的图形都不变——该正方体既不能增加或减少上面视图占用的方格（其底面投影格必须已有正方体），也不能改变前面视图的列数与每列最高层数（从前面看须被完全遮挡，如放在原有正方体正后方同一层）；能说明同时满足两个条件的理由；摆完后两个方向都检验。
- id: G5V1-359
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从前面看到的视图未转写。完成标准：用 5 个正方体摆出物体，使从前面看到的图形符合教材指定要求（列数、每列最高层数一致）；并想一想有没有不同的摆法——多余的正方体可放在视图轮廓内不同的被遮挡位置，摆法可能不唯一，每一种摆法都须与指定视图对照检验。
- id: G5V1-360
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从前面和从右面看到的两幅视图未转写。完成标准：摆出物体使其从前面、从右面看到的图形分别符合两幅指定视图（两个方向的列数与每列最高层数都一致）；摆法可能不唯一，摆完后从两个方向分别对照原图形检验。
- id: G5V1-361
  answer: null
  answer_note: 开放题（摆一摆类）：教材指定的从前面和从右面看到的另一组视图未转写。完成标准：摆出物体使其从前面、从右面看到的图形分别符合这一组的两幅指定视图；若按原条件摆不成立须说明发现（如两视图要求冲突时应能指出），摆法可能不唯一，摆完后两个方向都对照检验。
- id: G5V1-362
  answer: null
  answer_note: 开放题（移动/添上类，含说理）：5 个正方体的物体摆放未转写，须看图操作。完成标准：给物体添 1 个正方体使从上面看到的图形不变——添上的正方体必须放在底面投影格已有正方体占住的格内（叠在其上）；再判断添上后从前面和从右面看到的图形有没有变化：若新正方体在前面（或右面）方向上未被遮挡且层高、列位置改变了视图，则该方向的图形变了，须画（说）出变成了什么；判断与理由须与图中实际摆放一致。
- id: G5V1-363
  answer: null
  answer_note: 开放题（画视图类）：教材插图中的物体未转写，须学生自己观察。完成标准：从前面、右面和上面三个方向观察教材图中的物体，在方格纸上按每个方向看到的列数和每列最高层数分别画出视图；三幅图与实际观察结果一致，无多画或少画的方格。
- id: G5V1-364
  answer: null
  answer_note: 开放题（移动/拿走类）：教材插图中的物体摆放未转写，须看图操作。完成标准：移动物体中的一个正方体，使从前面看到的图形不变——移动前后该正方体在前面视图中的投影位置（所在列、层）不变，即移到同一列同一层的前后位置（从前面看重合）；能说出移到哪个位置、为什么图形不变，移动后对照检验。
- id: G5V1-365
  answer: null
  answer_note: 开放题（移动/拿走类）：教材插图中的物体摆放未转写，须看图操作。完成标准：拿走物体中的一个正方体，使从上面看到的图形不变——拿走的应是其底面投影格仍被其他正方体占住的正方体（如叠在其他正方体上方的那一个），使上面视图占用的方格与原来相同；能说出拿走哪一个、为什么图形不变，拿走后对照检验。
- id: G5V1-366
  answer: null
  answer_note: 开放题（移动/添上类）：教材插图中的物体（多个）未转写，须看图先想再摆。完成标准：对图中每个物体各添 2 个正方体，使添上后从前面和从右面看到的图形都符合教材指定要求（两幅视图均未转写，不编造具体图形）；思路是先把这 2 个正方体放在原有正方体的前后方被完全遮挡的位置（两个方向的视图都不变或恰好符合要求），能先说清想法再动手摆，摆完后两个方向分别对照指定视图检验。
