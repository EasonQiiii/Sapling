  answer_note: 开放题（画视图类）：教材要求先用 6 个正方体摆一个物体，物体摆放未转写，须学生自己动手摆。完成标准：能根据自己摆出的物体，从前面、右面和上面三个方向观察，在方格纸上按看到的列数和每列最高层数分别画出三幅视图，且画出的图形与实际摆放一致；再让同桌只依据这三幅图摆出物体，同桌摆出的物体从这三个方向看应与原图形相同。