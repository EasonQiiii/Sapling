  answer: x+18=48 → x+18−18=48−18，x=30；7x=3.5 → 7x÷7=3.5÷7，x=0.5；3y=60 → 3y÷3=60÷3，y=20；2y=20 → 2y÷2=20÷2，y=10。
  answer_note: 等式基本性质填空题，题干数据完整。依据：等式两边同时加上或减去同一个数、同时乘或除以同一个不为 0 的数，等式仍成立。x+18=48 两边同减 18 得 x=48−18=30；7x=3.5 两边同除以 7 得 x=3.5÷7=0.5；3y=60 两边同除以 3 得 y=20；2y=20 两边同除以 2 得 y=10。
