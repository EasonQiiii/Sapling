  answer: c = 25 − a + b（也可写成 c = 25 + b − a，即离开时车上人数 = 原有人数 − 下车人数 + 上车人数）。
  answer_note: 关系式题，题干数据完整。依据：车上有 25 人，下车 a 人后剩 25−a 人，再上车 b 人，就是 25−a+b 人，所以 c=25−a+b（先加上车的再减下车的写成 25+b−a 也可以）。
