  answer: 当 a=10、b=8 时，c = 25−10+8 = 23（人）；当 a=8、b=10 时，c = 25−8+10 = 27（人）。
  answer_note: 代入求值题，题干数据完整。依据：把 a、b 的值代入 c=25−a+b：a=10、b=8 时，25−10+8=23 人；a=8、b=10 时，25−8+10=27 人（上车比下车多 2 人，所以比 25 多 2）。
- id: G5V1-311
  answer: 当 a>b（下车比上车多）时，c<25；当 a<b（上车比下车多）时，c>25；当 a=b（上、下车人数相同）时，c=25。当 c=25 时，a=b。
  answer_note: 分类讨论说理题，题干数据完整。依据：c=25−a+b，c 与 25 的差就是 b−a：a>b 时 b−a<0，c<25；a<b 时 b−a>0，c>25；a=b 时 b−a=0，c=25。反过来 c=25 说明 25−a+b=25，即 b=a。完成标准：三种情况都说全，并能用式子说明理由。
