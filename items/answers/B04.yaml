- id: G5V1-104
  answer: 已知的一组：5 平方千米 = 500 公顷，500 > 480，所以填"＞"。其余三组数据在教材原题插图中，均按同一方法比较：先把两个量统一成相同的面积单位（依据 1 平方千米 = 100 公顷 = 1000000 平方米，1 公顷 = 10000 平方米），再比较大小、填出比较符号。
  answer_note: 比较大小填符号题。题干只明确给出"5 平方千米与 480 公顷"这一组，逐组作答时不能编造其余各组的数值；完成标准：对每组先把单位统一，再正确填出"＞""＜"或"＝"。
- id: G5V1-105
  answer: 我国陆地面积约 960 万平方千米；海域面积约 470 多万平方千米
  answer_note: 选单位题。理由：计量国土、海域这样很大的面积，通常用"平方千米"作单位（1 平方千米 = 1000000 平方米），用"平方米"或"公顷"数值会过大，不符合实际。
- id: G5V1-106
  answer: 长江全长约 6300 千米；流域面积约 178 万平方千米
  answer_note: 选单位题。理由：计量河流全长用长度单位"千米"；计量流域这样的大面积用面积单位"平方千米"。
- id: G5V1-107
  answer: 吐鲁番盆地面积约 1.57 万平方千米
  answer_note: 选单位题。理由：盆地面积很大，用"平方千米"作单位合适；若用"公顷"或"平方米"，数值会过大，不符合实际。
- id: G5V1-108
  answer: 每块盐田面积 = 长 × 宽：100 × 60 = 6000（平方米）；50 块共：6000 × 50 = 300000（平方米）；300000 ÷ 10000 = 30，一共占地 30 公顷（依据 1 公顷 = 10000 平方米）
  answer_note: 数值题，题干已给每块长 100 米、宽 60 米、共 50 块，数据完整；先算每块面积，再算总面积，最后换算成公顷。
- id: G5V1-109
  answer: 正方形面积：8 × 8 = 64（平方厘米）。剪去的是两条中点连线围成的直角三角形，两条直角边各为 8 ÷ 2 = 4（厘米），三角形面积：4 × 4 ÷ 2 = 8（平方厘米）；剩下纸的面积：64 − 8 = 56（平方厘米）
  answer_note: 数值题，题干已给正方形边长 8 厘米，且剪去三角形的两条直角边各为边长的一半（4 厘米），数据完整；用正方形面积减去三角形面积。
