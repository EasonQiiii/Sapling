  answer_note: 开放题（画图）。面积都是 15 平方厘米的平行四边形、三角形和梯形画法都不唯一，不定唯一答案。示例（供参考）：平行四边形底 5 厘米、高 3 厘米；三角形底 10 厘米、高 3 厘米（或底 5 厘米、高 6 厘米）；梯形上底 3 厘米、下底 7 厘米、高 3 厘米。完成标准：在方格纸上画出三种图形，每种都标出所需的底、高（或上底、下底、高），并逐一验证面积都等于 15 平方厘米（平行四边形底 × 高 = 15；三角形底 × 高 ÷ 2 = 15；梯形（上底 + 下底）× 高 ÷ 2 = 15）。
