- id: G5V1-101
  answer: 平行四边形面积 = 底 × 高：3000 × 3500 = 10500000（平方米）；10500000 ÷ 10000 = 1050，合 1050 公顷（依据 1 公顷 = 10000 平方米，平方米换算成公顷除以 10000）
  answer_note: 数值题，题干已给底约 3000 米、高约 3500 米，数据完整；先按平行四边形面积公式求面积，再换算成公顷。
