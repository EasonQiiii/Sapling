- id: G5V1-101
  answer: 平行四边形面积 = 底 × 高：3000 × 3500 = 10500000（平方米）；10500000 ÷ 10000 = 1050，合 1050 公顷（依据 1 公顷 = 10000 平方米，平方米换算成公顷除以 10000）
  answer_note: 数值题，题干已给底约 3000 米、高约 3500 米，数据完整；先按平行四边形面积公式求面积，再换算成公顷。
- id: G5V1-104
  answer: 已知的一组：5 平方千米 = 500 公顷，500 > 480，所以填"＞"。其余三组数据在教材原题插图中，均按同一方法比较：先把两个量统一成相同的面积单位（依据 1 平方千米 = 100 公顷 = 1000000 平方米，1 公顷 = 10000 平方米），再比较大小、填出比较符号。
  answer_note: 比较大小填符号题。题干只明确给出"5 平方千米与 480 公顷"这一组，逐组作答时不能编造其余各组的数值；完成标准：对每组先把单位统一，再正确填出"＞""＜"或"＝"。
- id: G5V1-105
  answer: 我国陆地面积约 960 万平方千米；海域面积约 470 多万平方千米
  answer_note: 选单位题。理由：计量国土、海域这样很大的面积，通常用"平方千米"作单位（1 平方千米 = 1000000 平方米），用"平方米"或"公顷"数值会过大，不符合实际。
- id: G5V1-106
  answer: 长江全长约 6300 千米；流域面积约 178 万平方千米
  answer_note: 选单位题。理由：计量河流全长用长度单位"千米"；计量流域这样的大面积用面积单位"平方千米"。
- id: G5V1-107
  answer: 吐鲁番盆地面积约 1.57 万平方千米
  answer_note: 选单位题。理由：盆地面积很大，用"平方千米"作单位合适；若用"公顷"或"平方米"，数值会过大，不符合实际。
- id: G5V1-108
  answer: 每块盐田面积 = 长 × 宽：100 × 60 = 6000（平方米）；50 块共：6000 × 50 = 300000（平方米）；300000 ÷ 10000 = 30，一共占地 30 公顷（依据 1 公顷 = 10000 平方米）
  answer_note: 数值题，题干已给每块长 100 米、宽 60 米、共 50 块，数据完整；先算每块面积，再算总面积，最后换算成公顷。
- id: G5V1-109
  answer: 正方形面积：8 × 8 = 64（平方厘米）。剪去的是两条中点连线围成的直角三角形，两条直角边各为 8 ÷ 2 = 4（厘米），三角形面积：4 × 4 ÷ 2 = 8（平方厘米）；剩下纸的面积：64 − 8 = 56（平方厘米）
  answer_note: 数值题，题干已给正方形边长 8 厘米，且剪去三角形的两条直角边各为边长的一半（4 厘米），数据完整；用正方形面积减去三角形面积。
- id: G5V1-113
  answer: null
  answer_note: 活动题（描轮廓与估计）。每个人的手印大小不同，不能预先给出唯一数值。完成标准：能把手掌按在方格纸上描出手印轮廓；数出手印占的整格数与不完整格数；选择合理的方法（如整格加不完整格折半等）估计出手印的面积（带单位），估计过程与方法合理。
- id: G5V1-114
  answer: 校园长 120 米、宽 83 米；总面积 1 公顷；绿化面积 4500 平方米
  answer_note: 选单位题。理由：120 和 83 是校园的边长，用长度单位"米"；由 120 × 83 = 9960（平方米），1 公顷 = 10000 平方米，9960 平方米接近 1 公顷，所以总面积填"公顷"；4500 与 9960 相比是其中一部分，用"平方米"合适。
- id: G5V1-115
  answer: 玄武湖水面面积约 378.13 公顷
  answer_note: 选单位题。理由：湖泊水面面积较大，用"公顷"作单位合适（1 公顷 = 10000 平方米）；若用"平方米"，数值会过大；若用"平方千米"，数值会小于 1，也不合适。
- id: G5V1-116
  answer: 香港特别行政区陆地面积约 1106 平方千米
  answer_note: 选单位题。理由：计量一个行政区的陆地面积，用"平方千米"作单位合适。
- id: G5V1-117
  answer: 70000 ÷ 10000 = 7，70000 平方米 = 7 公顷；7000000 ÷ 1000000 = 7，7000000 平方米 = 7 平方千米；45 × 100 = 4500，45 平方千米 = 4500 公顷；800 ÷ 100 = 8，800 公顷 = 8 平方千米
  answer_note: 单位换算题，四组逐组给出。依据：1 公顷 = 10000 平方米，1 平方千米 = 100 公顷 = 1000000 平方米；高级单位换算成低级单位乘进率，低级单位换算成高级单位除以进率。
