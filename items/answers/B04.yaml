  answer_note: 活动题（采集与估计）。树叶大小因人而异，不能预先给出唯一数值。完成标准：能采集一片树叶，把轮廓描在方格纸上；数出树叶占的整格数与不完整格数；选择合理的方法估计出树叶的面积（带单位），估计方法合理、结果与树叶实际大小相符。
