- id: G5V1-201
  answer: 摸 40 次，红球 26 次、黄球 9 次、蓝球 5 次，摸到红球的次数远多于黄球和蓝球，推测盒子里红色玻璃球最多。
  answer_note: 结论题，题干已给试验数据（红 26、黄 9、蓝 5），数据完整。依据：摸到某种颜色的次数多，该颜色的球就多；红球次数最多，所以红色玻璃球多（黄球次之，蓝球最少）。
- id: G5V1-202
  answer: null
  answer_note: 活动题。按推测结果（盒中红球多）继续做摸球游戏并记录，答案需由实际操作得出。完成标准：明确继续摸球的总次数并如实记录各颜色出现的次数；对照数据检验推测——若摸到红球的次数仍明显多于其他颜色，则与推测相符，推测合理；若差异明显，需重新分析推测；能结合数据说明推测与试验结果是否相符。
- id: G5V1-203
  answer: 示例（方法不唯一，此为一例）：做 6 个纸团，分别标上 1～6 号，让 6 名同学依次从中各摸一个，摸到几号就第几个出场。这样公平，因为 6 个纸团除号码外完全一样，每人摸到每个号码的机会均等，谁都有可能摸到任何出场顺序。
  answer_note: 设计题（也可作开放题），6 名决赛同学在题干中已明确，确定出场顺序的方法不唯一（如抽签、抓阄等任选一种）。完成标准：方法操作可行；能说明公平的理由——每种出场顺序对每人来说机会均等。
