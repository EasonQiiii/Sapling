- id: G5V1-192
  answer: 朝上的数字可能是 1、2、3、4、5、6，共 6 种结果；各种结果的可能性相等。因为正方体六个面大小相同，每个数字各占一个面，每个数字朝上的机会均等。
  answer_note: 结论题，题干已给六个面标 1～6，数据完整。依据：可能出现的结果由六个面的数字决定，共 6 种；六个面一样大，所以每种结果的可能性相等。
