# 苏教版五年级上册 五、可能性 G5V1-182 ~ G5V1-203 答案补全
- id: G5V1-182
  answer: 示例（放法不唯一，此为一例）：要使摸出的球不可能是绿球，袋里放红球和黄球（不放绿球），因为袋中没有绿球，所以不可能摸到绿球；要使摸出的球可能是绿球，袋里放绿球和红球，因为袋中有绿球也有其他颜色的球，所以可能摸到绿球；要使摸出的球一定是绿球，袋里全部放绿球，因为袋中只有绿球，所以摸出的一定是绿球。
  answer_note: 设计题，三种放球要求在题干中完整给出，答案不唯一。完成标准：每种放法都符合相应要求（不含绿球→不可能；有绿球也有其他颜色→可能；全是绿球→一定），并能说出理由，理由对应"一定、可能、不可能"的含义。
- id: G5V1-183
  answer: 结果只有 1 种：摸出的都是红桃 A。因为 5 张扑克牌完全相同（都是红桃 A），任意摸出一张，牌面都是红桃 A，没有别的结果。
  answer_note: 结论题，题干已给"5 张都是红桃 A"，数据完整。依据：可能出现的结果由牌的构成决定，5 张牌面相同，所以结果只有红桃 A 一种。
