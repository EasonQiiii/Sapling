# 苏教版五年级上册 五、可能性 G5V1-182 ~ G5V1-203 答案补全
- id: G5V1-182
  answer: 示例（放法不唯一，此为一例）：要使摸出的球不可能是绿球，袋里放红球和黄球（不放绿球），因为袋中没有绿球，所以不可能摸到绿球；要使摸出的球可能是绿球，袋里放绿球和红球，因为袋中有绿球也有其他颜色的球，所以可能摸到绿球；要使摸出的球一定是绿球，袋里全部放绿球，因为袋中只有绿球，所以摸出的一定是绿球。
  answer_note: 设计题，三种放球要求在题干中完整给出，答案不唯一。完成标准：每种放法都符合相应要求（不含绿球→不可能；有绿球也有其他颜色→可能；全是绿球→一定），并能说出理由，理由对应"一定、可能、不可能"的含义。
- id: G5V1-183
  answer: 结果只有 1 种：摸出的都是红桃 A。因为 5 张扑克牌完全相同（都是红桃 A），任意摸出一张，牌面都是红桃 A，没有别的结果。
  answer_note: 结论题，题干已给"5 张都是红桃 A"，数据完整。依据：可能出现的结果由牌的构成决定，5 张牌面相同，所以结果只有红桃 A 一种。
- id: G5V1-192
  answer: 朝上的数字可能是 1、2、3、4、5、6，共 6 种结果；各种结果的可能性相等。因为正方体六个面大小相同，每个数字各占一个面，每个数字朝上的机会均等。
  answer_note: 结论题，题干已给六个面标 1～6，数据完整。依据：可能出现的结果由六个面的数字决定，共 6 种；六个面一样大，所以每种结果的可能性相等。
- id: G5V1-195
  answer: 示例（写法不唯一，此为一例）：想使推测的难度小一些，在 10 张卡片中写 9 张"唱歌"、1 张"跳舞"，两种张数悬殊明显，别人容易推测出"唱歌"多；想使推测的难度大一些，写 5 张"唱歌"、5 张"跳舞"，两种张数相等，别人很难推测哪种多。
  answer_note: 设计题，要求在题干中完整给出（10 张卡片写"唱歌""跳舞"，分别使推测难度小一些、大一些），答案不唯一。完成标准：难度小→两种张数悬殊；难度大→两种张数接近（如各 5 张）；能说明张数与可能性大小的关系（张数悬殊易推测，张数接近难推测）。
- id: G5V1-196
  answer: 示例（放法不唯一，此为一例，每袋 6 个球）：摸出红球的可能性比黄球小——放 1 个红球、5 个黄球；一定摸出红球——6 个全放红球；不可能摸出红球——6 个全放黄球（不放红球）；摸出红球的可能性比黄球大——放 5 个红球、1 个黄球。
  answer_note: 设计题，四种要求在题干中完整给出且每袋 6 个球，答案不唯一。完成标准：每种放法都符合相应要求（红球少黄球多→红比黄可能性小；全红→一定；无红→不可能；红多黄少→红比黄可能性大），并能依据"某种球多→摸到的可能性大"说明理由。
- id: G5V1-201
  answer: 摸 40 次，红球 26 次、黄球 9 次、蓝球 5 次，摸到红球的次数远多于黄球和蓝球，推测盒子里红色玻璃球最多。
  answer_note: 结论题，题干已给试验数据（红 26、黄 9、蓝 5），数据完整。依据：摸到某种颜色的次数多，该颜色的球就多；红球次数最多，所以红色玻璃球多（黄球次之，蓝球最少）。
- id: G5V1-203
  answer: 示例（方法不唯一，此为一例）：做 6 个纸团，分别标上 1～6 号，让 6 名同学依次从中各摸一个，摸到几号就第几个出场。这样公平，因为 6 个纸团除号码外完全一样，每人摸到每个号码的机会均等，谁都有可能摸到任何出场顺序。
  answer_note: 设计题（也可作开放题），6 名决赛同学在题干中已明确，确定出场顺序的方法不唯一（如抽签、抓阄等任选一种）。完成标准：方法操作可行；能说明公平的理由——每种出场顺序对每人来说机会均等。
