  answer_note: 开放题。三张记录单的具体记录数据在教材第 72 页插图中，题干未转写数据，不能编造。完成标准：从图中读出三张记录单各自红球、蓝球的次数；袋中 8 根小棒有 5 红 3 蓝，摸到红球的机会明显大于蓝球（约 5:3），40 次中摸到红球的次数应明显多于蓝球；最可能的结果是红球次数明显多于蓝球且与 5:3 比例接近的那张记录单，并说明理由。
- id: G5V1-195
  answer: 示例（写法不唯一，此为一例）：想使推测的难度小一些，在 10 张卡片中写 9 张"唱歌"、1 张"跳舞"，两种张数悬殊明显，别人容易推测出"唱歌"多；想使推测的难度大一些，写 5 张"唱歌"、5 张"跳舞"，两种张数相等，别人很难推测哪种多。
  answer_note: 设计题，要求在题干中完整给出（10 张卡片写"唱歌""跳舞"，分别使推测难度小一些、大一些），答案不唯一。完成标准：难度小→两种张数悬殊；难度大→两种张数接近（如各 5 张）；能说明张数与可能性大小的关系（张数悬殊易推测，张数接近难推测）。
- id: G5V1-196
  answer: 示例（放法不唯一，此为一例，每袋 6 个球）：摸出红球的可能性比黄球小——放 1 个红球、5 个黄球；一定摸出红球——6 个全放红球；不可能摸出红球——6 个全放黄球（不放红球）；摸出红球的可能性比黄球大——放 5 个红球、1 个黄球。
  answer_note: 设计题，四种要求在题干中完整给出且每袋 6 个球，答案不唯一。完成标准：每种放法都符合相应要求（红球少黄球多→红比黄可能性小；全红→一定；无红→不可能；红多黄少→红比黄可能性大），并能依据"某种球多→摸到的可能性大"说明理由。
