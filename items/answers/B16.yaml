  answer_note: 6 个同样的茶杯用去"6×茶杯单价"，1 个茶盘用去"茶盘单价"，总钱数=6×茶杯单价+茶盘单价。茶杯单价可能是 a、b、c 中的一种，茶盘单价可能是 m、n 中的一种，所以可能用的钱数有 6a+m、6a+n、6b+m、6b+n、6c+m、6c+n 共 6 种，用含字母的式子表示（数与字母相乘乘号省略）。
