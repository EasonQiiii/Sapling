- id: G5V1-367
  answer: 因数关系：1 是 2、5、4、10、20、25 的因数；2 是 4、10、20 的因数；5 是 10、20、25 的因数；4 是 20 的因数；10 是 20 的因数。倍数关系（上述的反向表述）：4、10、20 都是 2 的倍数；10、20、25 都是 5 的倍数；20 是 4、10 的倍数；20 是 10 的倍数。
  answer_note: 因数倍数判断题。依据：若 a÷b=c（a、b、c 均为非零自然数，无余数），则 b 是 a 的因数、a 是 b 的倍数。逐对检验：20÷4=5、20÷10=2，所以 4、10 是 20 的因数；10÷5=2、25÷5=5，所以 5 是 10、25 的因数；20÷5=4，5 是 20 的因数；10÷2=5、20÷2=10，2 是 10、20 的因数；4÷2=2，2 是 4 的因数；1 能整除所有非零自然数，所以 1 是其余各数的因数。本题按"谁是谁的因数/倍数"逐对说清即可，叙述顺序可不同。
- id: G5V1-368
  answer: 9 和 12：最大公因数 3，最小公倍数 36；24 和 6：最大公因数 6，最小公倍数 24；5 和 7：最大公因数 1，最小公倍数 35；30 和 25：最大公因数 5，最小公倍数 150。
  answer_note: 求最大公因数与最小公倍数。依据：9 和 12 的公因数只有 3，9×12÷3=36；24 和 6 中 6 是 24 的因数，成倍数关系时较小数 6 是最大公因数、较大数 24 是最小公倍数；5 和 7 只有公因数 1，互质时最大公因数是 1、最小公倍数是 5×7=35；30 和 25 的公因数有 1、5，最大是 5，最小公倍数 30×25÷5=150。
- id: G5V1-369
  answer: 38 = 2 × 19；87 = 3 × 29；65 = 5 × 13。
  answer_note: 分解质因数。依据：38=2×19，2 和 19 都是质数；87=3×29，3 和 29 都是质数；65=5×13，5 和 13 都是质数。每个数恰好都能写成两个质数相乘的形式，括号里填的就是这些质数。
- id: G5V1-370
  answer: 每行最多排 6 人；男生 24÷6=4（行），女生 30÷6=5（行）。
  answer_note: 理由："每行人数相同"说明每行人数既是 24 的因数又是 30 的因数，即 24 和 30 的公因数；要"最多"，就是求 24 和 30 的最大公因数。24 和 30 的公因数有 1、2、3、6，最大是 6，所以每行最多 6 人，男生排 4 行、女生排 5 行。
- id: G5V1-371
  answer: 1.4×23=32.2；0.16×45=7.2；75.6÷18=4.2；15÷40=0.375。
  answer_note: 竖式计算并验算，乘除互逆检验：32.2÷23=1.4，与原题被乘数一致，第一题正确；7.2÷45=0.16，与原题被乘数一致，第二题正确；4.2×18=75.6，与原被除数一致，第三题正确；0.375×40=15，与原被除数一致，第四题正确。要点：小数乘法先按整数乘法算，再看因数中一共有几位小数，从积的右边起数出几位点上小数点（0.16×45 末尾有 0 要先点小数点再化简 7.20→7.2）；除数是整数的小数除法按整数除法的方法算，商的小数点要和被除数的小数点对齐（15÷40 除到被除数末尾仍有余数时，在被除数后面添 0 继续除）。
- id: G5V1-373
  answer: 0.049×45=2.205（亿个），狗的嗅觉细胞大约有 2.205 亿个。
  answer_note: 求一个数的几倍是多少用乘法。依据：狗的嗅觉细胞约是人的 45 倍，人的约 0.049 亿个，所以 0.049×45。竖式先算 49×45=2205，因数中共有 3 位小数，从右起数 3 位点上小数点得 2.205。
- id: G5V1-374
  answer: 1.5÷6=0.25（升），0.25 升=250 毫升，每杯 0.25 升，合 250 毫升。
  answer_note: 把 1.5 升平均分成 6 份用除法：1.5÷6=0.25 升。单位换算依据：1 升=1000 毫升，0.25×1000=250，所以 0.25 升合 250 毫升。
- id: G5V1-375
  answer: 朝上的数可能是 1、2 或 3，共 3 种可能，且这 3 种结果出现的可能性相等；朝上的数是奇数的可能性大。
  answer_note: 正方体六个面分别标 1、1、2、2、3、3，朝上的数只能落在所标的数中，所以可能是 1、2、3；每个数都占 2 个面，所以 3 种结果可能性相等。判断可能性：奇数有 1、3 两种，占 1+1+3+3=4 个面；偶数只有 2，占 2+2=2 个面。4>2，所以朝上的数是奇数的可能性大。
- id: G5V1-376
  answer: 45÷500×100=9（升），每 100 千米耗油 9 升。
  answer_note: 先求每千米耗油量 45÷500=0.09 升，再求 100 千米耗油 0.09×100=9 升；也可列综合算式 45÷500×100=9 升。依据：耗油量÷行驶路程=每千米耗油量，每千米耗油量×100=每 100 千米耗油量。
- id: G5V1-377
  answer: 3.6+(a+6.4)=a+(3.6+6.4)=a+10；4×a×25=(4×25)×a=100a；3x+2x=5x。
  answer_note: 第一空填 a（先用加法交换律把 a 换到前面），再填 3.6 和 6.4（加法结合律先凑整），得 a+10；第二空填 a、4 和 25（乘法交换律、结合律），4×25=100，得 100a；第三空依据乘法分配律的逆用（合并同类项）：3 个 x 加 2 个 x 是 5 个 x，得 5x。
- id: G5V1-378
  answer: 20000×t（写作 20000t），打 t 分钟消耗的热量是 20000t 焦。
  answer_note: 每分钟消耗 20000 焦，打 t 分钟就消耗 t 个 20000 焦，用乘法表示为 20000×t 焦；字母与数相乘时乘号可省略不写，数在前字母在后，所以写作 20000t 焦。
- id: G5V1-379
  answer: p = 20000t。
  answer_note: 热量 p（焦）= 每分钟消耗的热量 20000（焦）× 打球时间 t（分钟），即 p = 20000t。这是用含有字母的等式表示的两个量之间的关系。
- id: G5V1-380
  answer: a−10=b−10；a·p=b·p；a+q=b+q（□ 里填 q）；a÷7=b÷7（□ 里填 7）。
  answer_note: 依据等式的性质：等式两边同时加上或减去同一个数，等式仍然成立，所以第一个□填 10、第三个□填 q；等式两边同时乘同一个数，等式仍然成立，所以第二个□填 p；等式两边同时除以同一个不为 0 的数，等式仍然成立，所以第四个□填 7。每题两边施加的运算必须完全相同。
- id: G5V1-381
  answer: 5 公顷=50000 平方米；0.03 平方千米=3 公顷；90000 平方米=9 公顷；450 公顷=4.5 平方千米。
  answer_note: 换算依据：1 公顷=10000 平方米，1 平方千米=100 公顷。5×10000=50000，所以 5 公顷=50000 平方米；0.03×100=3，所以 0.03 平方千米=3 公顷；90000÷10000=9，所以 90000 平方米=9 公顷；450÷100=4.5，所以 450 公顷=4.5 平方千米。高级单位化低级单位乘进率，低级单位化高级单位除以进率。
- id: G5V1-383
  answer: 600×300=180000（平方米），180000 平方米=18 公顷；18×6000=108000（千克），108000 千克=108 吨；108 吨>100 吨，这块地能收 100 吨以上的小麦。
  answer_note: 平行四边形面积=底×高=600×300=180000 平方米，1 公顷=10000 平方米，180000÷10000=18 公顷。每公顷收 6000 千克，18×6000=108000 千克；1 吨=1000 千克，108000÷1000=108 吨。108>100，所以能收 100 吨以上。
- id: G5V1-385
  answer: 3.6 米=36 分米，3 米=30 分米；36×30=1080（平方分米），6×6=36（平方分米），1080÷36=30（块），至少需要 30 块方砖。
  answer_note: 先统一单位：1 米=10 分米，3.6 米=36 分米、3 米=30 分米。餐厅面积 36×30=1080 平方分米；每块方砖面积 6×6=36 平方分米；需要块数=餐厅面积÷每块砖面积=1080÷36=30 块。
