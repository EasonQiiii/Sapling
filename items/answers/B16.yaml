  answer: 3.6+(a+6.4)=a+(3.6+6.4)=a+10；4×a×25=(4×25)×a=100a；3x+2x=5x。
  answer_note: 第一空填 a（先用加法交换律把 a 换到前面），再填 3.6 和 6.4（加法结合律先凑整），得 a+10；第二空填 a、4 和 25（乘法交换律、结合律），4×25=100，得 100a；第三空依据乘法分配律的逆用（合并同类项）：3 个 x 加 2 个 x 是 5 个 x，得 5x。
