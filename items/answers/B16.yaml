  answer: a−10=b−10；a·p=b·p；a+q=b+q（□ 里填 q）；a÷7=b÷7（□ 里填 7）。
  answer_note: 依据等式的性质：等式两边同时加上或减去同一个数，等式仍然成立，所以第一个□填 10、第三个□填 q；等式两边同时乘同一个数，等式仍然成立，所以第二个□填 p；等式两边同时除以同一个不为 0 的数，等式仍然成立，所以第四个□填 7。每题两边施加的运算必须完全相同。
