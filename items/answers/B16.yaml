  answer_note: 开放题（作图题）：点 A、B 的位置在教材插图的方格纸上，未转写，点 C 须学生自己画。完成标准：画出的三角形 ABC 必须是等腰三角形且不能是等边三角形（等边三角形有 3 条对称轴，不满足"只有 1 条"）。画法思路：若把 AB 看作底边，点 C 应画在 AB 的垂直平分线上（使 AC=BC，且 AC≠AB）；若把 AB 看作腰，则 C 须使 AC=AB 或 BC=AB，且第三条边不等于这两条腰。同时 A、B、C 三点不能在同一条直线上。画完后能说明画在哪里、为什么这个三角形只有 1 条对称轴（对称轴是过顶点 C（或 A、B）与对边中点的连线所在直线，只有 1 条）。
