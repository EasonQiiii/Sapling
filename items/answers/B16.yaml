  answer: 共有 6 种不同的搭配。依据：1 个茶杯可以配 m、n 两种茶盘，有 2 种搭配；3 种茶杯就有 3 个 2 种，3×2=6（种）。
  answer_note: 搭配问题。每个茶杯都能与 2 种茶盘中的任意一种搭配，即每个茶杯有 2 种配法；茶杯有 a、b、c 三种，所以总搭配数=茶杯种数×茶盘种数=3×2=6 种。列举出来是：(a,m)、(a,n)、(b,m)、(b,n)、(c,m)、(c,n)，恰好 6 种，与计算结果一致。
