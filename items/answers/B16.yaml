  answer: 38 = 2 × 19；87 = 3 × 29；65 = 5 × 13。
  answer_note: 分解质因数。依据：38=2×19，2 和 19 都是质数；87=3×29，3 和 29 都是质数；65=5×13，5 和 13 都是质数。每个数恰好都能写成两个质数相乘的形式，括号里填的就是这些质数。
