  answer: 可能出现的结果有 9 种（摸到 1～9 任何一张都可能）；摸出 2 的倍数的可能性大。
  answer_note: 卡片 1～9 每个数字一张，摸一张有 9 种等可能的结果。2 的倍数有 2、4、6、8 共 4 张；3 的倍数有 3、6、9 共 3 张。4>3，所以摸出 2 的倍数的可能性大。（注：卡片 6 既是 2 的倍数又是 3 的倍数，比较时各自按自己包含的张数算。）
