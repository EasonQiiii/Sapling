- id: G5V1-367
  answer: 因数关系：1 是 2、5、4、10、20、25 的因数；2 是 4、10、20 的因数；5 是 10、20、25 的因数；4 是 20 的因数；10 是 20 的因数。倍数关系（上述的反向表述）：4、10、20 都是 2 的倍数；10、20、25 都是 5 的倍数；20 是 4、10 的倍数；20 是 10 的倍数。
  answer_note: 因数倍数判断题。依据：若 a÷b=c（a、b、c 均为非零自然数，无余数），则 b 是 a 的因数、a 是 b 的倍数。逐对检验：20÷4=5、20÷10=2，所以 4、10 是 20 的因数；10÷5=2、25÷5=5，所以 5 是 10、25 的因数；20÷5=4，5 是 20 的因数；10÷2=5、20÷2=10，2 是 10、20 的因数；4÷2=2，2 是 4 的因数；1 能整除所有非零自然数，所以 1 是其余各数的因数。本题按"谁是谁的因数/倍数"逐对说清即可，叙述顺序可不同。
- id: G5V1-368
  answer: 9 和 12：最大公因数 3，最小公倍数 36；24 和 6：最大公因数 6，最小公倍数 24；5 和 7：最大公因数 1，最小公倍数 35；30 和 25：最大公因数 5，最小公倍数 150。
  answer_note: 求最大公因数与最小公倍数。依据：9 和 12 的公因数只有 3，9×12÷3=36；24 和 6 中 6 是 24 的因数，成倍数关系时较小数 6 是最大公因数、较大数 24 是最小公倍数；5 和 7 只有公因数 1，互质时最大公因数是 1、最小公倍数是 5×7=35；30 和 25 的公因数有 1、5，最大是 5，最小公倍数 30×25÷5=150。
