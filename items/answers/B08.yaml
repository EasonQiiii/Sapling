# 苏教版五年级上册 四、小数乘法和除法（一） G5V1-171 ~ G5V1-181 答案补全
- id: G5V1-174
  answer: 605 ÷ 1000 = 0.605（吨）
  answer_note: 数值题，题干已给 1000 吨铁矿石炼铁 605 吨，数据完整；求平均每吨铁矿石炼铁多少吨，用"炼铁总量 ÷ 铁矿石总量"列式，605 除以 1000 小数点向左移动三位得 0.605，结果带单位。
- id: G5V1-175
  answer: 14 ÷ 10 = 1.4，14 ÷ 100 = 0.14，1.4 > 0.14，填＞；0.52 × 100 = 52，0.52 × 1000 = 520，52 < 520，填＜。题干注明共 4 组，其余 2 组算式在教材第 63 页未转写，方法相同：先分别算出两边的结果，再比较大小填符号。
  answer_note: 部分可答的结论题（比较大小）。已转写的两组：先按小数点移动规律算出各式的结果，再比较——14÷10 得 1.4，14÷100 得 0.14，1.4 > 0.14，填＞；0.52×100 得 52，0.52×1000 得 520，52 < 520，填＜。其余 2 组算式在教材中未转写，完成标准：先分别算出两边结果再比较，填出正确的符号。
- id: G5V1-176
  answer: 64.8 ÷ 18 = 3.6；验算：3.6 × 18 = 64.8，与被除数相同，计算正确。题干注明共 4 道，其余 3 道算式在教材第 64 页未转写，方法相同：先按小数除以整数的方法计算，再用商乘除数验算。
  answer_note: 部分可答的数值题（计算与验算）。已转写的一道：64.8÷18，按整数除法的方法从高位除起，商 3.6（商的小数点与被除数的小数点对齐）；用乘法验算 3.6×18=64.8，看结果是否等于被除数。其余 3 道在教材中未转写，完成标准：逐题计算并用乘法验算，验算结果与被除数相同。
- id: G5V1-177
  answer: 1 千克小麦可加工面粉：78 ÷ 100 = 0.78（千克）；1 吨小麦可加工面粉：1 吨 = 1000 千克，0.78 × 1000 = 780（千克）
  answer_note: 数值题，题干已给 100 千克小麦加工成 78 千克面粉，数据完整；第一问用"面粉总量 ÷ 小麦总量"列式，78 除以 100 小数点向左移动两位得 0.78 千克；第二问先把 1 吨化成 1000 千克，再用"每千克加工量 × 1000"（小数点向右移动三位）得 780 千克，结果带单位。
- id: G5V1-178
  answer: 8.8 × 25 = 220（千米），220 千米 > 200 千米，所以中途不需要加油。
  answer_note: 数值题（判断），题干已给油箱有 25 升汽油、每升可行驶 8.8 千克对应的里程 8.8 千米/升及目标 200 千米，数据完整；先算 25 升汽油一共能行驶多少千米（8.8×25=220 千米），再与 200 千米比较，220 > 200，得出"中途不需要加油"的判断并说明理由。
- id: G5V1-179
  answer: 113 ÷ 80 = 1.4125 ≈ 1.41，猎豹速度大约是羚羊的 1.41 倍
  answer_note: 数值题，题干已给猎豹速度 113 千米/时、羚羊速度 80 千米/时，数据完整；求一个数是另一个数的多少倍用除法，113÷80=1.4125，除不尽，按惯例得数保留两位小数约 1.41 倍（近似值要注明"大约"）。
- id: G5V1-181
  answer: 甲数的小数点向右移动一位等于乙数，即乙数是甲数的 10 倍，甲 + 乙 = 甲数的 11 倍 = 16.5，所以甲数 = 16.5 ÷ 11 = 1.5，乙数 = 1.5 × 10 = 15。验算：1.5 + 15 = 16.5，1.5 的小数点向右移动一位是 15，符合题意。
  answer_note: 结论题（推理），题干数据完整；关键是把"甲数小数点向右移动一位等于乙数"翻译成"乙数是甲数的 10 倍"，则两数之和是甲数的 11 倍，用 16.5÷11 求出甲数 1.5，再乘 10 得乙数 15，最后代回原条件验算（和为 16.5、小数点移动后为 15）确认正确。
