- id: G5V1-075
  answer: 平行四边形面积 = 底 × 高：20 × 16 = 320（平方米）
  answer_note: 数值题，题干已给底 20 米、高 16 米，数据完整。
- id: G5V1-078
  answer: 三角形面积 = 底 × 高 ÷ 2：7 × 6 ÷ 2 = 21（平方分米）
  answer_note: 数值题，题干已给底 7 分米、高约 6 分米，数据完整。
- id: G5V1-080
  answer: 梯形面积 =（上底 + 下底）× 高 ÷ 2：(36 + 54) × 40 ÷ 2 = 90 × 40 ÷ 2 = 1800（平方米）
  answer_note: 数值题，题干已给上底 36 米、下底 54 米、高 40 米，数据完整。
- id: G5V1-084
  answer: 平行四边形面积：6 × 2 = 12（平方米）；制作费：12 × 150 = 1800（元）
  answer_note: 数值题，题干已给底 6 米、高 2 米、每平方米 150 元，数据完整；先算面积再算总价。
- id: G5V1-087
  answer: 三角形面积：54 × 40 ÷ 2 = 1080（平方米）；桃树棵数：1080 ÷ 6 = 180（棵）
  answer_note: 数值题，题干已给底 54 米、高 40 米、每棵占地 6 平方米，数据完整；先算面积再按占地求棵数。
- id: G5V1-091
  answer: 画出的梯形面积都相等。因为每个梯形的上、下底之和都是 10 厘米，高都是 3 厘米，由梯形面积公式"（上底 + 下底）× 高 ÷ 2"可知：10 × 3 ÷ 2 = 15（平方厘米），与上、下底各是多少无关。
  answer_note: 结论题，题干已给上、下底之和 10 厘米、高 3 厘米，可给出结论与依据：决定梯形面积的只是上、下底之和与高。
- id: G5V1-094
  answer: 画出的三角形面积都相等。理由：这些三角形都以线段 AB 为底（等底），顶点都在另一条平行线上，由"两条平行线间距离处处相等"可知它们的高都等于这两条平行线间的距离（等高）；根据"等底等高的三角形面积相等"，面积都相等。因题干未给出 AB 的长度和平行线间距离，故只能得出面积相等的结论，写不出具体数值。
  answer_note: 结论题。题干未给底和平行线间距离的数值，只需给出"面积都相等"的结论及等底等高的依据。
- id: G5V1-096
  answer: 三角形面积：25 × 22 ÷ 2 = 275（平方米）；鲜花枝数：275 × 50 = 13750（枝）
  answer_note: 数值题，题干已给底 25 米、高 22 米、每平方米年产 50 枝，数据完整；先算面积再算总枝数。
- id: G5V1-097
  answer: 正方形面积：8 × 8 = 64（平方厘米）。由七巧板的分割（正方形的两条对角线与连接对边中点的线段）可知每块占正方形面积的份额：大三角形（2 块）各占四分之一，64 ÷ 4 = 16（平方厘米）；中三角形、正方形、平行四边形各占八分之一，64 ÷ 8 = 8（平方厘米）；小三角形（2 块）各占十六分之一，64 ÷ 16 = 4（平方厘米）。检验：16 × 2 + 8 × 3 + 4 × 2 = 32 + 24 + 8 = 64（平方厘米），与正方形面积相符。
  answer_note: 推理题，题干已给正方形边长 8 厘米，可依据七巧板各拼板与整体面积的倍数关系推出每块面积。
- id: G5V1-098
  answer: 500000 ÷ 10000 = 50，500000 平方米 = 50 公顷；3 × 100 = 300，3 平方千米 = 300 公顷；300 × 10000 = 3000000，300 公顷 = 3000000 平方米，即 3 平方千米 = 3000000 平方米
  answer_note: 单位换算题，依据：1 公顷 = 10000 平方米，1 平方千米 = 100 公顷 = 1000000 平方米。
- id: G5V1-099
  answer: 440000 ÷ 10000 = 44，440000 平方米 = 44 公顷
  answer_note: 单位换算题，依据 1 公顷 = 10000 平方米，平方米换算成公顷除以 10000。
- id: G5V1-100
  answer: 84 × 100 = 8400，84 平方千米 = 8400 公顷
  answer_note: 单位换算题，依据 1 平方千米 = 100 公顷，平方千米换算成公顷乘 100。
