  task: 小红有 20.5 元，买了一支钢笔后还剩 12.8 元。这支钢笔多少元？为什么用减法计算？本题中减法表示的是哪一种意义（去掉一部分、比较两个数量的差，还是求一个加数）？
  kp_main: A3-02
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 20.5 − 12.8 = 7.7（元）。用减法是因为“原有的钱 − 买钢笔用去的钱 = 剩下的钱”，现在已知原有的钱和剩下的钱，求用去的钱，即已知和与一个加数求另一个加数，所以本题中减法表示的是“求一个加数”的意义。
