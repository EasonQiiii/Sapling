  task: 用简便方法计算 25 × 44 时，小明写成 25 × 4 × 11，小红写成 25 × (40 + 4)。两个人的算法都正确吗？各用了什么运算律？请分别算出结果。
  kp_main: A4-03
  kp_other: []
  thinking: 先选方法或先把情境翻译成数学关系
  figure: null
  answer: 都正确，结果都是 1100。小明：25 × 4 × 11 = 100 × 11 = 1100，把 44 拆成 4 × 11，用的是乘法结合律；小红：25 × (40 + 4) = 25 × 40 + 25 × 4 = 1000 + 100 = 1100，用的是乘法分配律。
