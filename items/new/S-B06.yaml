  task: 判断：“102 × 36 = 100 × 36 + 2 × 36”这个变形对不对？它依据什么运算律？为什么这样算简便？请算出结果。
  kp_main: A4-03
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 对。102 = 100 + 2，依据乘法分配律：(100 + 2) × 36 = 100 × 36 + 2 × 36 = 3600 + 72 = 3672。这样算简便是因为 100 × 36 可以直接写出 3600，把乘 102 化为乘整百数加乘 2。
