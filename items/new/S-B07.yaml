  task: 下面三个比，哪些可以写成除法算式和分数？请写出能写的除法算式和分数，并说明不能写的原因：① 4:5；② 7:0；③ 9:12。
  kp_main: B4-03
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: ① 4÷5，分数 4/5。② 不能写：后项是 0，除数和分母都不能为 0。③ 9÷12，分数 9/12。
  answer_note: 完成标准：①③ 写出除法与分数；② 明确指出后项为 0 因而不能写。
- id: G5V1-S239
  source:
    origin: self
    note: 自编测试题，依据 B5-02（诊断缺口补齐，第七批 S-B07）
  task: 两组量的对应情况是：x 取 2、3、4 时，y 分别是 6、12、10。y 与 x 成正比例吗？请写出各组的比值 y÷x，并说明判断依据。
  kp_main: B5-02
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 不成正比例。各组比值：6÷2=3，12÷3=4，10÷4=2.5，比值不恒定，所以不成正比例。
  answer_note: 判据只能是比值是否一定；不得以同向变化作依据。
