  task: 一个平行四边形的底是 9 厘米，高是 4 厘米，它的面积是多少平方厘米？如果底增加到 12 厘米、高不变，面积增加了多少平方厘米？
  kp_main: C1-08
  kp_other: []
  thinking: 先选方法或先把情境翻译成数学关系
  figure: null
  answer: 原来面积：9 × 4 = 36（平方厘米）；底变为 12 厘米后面积：12 × 4 = 48（平方厘米），增加 48 − 36 = 12（平方厘米）。
