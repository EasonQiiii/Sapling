  task: 用自己的话说出比的基本性质，并说明它与分数的基本性质、商不变的规律之间有什么联系。
  kp_main: B4-04
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 比的基本性质：比的前项和后项同时乘或除以同一个不为 0 的数，比值不变。它与分数的基本性质、商不变的规律本质上是同一条规律：因为比的前项、后项分别相当于分数的分子、分母和除法的被除数、除数，三条性质只是同一规律在不同表达形式中的体现。
