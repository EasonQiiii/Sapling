  task: 妈妈冲糖水时说“糖与水的比是 1:8”。1 和 8 各表示什么？如果写成 8:1 会变成什么意思？请说明比的前项与后项的顺序为什么不能颠倒。
  kp_main: B4-01
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 1 表示糖的份数，8 表示水的份数，糖是水的 1/8。如果写成 8:1，就表示糖是水的 8 倍，糖多水少，意义完全不同。比的前项和后项的顺序表示“谁与谁比”，顺序一换，比较的方向就变了，所以不能颠倒。
