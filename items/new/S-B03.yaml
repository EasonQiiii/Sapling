  task: 一个比的前项和后项同时加上 6，比值一定不变吗？请先判断，再各举一个例子验证，并说明为什么只有“同时乘或除以”才能保证比值不变。
  kp_main: B4-04
  kp_other: []
  thinking: 自己把几个关系串起来
  figure: null
  answer: 不一定不变，一般情况下会变。例如 1:2，前后项同时加 6 得 7:8，比值从 0.5 变为 0.875；又如 2:4，加 6 得 8:10，比值从 0.5 变为 0.8。同时乘或除以同一个数时，前项、后项按相同的倍数缩放，份数关系不变；同时加一个数会破坏这种比例关系，所以比值一般会改变。
