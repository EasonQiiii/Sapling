  task: 用直尺测量线段长度时应注意什么？如果线段从直尺的“1 厘米”刻度量到“7 厘米”刻度，线段实际长多少厘米？请说明理由。
  kp_main: C1-06
  kp_other: []
  thinking: 先选方法或先把情境翻译成数学关系
  figure: null
  answer: 测量时要把线段的一端对准 0 刻度（或某一整刻度），读数时视线要与尺面垂直。从 1 厘米量到 7 厘米，线段长 7 − 1 = 6（厘米）；因为要用终点刻度减去起点刻度，起点前面的 1 厘米不算在内。
