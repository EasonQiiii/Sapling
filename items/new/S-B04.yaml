  task: 钟面被平均分成 12 大格。3 时整，时针和分针所成的角是多少度？6 时整呢？请说明你推算的过程。
  kp_main: C1-01
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 每大格对应的角是 360 ÷ 12 = 30 度。3 时整时针与分针相差 3 大格，成 90 度的直角；6 时整相差 6 大格，成 180 度的平角。
