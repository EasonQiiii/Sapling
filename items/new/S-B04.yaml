  task: 圆的位置和大小分别由什么决定？请说明圆心与半径各自的作用，并用“圆心相同、半径不同的两个圆”和“半径相同、圆心不同的两个圆”分别说明。
  kp_main: C1-04
  kp_other: []
  thinking: 自己把几个关系串起来
  figure: null
  answer: 圆心决定圆的位置，半径决定圆的大小。圆心相同、半径不同的两个圆：位置相同、大小不同（同心圆）；半径相同、圆心不同的两个圆：大小相同、位置不同。
