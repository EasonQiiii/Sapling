  task: 线段、射线、直线各有什么特征？请从“端点个数”和“长度能否度量”两方面比较它们。
  kp_main: C1-01
  kp_other: []
  thinking: 按步骤做
  figure: null
  answer: 线段有 2 个端点，长度可以度量；射线有 1 个端点，向一端无限延伸，长度不可度量；直线没有端点，向两端无限延伸，长度不可度量。
