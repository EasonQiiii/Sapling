  task: 在比例尺为 1:2000000 的地图上，甲、乙两城的图上距离是 4.5 厘米，两城的实际距离是多少千米？请说明每一步换算的依据。
  kp_main: C2-03
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 实际距离 = 4.5 × 2000000 = 9000000（厘米）；9000000 ÷ 100000 = 90（千米）。依据：比例尺 1:2000000 表示实际距离是图上距离的 2000000 倍；1 千米 = 100000 厘米。
