  source:
    origin: self
    note: 自编测试题，依据 C1-01（覆盖补齐，第四批 S-B04）
  task: 有人说：“射线 AB 和射线 BA 是同一条射线。”这种说法对吗？请说明理由。
  kp_main: C1-01
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 不对。射线有一个端点，并向一方无限延伸。射线 AB 表示端点是 A、向 B 的方向延伸；射线 BA 表示端点是 B、向 A 的方向延伸。两者的端点和延伸方向都不同，不是同一条射线。
