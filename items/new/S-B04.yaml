  task: 把一个长 8 厘米、宽 6 厘米的长方形按 1:2 缩小后，它的周长和面积各变为原来的几分之几？请说明理由。
  kp_main: C2-07
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 缩小后长 4 厘米、宽 3 厘米。周长：(4 + 3) × 2 = 14（厘米），原周长 (8 + 6) × 2 = 28（厘米），14 ÷ 28 = 1/2，变为原来的 1/2；面积：4 × 3 = 12（平方厘米），原面积 8 × 6 = 48（平方厘米），12 ÷ 48 = 1/4，变为原来的 1/4。边按相同比例缩小，周长按相同比例缩小，面积按比例的平方缩小。
