  task: 一个图形先按 3:1 放大，再按 2:1 放大，与直接按 6:1 放大，结果一样吗？如果先按 3:1 放大、再按 1:3 缩小，结果又怎样？请通过计算说明理由。
  kp_main: C2-07
  kp_other: []
  thinking: 自己把几个关系串起来
  figure: null
  answer: 按 3:1 放大边长变为原来的 3 倍，再按 2:1 放大变为 3 × 2 = 6 倍，与直接按 6:1 放大结果一样。先按 3:1 放大再按 1:3 缩小：3 × (1/3) = 1，边长回到原来的大小，与原图形完全一样。连续变化的比例可以相乘，乘积决定最终效果。
