  task: 三根小棒长度分别是 3 厘米、4 厘米、8 厘米，能围成三角形吗？请用三角形三边之间的关系说明理由，并说明怎样改动其中一根就能围成。
  kp_main: C1-03
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 不能。3 + 4 = 7（厘米），7 < 8，较短两边的和小于第三边，不满足“任意两边的和大于第三边”。把 8 厘米的小棒换成 6 厘米（或更短但大于 4 厘米）即可，如 3 + 4 = 7 > 6。
