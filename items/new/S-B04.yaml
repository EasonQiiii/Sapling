  task: 两个边长都是 6 厘米的正方形拼成一个长方形，拼成的长方形周长是多少厘米？为什么不是两个正方形周长的和？请说明理由。
  kp_main: C1-07
  kp_other: []
  thinking: 还要说明理由
  figure: null
  answer: 拼成的长方形长 12 厘米、宽 6 厘米，周长 (12 + 6) × 2 = 36（厘米）。两个正方形周长的和是 6 × 4 × 2 = 48（厘米），拼合后中间重合的两条边（各 6 厘米，共 12 厘米）不再是边界，48 − 12 = 36（厘米）。
