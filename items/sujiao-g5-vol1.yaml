  task: 面积为 S 的长方形沿不同方向折成两个相同的正方形或两个相同的直角三角形，用 a 表示正方形面积、b 表示三角形面积，完成 a=b 的推理过程。
  kp_main: B3-03
  kp_other:
  - C1-11
  - B1-04
  thinking: 还要说明理由
  answer: 长方形面积为 S：沿对角线折（剪）成两个相同的直角三角形，每个三角形面积 b = S÷2；折成两个相同的正方形，每个正方形面积 a = S÷2。因为 b=S÷2，a=S÷2，等量的等量相等，所以 a=b。
  answer_note: 推理说理题，题干数据完整。依据：同一个长方形面积是 S，两种折法得到的每一份都是 S 的一半，即 a=S÷2、b=S÷2；两个式子都等于 S÷2，所以 a=b。完成标准：写出 a=S÷2、b=S÷2，并用"等量的等量相等"说明 a=b。
- id: G5V1-332
  source:
    origin: textbook
    unit: 七、用字母表示数量关系（一）
    page: 109
    column: 练习十三
    number: '9'
  task: 判断“任何自然数加上比 0 大的数，结果一定比原数大”是否正确，并用含字母的式子完成推理过程。
  kp_main: B1-05
  kp_other:
  - B1-02
  thinking: 还要说明理由
  answer: 正确。设这个自然数为 n，比 0 大的数为 m（m>0），则 n+m > n+0，而 n+0=n，所以 n+m > n，即结果一定比原数大。
  answer_note: 判断说理题，题干数据完整。依据：任何数加 0 都等于本身（n+0=n），加一个比 0 大的数 m 就是在 n 的基础上再多 m，得 n+m>n。用含字母的式子：因为 m>0，所以 n+m>n+0=n，命题正确。
