- id: G5V1-097
  source:
    origin: textbook
    unit: 三、多边形的面积
    page: 39
    column: 练习四
    number: '17'
  task: 用一副七巧板拼成的正方形边长 8 厘米，推理算出每块拼板的面积各是多少平方厘米。
  kp_main: C1-11
  kp_other:
  - C1-08
  thinking: 自己把几个关系串起来
  answer: 正方形面积：8 × 8 = 64（平方厘米）。由七巧板的分割（正方形的两条对角线与连接对边中点的线段）可知每块占正方形面积的份额：大三角形（2 块）各占四分之一，64 ÷ 4 = 16（平方厘米）；中三角形、正方形、平行四边形各占八分之一，64 ÷ 8 = 8（平方厘米）；小三角形（2 块）各占十六分之一，64 ÷ 16 = 4（平方厘米）。检验：16 × 2 + 8 × 3 + 4 × 2 = 32 + 24 + 8 = 64（平方厘米），与正方形面积相符。
  answer_note: 推理题，题干已给正方形边长 8 厘米，可依据七巧板各拼板与整体面积的倍数关系推出每块面积。
