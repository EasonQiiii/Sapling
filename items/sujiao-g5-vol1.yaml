  answer_note: 求一个数的几倍是多少用乘法。依据：狗的嗅觉细胞约是人的 45 倍，人的约 0.049 亿个，所以 0.049×45。竖式先算 49×45=2205，因数中共有 3 位小数，从右起数 3 位点上小数点得 2.205。
