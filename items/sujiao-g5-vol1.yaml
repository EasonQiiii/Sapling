  task: 换算面积单位：5 公顷、0.03 平方千米、90000 平方米、450 公顷四组。
  kp_main: C1-10
  kp_other: []
  thinking: 按步骤做
  answer: 5 公顷=50000 平方米；0.03 平方千米=3 公顷；90000 平方米=9 公顷；450 公顷=4.5 平方千米。
  answer_note: 换算依据：1 公顷=10000 平方米，1 平方千米=100 公顷。5×10000=50000，所以 5 公顷=50000 平方米；0.03×100=3，所以 0.03 平方千米=3 公顷；90000÷10000=9，所以 90000 平方米=9 公顷；450÷100=4.5，所以 450 公顷=4.5 平方千米。高级单位化低级单位乘进率，低级单位化高级单位除以进率。
