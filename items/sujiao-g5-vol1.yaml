- id: G5V1-002
  source:
    origin: textbook
    unit: 一、图形的运动
    page: 3
    column: 练一练
    number: '1'
  task: 方格纸的同一条横线上画了三个三角形：黄色三角形顶点为（1,1）、（7,1）、（5,3）；蓝色三角形顶点为（7,1）、（13,1）、（11,3）；粉色三角形顶点为（17,1）、（23,1）、（21,3）。哪个三角形向右平移
    10 格可以与粉色三角形重合？另一个三角形需要向右平移多少格才能与粉色三角形重合？
  kp_main: C2-04
  kp_other: []
  thinking: 按步骤做
  figure:
    type: points
    unit: 格
    shapes:
    - name: 黄色三角形
      points:
      - - 1
        - 1
      - - 7
        - 1
      - - 5
        - 3
    - name: 蓝色三角形
      points:
      - - 7
        - 1
      - - 13
        - 1
      - - 11
        - 3
    - name: 粉色三角形
      points:
      - - 17
        - 1
      - - 23
        - 1
      - - 21
        - 3
  answer: 蓝色三角形向右平移 10 格后与粉色三角形重合；黄色三角形需要向右平移 16 格。
- id: G5V1-003
  source:
    origin: textbook
    unit: 一、图形的运动
    page: 5
    column: 试一试
    number: null
  task: 方格纸上画了两组线段：第一组中线段 AB 的端点为 A（4,2）、B（8,2），线段 AB′ 的端点为 B′（4,6）；第二组中线段 CD 的端点为 C（16,5）、D（16,2），线段
    CD′ 的端点为 D′（13,5）。线段 AB 和线段 CD 分别是绕哪个点、按什么方向旋转的？各旋转了多少度？
  kp_main: C2-05
  kp_other: []
  thinking: 按步骤做
  figure:
    type: points
    unit: 格
    shapes:
    - name: 线段AB
      points:
      - - 4
        - 2
      - - 8
        - 2
    - name: 线段AB′
      points:
      - - 4
        - 2
      - - 4
        - 6
    - name: 线段CD
      points:
      - - 16
        - 5
      - - 16
        - 2
    - name: 线段CD′
      points:
      - - 16
        - 5
      - - 13
        - 5
    labels:
      A:
      - 4
      - 2
      B:
      - 8
      - 2
      B′:
      - 4
      - 6
      C:
      - 16
      - 5
      D:
      - 16
      - 2
      D′:
      - 13
      - 5
  answer: 线段 AB 绕点 A 逆时针旋转 90°（点 B 转到点 B′）；线段 CD 绕点 C 顺时针旋转 90°（点 D 转到点 D′）。
