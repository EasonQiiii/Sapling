- id: G5V1-007
  source:
    origin: textbook
    unit: 一、图形的运动
    page: 6
    column: 练一练
    number: 2(追问)
  task: 比较上题中长方形旋转前后的图形，你能发现什么？说明你的依据。
  kp_main: C2-05
  kp_other: []
  thinking: 还要说明理由
  figure: *id001
  answer: 旋转前后，图形的位置变了，形状和大小都没有变。依据：旋转只改变图形的位置和方向，旋转前后对应线段的长度、对应角的大小都不变（图形的形状和大小不变）。
- id: G5V1-008
  source:
    origin: textbook
    unit: 一、图形的运动
    page: 7
    column: 练习一
    number: '1'
  task: 两组平行线：第一组中直线 a 在直线 b 的上方，两线之间的距离标注为 2 cm；第二组中直线 a 在直线 b 的左方，两线之间的距离标注为 5 cm。每组中，直线 a 经过怎样的运动可以与直线
    b 重合？
  kp_main: C2-04
  kp_other: []
  thinking: 按步骤做
  figure:
    type: points
    unit: 格
    shapes:
    - name: 第一组直线a
      points:
      - - 0
        - 8
      - - 12
        - 8
    - name: 第一组直线b
      points:
      - - 0
        - 4
      - - 12
        - 4
    - name: 第二组直线a
      points:
      - - 20
        - 8
      - - 20
        - 0
    - name: 第二组直线b
      points:
      - - 32
        - 8
      - - 32
        - 0
    labels:
      a:
      - 12
      - 8
      b:
      - 12
      - 4
      a(第二组):
      - 20
      - 0
      b(第二组):
      - 32
      - 0
    note: 此图无方格，坐标只表示相对位置；第一组两条线间标注 2 cm，第二组两条线间标注 5 cm。
  answer: 第一组：直线 a 向下平移 2 cm 可与直线 b 重合；第二组：直线 a 向右平移 5 cm 可与直线 b 重合。
