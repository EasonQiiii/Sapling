  kp_main: A3-03
  kp_other:
  - A1-10
  thinking: 还要说明理由
  answer: 2×4=8，0.2×4=0.8；12×3=36，0.12×3=0.36。相同点：都按整数乘法的方法计算；不同点：因数中含有小数时，积是小数——因数中一共有几位小数，就从积的右边起数出几位点上小数点（0.2×4 因数共 1 位小数，积 0.8 也是 1 位；0.12×3 因数共 2 位小数，积 0.36 也是 2 位）
  answer_note: 结论题（计算与比较）。两组算式题干已给出，逐组算出结果，再比较计算方法的相同与不同；核心结论是"计算方法相同（都按整数乘法算），不同在积的小数点位数由因数的小数位数决定"。
