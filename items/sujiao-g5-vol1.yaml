  answer_note: 等式基本性质填空题，题干数据完整。依据：等式两边同加、同减、同乘、同除以同一个数（除数不为 0），等式仍成立。m=n 两边同加 4 得 m+4=n+4；两边同乘 p 得 m·p=n·p；两边同减 17 得 m−17=n−17；两边同除以 q 得 m÷q=n÷q（q 不能是 0）。
