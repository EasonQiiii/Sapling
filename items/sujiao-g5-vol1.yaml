  - C1-07
  thinking: 还要说明理由
  answer: 拼成的平行四边形的周长不唯一，不能只由"两个三角形面积都是 225 平方厘米"确定。理由：面积相等的三角形形状不唯一（如底 30 厘米、高 15 厘米，或底 45 厘米、高 10 厘米，都能拼成面积 225 平方厘米的三角形），两个完全相同的三角形拼成平行四边形时，平行四边形的底和高取决于三角形的底和高，因此周长不唯一；要知道三角形的底和高（即拼成的平行四边形的相邻两边长），才能用"（底 + 高）× 2"算出周长。
  answer_note: 结论题。题干只给两个三角形的面积 225 平方厘米，数据不充分，据面积无法确定三角形的形状与边长，故只能给出"周长不唯一、需知道底和高才能算"的结论及依据，不定唯一数值。
