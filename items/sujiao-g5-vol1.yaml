    number: '12'
  task: 通过举例判断 3 个连续自然数的和是不是一定是 3 的倍数，连续奇数、连续偶数呢，并与同学交流。
  kp_main: A1-03
  kp_other:
  - A1-06
  thinking: 还要说明理由
  answer: 3 个连续自然数的和一定是 3 的倍数。例如 4+5+6=15、7+8+9=24、10+11+12=33，都是 3 的倍数；道理：三个连续自然数可写成 n-1、n、n+1，相加得 (n-1)+n+(n+1)=3n，是 3 的倍数。3 个连续奇数的和也一定是 3 的倍数，例如 1+3+5=9、3+5+7=15、5+7+9=21、7+9+11=27；道理：三个连续奇数可写成 a、a+2、a+4，和为 3a+6=3(a+2)。3 个连续偶数的和同样一定是 3 的倍数，例如 2+4+6=12、4+6+8=18、6+8+10=24；道理：三个连续偶数 a、a+2、a+4 的和为 3a+6=3(a+2)。
  answer_note: 结论题（举例归纳），题干要求通过举例判断并交流。要点：连续三个数（无论连续自然数、连续奇数还是连续偶数）都是等差的，三项之和都等于中间一项的 3 倍，所以三类情形的和都一定是 3 的倍数；作答时每种情形都要举出两三个例子验证，再说明道理（用"中间数×3"表述更直观）。
