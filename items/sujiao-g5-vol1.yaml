  answer_note: 操作记录题，记录步骤不唯一；answer 给出一种可行记录，其他正确记录也可接受。记录必须包含的要素：①每一步移动的是哪一块拼图（按带眼睛/带弧线和原来所在的角辨认）；②运动方式——平移写明方向和格数，旋转写明绕哪个点、什么方向、多少度；③四块拼图的移动顺序，按记录能逐步完成还原。四块的最终位置（直角顶点都在圆心（8,4），四块恰好铺满半径 2 格的圆）：带眼睛的左上拼图在左上，顶点依次为（8,4）、（6,4）、（6.59,5.41）、（8,6）；带眼睛的右上拼图在右上，顶点依次为（8,4）、（10,4）、（9.41,5.41）、（8,6）；带弧线的左下拼图在左下，顶点依次为（8,4）、（6,4）、（6.59,2.59）、（8,2）；带弧线的右下拼图在右下，顶点依次为（8,4）、（10,4）、（9.41,2.59）、（8,2）。
