  answer: 9 的倍数：72、81、99、297。各数各位上数的和：72：7+2=9；81：8+1=9；88：8+8=16；99：9+9=18；297：2+9+7=18；300：3+0+0=3。发现：9 的倍数的各位上数的和也是 9 的倍数（各位上数的和是 9 的倍数的数，就是 9 的倍数）。
  answer_note: 结论题（判断与归纳），题干已给 72、81、88、99、297、300 六个数，数据完整。依据：72÷9=8、81÷9=9、99÷9=11、297÷9=33 都整除，是 9 的倍数；88、300 不能被 9 整除。对比数字和：9 的倍数 72、81、99、297 的数字和 9、9、18、18 都是 9 的倍数，88、300 的数字和 16、3 不是，由此归纳出 9 的倍数的特征。
