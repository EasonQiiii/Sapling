sorting_rule: 文件按课本顺序排：页码从小到大，同一页按栏目（试一试、练一练、单元练习、整理与练习、练习与应用、探索与实践、综合与实践），同一栏目按题号。使用时现算难度：思维方式低→高，同档知识点个数少→多；不另存难度分。知识点为空的题不参与该排序。
