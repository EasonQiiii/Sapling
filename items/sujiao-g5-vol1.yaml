    column: 思考题
    number: null
  task: 甲、乙两数的和是 16.5，甲数的小数点向右移动一位正好等于乙数，求甲、乙两数各是多少。
  kp_main: A2-02
  kp_other:
  - A3-01
  thinking: 自己把几个关系串起来
  answer: 甲数的小数点向右移动一位等于乙数，即乙数是甲数的 10 倍，甲 + 乙 = 甲数的 11 倍 = 16.5，所以甲数 = 16.5 ÷ 11 = 1.5，乙数 = 1.5 × 10 = 15。验算：1.5 + 15 = 16.5，1.5 的小数点向右移动一位是 15，符合题意。
  answer_note: 结论题（推理），题干数据完整；关键是把"甲数小数点向右移动一位等于乙数"翻译成"乙数是甲数的 10 倍"，则两数之和是甲数的 11 倍，用 16.5÷11 求出甲数 1.5，再乘 10 得乙数 15，最后代回原条件验算（和为 16.5、小数点移动后为 15）确认正确。
