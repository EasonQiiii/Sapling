  task: 钟面的圆心为点 O，圆周上标有四个点：A 在正上方、D 在正右方、C 在正下方、B 在正左方。指针从点 O 指向点 A。指针绕点 O 顺时针旋转 90°，从指向点 A 旋转到指向哪个点？指针绕点
    O 逆时针旋转 90°，从指向点 A 旋转到指向哪个点？
  kp_main: C2-05
  kp_other: []
  thinking: 认出来就做
  figure:
    type: points
    unit: 格
    shapes:
    - name: 指针
      points:
      - - 3
        - 3
      - - 3
        - 6
    circles:
    - center:
      - 3
      - 3
      radius: 3
    labels:
      O:
      - 3
      - 3
      A:
      - 3
      - 6
      D:
      - 6
      - 3
      C:
      - 3
      - 0
      B:
      - 0
      - 3
