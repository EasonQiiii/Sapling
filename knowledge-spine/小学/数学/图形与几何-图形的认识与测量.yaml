status: "final"
module:
  id: C1
  name: 图形的认识与测量
  version: "1.0"
  domain: 图形与几何

  description: >
    研究平面图形和立体图形的特征、性质与关系，
    以及长度、角度、周长、面积、表面积和体积的度量。
    通过观察、操作、测量、计算和推理建立几何认识。

  boundary:
    includes:
      - 点、线与角
      - 平面图形的认识与性质
      - 立体图形的认识与性质
      - 长度与角度测量
      - 周长与面积
      - 表面积与体积
      - 度量单位及其换算
      - 物体的观察与形状辨认

    excludes:
      - 图形的位置与运动（C2）
      - 方向、位置与数对（C2）
      - 比例尺（C2）
      - 平移、旋转与轴对称（C2）
      - 图形放大与缩小（C2）
      - 数量关系中的正比例与反比例（B5）
      - 初中阶段的系统几何证明

  knowledge_points:

    - id: C1-01
      name: 点、线与角
      definition: >
        认识点、线段、射线、直线和角等基本几何对象，
        理解其基本特征、相互关系及简单度量方法。
      learning_objectives:
        - 理解点、线段、射线和直线的基本特征
        - 区分线段、射线和直线
        - 理解两点之间线段最短
        - 理解两点间距离的意义
        - 认识同一平面内两条直线的位置关系
        - 理解角由一个顶点和两条射线组成
        - 认识锐角、直角、钝角、平角和周角
        - 会比较角的大小
        - 会测量和画指定度数的角
      diagnostic_dimensions:
        - 基本几何对象辨认
        - 线段、射线与直线辨析
        - 两点间距离理解
        - 平行与相交辨认
        - 垂直关系辨认
        - 角的组成理解
        - 角的类型判断
        - 角度大小比较
        - 角度测量与作图
      prerequisites: []
      curriculum:
        stage_1:
          status: 非核心要求
        stage_2:
          status: 明确要求
          description: >
            认识线段、射线、直线及角，
            理解两点间线段最短，认识平行和垂直。
        stage_3:
          status: 前置知识
      notes:
        - 角度测量归入本知识点，不单独建立角度公式知识点。
        - 平行、垂直作为直线的位置关系，不混入图形运动。

    - id: C1-02
      name: 平面图形的认识与分类
      definition: >
        认识常见平面图形及其组成部分，
        根据边、角、对称性等特征描述、分类和比较图形。
      learning_objectives:
        - 认识三角形、四边形和圆等基本平面图形
        - 认识长方形、正方形、平行四边形和梯形
        - 能根据图形特征进行分类
        - 理解图形之间的包含与从属关系
        - 认识多边形的边、顶点和角
        - 能辨认简单组合图形的组成部分
        - 能利用简单图形进行拼组
      diagnostic_dimensions:
        - 平面图形辨认
        - 图形组成部分辨认
        - 图形特征描述
        - 三角形分类
        - 四边形分类
        - 图形包含关系
        - 组合图形识别
        - 图形拼组
      prerequisites: []
      curriculum:
        stage_1:
          status: 明确要求
          description: 认识常见简单平面图形。
        stage_2:
          status: 明确要求
          description: 认识三角形和四边形并根据特征分类。
        stage_3:
          status: 深化要求
          description: 认识圆、扇形及更多图形特征。
      notes:
        - 三角形的边角性质单独归入 C1-03。
        - 圆和扇形的性质单独归入 C1-04。
        - 图形的平移、旋转和轴对称归入 C2。

    - id: C1-03
      name: 三角形的性质
      definition: >
        研究三角形边和角之间的基本关系，
        包括三角形的分类、边的关系和内角和。
      learning_objectives:
        - 根据边和角的特征识别不同三角形
        - 理解等边三角形和等腰三角形的特征
        - 理解直角三角形的基本特征
        - 理解三角形任意两边之和大于第三边
        - 理解三角形内角和为180度
        - 能根据已知条件计算三角形未知角
        - 能利用三角形性质解决简单问题
      diagnostic_dimensions:
        - 三角形分类
        - 边的关系判断
        - 三角形存在条件
        - 内角和理解
        - 未知角计算
        - 性质综合应用
      prerequisites:
        - C1-01
        - C1-02
      curriculum:
        stage_2:
          status: 基础要求
          description: 认识三角形并进行分类。
        stage_3:
          status: 明确要求
          description: 理解三角形两边之和大于第三边及内角和。
      notes:
        - 三角形面积归入 C1-08。
        - 三角形分类属于图形认识，边角性质属于本知识点。

    - id: C1-04
      name: 圆与扇形的认识
      definition: >
        认识圆和扇形的组成部分及基本特征，
        理解圆心、半径、直径和圆周率之间的关系。
      learning_objectives:
        - 理解圆心、半径和直径的意义
        - 理解同圆或等圆中半径与直径的关系
        - 理解圆的基本特征
        - 认识扇形及其组成部分
        - 理解圆周率的意义
        - 会使用圆规画圆
        - 能根据圆的基本条件确定圆
      diagnostic_dimensions:
        - 圆的组成部分辨认
        - 半径与直径关系
        - 圆的基本性质
        - 扇形识别
        - 圆周率概念
        - 画圆操作
      prerequisites:
        - C1-01
        - C1-02
      curriculum:
        stage_3:
          status: 明确要求
          description: 认识圆和扇形，理解圆周率并掌握圆的相关性质。
      notes:
        - 圆的周长和面积归入 C1-07、C1-08。
        - 圆柱、圆锥归入 C1-05。

    - id: C1-05
      name: 立体图形的认识
      definition: >
        认识常见立体图形的形状、组成部分和基本特征，
        理解立体图形与其表面平面图形之间的关系。
      learning_objectives:
        - 认识长方体、正方体、圆柱和球
        - 认识圆锥
        - 理解长方体和正方体的面、棱、顶点
        - 理解圆柱的底面、侧面和高
        - 理解圆锥的底面、侧面和高
        - 能描述常见立体图形的基本特征
        - 能辨认立体图形的展开图
        - 能理解立体图形与平面展开图的对应关系
        - 能辨认简单物体从不同方向观察到的形状
      diagnostic_dimensions:
        - 立体图形辨认
        - 立体图形特征描述
        - 面、棱、顶点辨认
        - 圆柱组成部分辨认
        - 圆锥组成部分辨认
        - 展开图辨认
        - 展开图与立体图形对应
        - 三视图与观察方向对应
      prerequisites:
        - C1-02
      curriculum:
        stage_1:
          status: 明确要求
          description: 辨认长方体、正方体、圆柱和球。
        stage_2:
          status: 明确要求
          description: 从不同角度观察简单物体并辨认形状。
        stage_3:
          status: 明确要求
          description: 认识长方体、正方体、圆柱和圆锥及其展开图。
      notes:
        - 立体图形表面积和体积归入 C1-09。
        - 观察物体的方向与形状对应归入本知识点。
        - 不把初中复杂空间几何体纳入小学核心范围。

    - id: C1-06
      name: 长度与角度的测量
      definition: >
        通过统一度量单位和测量工具，
        确定线段长度、物体长度及角的大小。
      learning_objectives:
        - 理解测量需要统一的度量单位
        - 认识常用长度单位
        - 能选择合适的长度单位
        - 能使用工具测量长度
        - 能估测物体长度
        - 能使用量角器测量角度
        - 能根据测量要求选择合适工具
      diagnostic_dimensions:
        - 度量单位选择
        - 长度单位理解
        - 长度测量操作
        - 长度估测
        - 测量起点与终点判断
        - 量角器使用
        - 角度测量准确性
      prerequisites:
        - C1-01
      curriculum:
        stage_1:
          status: 明确要求
          description: 认识米、厘米并测量长度。
        stage_2:
          status: 明确要求
          description: 认识千米、分米、毫米并进行长度和角度测量。
        stage_3:
          status: 前置能力
      notes:
        - 长度单位换算归入 C1-10。
        - 角度测量属于 C1-01 与 C1-06 的关联内容。

    - id: C1-07
      name: 图形的周长
      definition: >
        图形边界的长度总和称为周长，
        研究常见平面图形周长的意义和计算方法。
      learning_objectives:
        - 理解周长的意义
        - 能辨认封闭图形的边界
        - 能通过测量获得周长
        - 掌握长方形和正方形周长计算方法
        - 掌握圆周长计算方法
        - 能计算简单组合图形的周长
        - 能解决简单周长实际问题
      diagnostic_dimensions:
        - 周长概念理解
        - 图形边界识别
        - 周长测量
        - 长方形周长计算
        - 正方形周长计算
        - 圆周长计算
        - 组合图形周长分析
        - 周长实际应用
      prerequisites:
        - C1-01
        - C1-02
        - C1-04
        - C1-06
      curriculum:
        stage_2:
          status: 明确要求
          description: 结合实例认识周长并掌握长方形、正方形周长公式。
        stage_3:
          status: 明确要求
          description: 认识圆周率并计算圆的周长。
      notes:
        - 周长与面积是不同的度量对象。
        - 组合图形的周长需要识别外部边界，不能简单相加所有边。

    - id: C1-08
      name: 平面图形的面积
      definition: >
        面积表示平面图形所占平面的大小，
        研究面积单位、面积计算方法及其实际应用。
      learning_objectives:
        - 理解面积的意义
        - 理解面积单位的意义
        - 掌握长方形和正方形面积计算方法
        - 掌握平行四边形面积计算方法
        - 掌握三角形面积计算方法
        - 掌握梯形面积计算方法
        - 掌握圆的面积计算方法
        - 能估计不规则图形的面积
        - 能通过割补、拼接和转化推导面积公式
        - 能计算简单组合图形的面积
        - 能解决面积相关实际问题
      diagnostic_dimensions:
        - 面积概念理解
        - 面积单位理解
        - 长方形面积计算
        - 正方形面积计算
        - 平行四边形面积计算
        - 三角形面积计算
        - 梯形面积计算
        - 圆面积计算
        - 不规则图形面积估测
        - 面积公式推导理解
        - 组合图形分解与计算
        - 面积实际应用
      prerequisites:
        - C1-02
        - C1-03
        - C1-04
        - C1-06
      curriculum:
        stage_2:
          status: 明确要求
          description: 认识面积并掌握长方形、正方形面积公式。
        stage_3:
          status: 明确要求
          description: 掌握平行四边形、三角形、梯形和圆的面积计算。
      notes:
        - 面积公式的理解与公式应用应分别诊断。
        - 组合图形不单独建立知识点。
        - 不规则图形估测与规则图形公式计算属于不同诊断维度。

    - id: C1-09
      name: 立体图形的表面积与体积
      definition: >
        研究立体图形表面大小和所占空间大小的度量，
        理解表面积、体积和容积的意义及计算方法。
      learning_objectives:
        - 理解表面积的意义
        - 理解体积的意义
        - 理解容积的意义
        - 理解体积单位的意义
        - 掌握长方体和正方体表面积计算方法
        - 掌握长方体和正方体体积计算方法
        - 掌握圆柱表面积和体积计算方法
        - 掌握圆锥体积计算方法
        - 理解不规则物体体积的测量方法
        - 能解决简单实际问题
      diagnostic_dimensions:
        - 表面积概念理解
        - 体积概念理解
        - 容积概念理解
        - 长方体表面积计算
        - 正方体表面积计算
        - 长方体体积计算
        - 正方体体积计算
        - 圆柱表面积计算
        - 圆柱体积计算
        - 圆锥体积计算
        - 不规则物体体积测量
        - 表面积与体积辨析
        - 实际应用与结果解释
      prerequisites:
        - C1-05
        - C1-08
      curriculum:
        stage_1:
          status: 非核心要求
        stage_2:
          status: 体积概念前置
        stage_3:
          status: 明确要求
          description: >
            认识长方体、正方体、圆柱和圆锥，
            掌握相应表面积、体积计算及简单实际应用。
      notes:
        - 表面积与体积必须分开诊断。
        - 容积是容器内部可容纳空间的度量，不等同于容器外部体积。
        - 圆锥体积与圆柱体积公式应用分开诊断。
        - 不规则物体体积测量属于度量方法，不是规则几何体公式。

    - id: C1-10
      name: 几何度量单位与换算
      definition: >
        认识长度、面积、体积和容积的度量单位，
        理解不同单位之间的进率并进行换算。
      learning_objectives:
        - 认识常用长度单位及其关系
        - 认识常用面积单位及其关系
        - 认识常用体积单位及其关系
        - 认识容积单位升和毫升
        - 理解相邻单位之间的进率
        - 能进行长度单位换算
        - 能进行面积单位换算
        - 能进行体积单位换算
        - 能进行容积单位换算
        - 能根据情境选择合适的度量单位
      diagnostic_dimensions:
        - 长度单位辨认
        - 长度单位进率
        - 长度单位换算
        - 面积单位辨认
        - 面积单位进率
        - 面积单位换算
        - 体积单位辨认
        - 体积单位进率
        - 体积单位换算
        - 容积单位换算
        - 单位选择
        - 不同度量类型辨析
      prerequisites:
        - C1-06
        - C1-08
        - C1-09
      curriculum:
        stage_1:
          status: 明确要求
          description: 认识米、厘米并进行简单换算。
        stage_2:
          status: 明确要求
          description: 认识千米、分米、毫米及平方厘米、平方分米、平方米。
        stage_3:
          status: 明确要求
          description: 认识公顷、平方千米、体积单位和容积单位并换算。
      notes:
        - 单位换算与几何公式计算分开诊断。
        - 长度、面积和体积单位不能混用。
        - 面积单位换算涉及平方关系，体积单位换算涉及立方关系。

    - id: C1-11
      name: 图形的分解、组合与度量
      definition: >
        将复杂图形分解或组合为简单图形，
        利用图形之间的关系分析形状、周长、面积或体积。
      learning_objectives:
        - 能识别组合图形中的基本图形
        - 能将复杂图形分解为简单图形
        - 能利用割补和拼接转化图形
        - 能利用图形之间的关系求解未知量
        - 能解决简单组合图形的度量问题
      diagnostic_dimensions:
        - 图形分解
        - 图形组合
        - 割补转化
        - 边界关系分析
        - 面积关系分析
        - 体积关系分析
        - 综合度量策略
      prerequisites:
        - C1-02
        - C1-07
        - C1-08
        - C1-09
      curriculum:
        stage_1:
          status: 基础活动
          description: 使用简单图形拼图。
        stage_2:
          status: 体系细化
          description: 通过图形拼组和转化理解图形关系。
        stage_3:
          status: 体系细化
          description: 运用图形转化解决面积和体积问题。
      notes:
        - 本知识点重点考查分解、组合和转化策略。
        - 如果题目只考查某个图形的面积公式，绑定 C1-08。
        - 如果题目只考查组合图形的周长计算，绑定 C1-07。
        - 不因题目出现组合图形就自动绑定本知识点。

  cross_module_abilities:

    - id: C1-C01
      name: 图形特征观察
      description: >
        能观察、辨认和描述平面图形及立体图形的特征。
      uses:
        - C1-01
        - C1-02
        - C1-03
        - C1-04
        - C1-05

    - id: C1-C02
      name: 几何分类与推理
      description: >
        能根据图形的边、角、面和其他性质进行分类、
        比较和简单推理。
      uses:
        - C1-02
        - C1-03
        - C1-04
        - C1-05

    - id: C1-C03
      name: 度量意识
      description: >
        能理解度量对象、单位和测量方法之间的关系，
        选择合理的度量单位和工具。
      uses:
        - C1-06
        - C1-07
        - C1-08
        - C1-09
        - C1-10

    - id: C1-C04
      name: 几何转化
      description: >
        能通过割补、拼接、分解和组合，
        将复杂图形转化为熟悉的简单图形。
      uses:
        - C1-08
        - C1-09
        - C1-11

    - id: C1-C05
      name: 空间想象与表达
      description: >
        能在平面图形、立体图形、展开图和观察视图之间
        建立联系，并用图形或语言表达空间关系。
      uses:
        - C1-02
        - C1-05
        - C1-11

  curriculum_mapping_policy:
    source: 义务教育数学课程标准（2022年版）

    stage_1:
      grades: "1-2"
      main_requirements:
        - 简单立体图形和平面图形的辨认
        - 图形分类与拼组
        - 长度单位米和厘米
        - 长度估测与测量
      primary_knowledge_points:
        - C1-02
        - C1-05
        - C1-06
        - C1-10

    stage_2:
      grades: "3-4"
      main_requirements:
        - 线段、射线和直线
        - 角及角度测量
        - 平行与垂直
        - 三角形和四边形分类
        - 长度和面积单位
        - 周长与面积
        - 观察物体
      primary_knowledge_points:
        - C1-01
        - C1-02
        - C1-03
        - C1-06
        - C1-07
        - C1-08
        - C1-10

    stage_3:
      grades: "5-6"
      main_requirements:
        - 三角形性质
        - 圆与扇形
        - 圆的周长与面积
        - 多边形面积
        - 立体图形认识
        - 表面积和体积
        - 体积与容积单位
        - 不规则图形面积估测
        - 不规则物体体积测量
      primary_knowledge_points:
        - C1-03
        - C1-04
        - C1-05
        - C1-07
        - C1-08
        - C1-09
        - C1-10
        - C1-11

    notes:
      - 学段要求不等于具体年级要求。
      - 不将第三学段全部知识点标记为五年级必学。
      - 教材版本、年级和单元通过独立映射表维护。

  diagnostic_policy:
    rules:
      - 每道题绑定实际考查的知识点ID。
      - 多知识点题目必须区分主要考查点和辅助考查点。
      - 不能仅凭题目使用某个图形就绑定该图形的所有性质。
      - 图形性质理解与性质应用分开诊断。
      - 公式推导理解与公式计算应用分开诊断。
      - 周长、面积、表面积和体积必须严格区分。
      - 单位换算与公式计算必须严格区分。
      - 组合图形题需要根据实际解题过程绑定知识点。
      - 跨模块能力作为辅助诊断标签，不替代知识点ID。

    examples:
      - question: 判断两条直线是否垂直
        primary: C1-01

      - question: 根据边和角的特征判断三角形类型
        primary: C1-03

      - question: 根据三角形两个内角求第三个角
        primary: C1-03

      - question: 判断圆的半径和直径之间的关系
        primary: C1-04

      - question: 根据展开图判断对应的立体图形
        primary: C1-05

      - question: 测量一条线段的长度
        primary: C1-06

      - question: 计算长方形的周长
        primary: C1-07

      - question: 计算三角形的面积
        primary: C1-08

      - question: 计算圆柱的体积
        primary: C1-09

      - question: 将平方米换算为平方厘米
        primary: C1-10

      - question: 将不规则组合图形分割后计算面积
        primary: C1-11

  id_policy:
    format: "C1-{sequence}"
    rules:
      - ID一经分配不得复用。
      - 知识点拆分或合并必须保留迁移记录。
      - 不同教材版本不得重复创建同一数学知识点。
      - 教材章节名称不能直接作为知识点定义。