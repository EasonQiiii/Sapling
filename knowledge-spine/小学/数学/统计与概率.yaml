status: "final"
domain:
  id: D
  name: 统计与概率
  version: "1.0"
  description: >
    研究现实世界中的数据及其蕴含的信息，
    通过数据收集、整理、表达和分析认识事物特征；
    通过随机现象的观察与试验理解不确定性及可能性。

  principles:
    - 知识体系独立于教材版本，教材仅负责知识点映射。
    - 数据处理过程与随机现象研究分开组织。
    - 统计图表是数据表达工具，不将每一种题型独立建成知识点。
    - 统计量与数值运算区分，平均数归入统计分析。
    - 百分数的数学意义引用数与运算模块，统计意义在本领域描述。
    - 小学阶段的可能性以定性描述为主，不提前引入数值概率体系。

  modules:

    D1:
      name: 数据的收集、整理、表达与分析
      description: >
        研究数据的分类、收集、整理、统计表达和分析，
        从数据中提取信息并形成合理判断。

      knowledge_points:

        - id: D1-01
          name: 数据分类
          definition: >
            根据研究对象的属性或特征确定分类标准，
            将对象或数据划分为不同类别。
          learning_objectives:
            - 理解分类标准与分类结果之间的关系。
            - 能根据对象特征制定合理的分类标准。
            - 能按照一个或多个给定标准进行分类。
            - 能解释不同分类标准产生不同分类结果的原因。
          diagnostic_dimensions:
            - 分类标准识别
            - 分类标准制定
            - 分类规则执行
            - 分类结果完整性
            - 分类标准一致性
          prerequisites: []
          curriculum_mapping:
            2022:
              stage_1: 明确要求
              stage_2: 统计学习的基础
              stage_3: 继续应用
          notes:
            - 数据分类是统计学习的基础。
            - 不等同于统计数据的频数整理。
            - 需要区分分类标准是否合理、是否一致。

        - id: D1-02
          name: 数据收集
          definition: >
            根据研究问题确定需要的数据，
            通过调查、观察、测量或查阅资料等方式获取数据。
          learning_objectives:
            - 能根据研究问题确定需要收集的数据。
            - 了解简单的数据收集方法。
            - 能从实际情境或媒体中获取所需数据。
            - 理解数据来源与研究问题之间的关系。
          diagnostic_dimensions:
            - 研究问题识别
            - 数据需求确定
            - 收集方法选择
            - 数据来源识别
            - 数据记录完整性
          prerequisites:
            - D1-01
          curriculum_mapping:
            2022:
              stage_2: 明确要求
              stage_3: 明确要求
          notes:
            - 不要求小学阶段系统学习抽样理论。
            - 不将复杂问卷设计、抽样误差作为小学核心知识。
            - 重点诊断数据是否与研究问题相关。

        - id: D1-03
          name: 数据整理与统计表
          definition: >
            对收集到的数据进行分类、计数和整理，
            并通过统计表等形式呈现数据及其数量关系。
          learning_objectives:
            - 能对收集的数据进行分类和计数。
            - 能整理数据并形成清晰的统计结果。
            - 能根据数据填写或制作简单统计表。
            - 能从统计表中读取数据并进行比较。
          diagnostic_dimensions:
            - 数据分类正确性
            - 计数准确性
            - 统计结果完整性
            - 表格结构理解
            - 数据读取与比较
          prerequisites:
            - D1-01
            - D1-02
          curriculum_mapping:
            2022:
              stage_1: 可用简单表格记录分类结果
              stage_2: 明确要求
              stage_3: 明确要求
          notes:
            - 统计表是数据整理和表达工具。
            - 不将简单记录表、统计表和复杂交叉分析表混为一谈。
            - 不要求小学阶段学习复杂统计报表。

        - id: D1-04
          name: 条形统计图
          definition: >
            使用长短不同的直条表示不同类别的数据数量，
            直观呈现数量大小及类别之间的比较关系。
          learning_objectives:
            - 理解条形统计图的基本结构。
            - 理解横轴、纵轴及单位刻度的意义。
            - 能根据数据绘制条形统计图。
            - 能从条形统计图中读取和比较数据。
            - 能根据统计图回答实际问题。
          diagnostic_dimensions:
            - 横轴与纵轴含义
            - 刻度与单位理解
            - 数据与直条对应
            - 直条长度准确性
            - 数据读取
            - 数量比较
          prerequisites:
            - D1-03
          curriculum_mapping:
            2022:
              stage_2: 明确要求
              stage_3: 明确要求
          notes:
            - 条形统计图主要表达数量多少。
            - 单式、复式条形统计图是具体表现形式，不单独建知识点。
            - 重点区分刻度错误、数据读取错误和数量比较错误。

        - id: D1-05
          name: 折线统计图
          definition: >
            将数据按照一定顺序用点表示，
            并用线段连接各点，呈现数据随时间或其他变量变化的趋势。
          learning_objectives:
            - 理解折线统计图的基本结构。
            - 能根据数据绘制简单折线统计图。
            - 能读取各数据点所表示的数值。
            - 能识别数据变化趋势。
            - 能根据变化趋势作出简单判断。
          diagnostic_dimensions:
            - 横轴与纵轴含义
            - 刻度与单位理解
            - 数据点定位
            - 折线绘制
            - 变化趋势识别
            - 变化幅度比较
          prerequisites:
            - D1-03
            - D1-04
          curriculum_mapping:
            2022:
              stage_2: 前置数据整理与表达
              stage_3: 明确要求
          notes:
            - 折线统计图主要表达数据变化趋势。
            - 上升或下降不等于变化幅度相同。
            - 不将折线斜率的定量计算纳入小学核心要求。

        - id: D1-06
          name: 扇形统计图
          definition: >
            将整体表示为一个圆，
            用不同扇形表示各部分占整体的比例，
            呈现部分与整体之间的关系。
          learning_objectives:
            - 理解扇形统计图表示部分与整体关系的特点。
            - 能读取扇形统计图中的百分数信息。
            - 能解释各部分占整体的比例。
            - 能根据统计图比较不同部分所占比例。
          diagnostic_dimensions:
            - 整体与部分识别
            - 百分数读取
            - 部分与整体关系
            - 比例大小比较
            - 图表信息解释
          prerequisites:
            - D1-03
            - D1-04
          curriculum_mapping:
            2022:
              stage_2: 前置统计知识
              stage_3: 明确要求认识及理解其功能
          notes:
            - 2022版课标明确要求认识扇形统计图并理解其功能。
            - 第三学段明确要求用条形统计图、折线统计图呈现数据。
            - 不将复杂扇形统计图绘制技巧视为统一核心要求。
            - 扇形统计图中的百分数计算引用数与运算模块。

        - id: D1-07
          name: 平均数
          definition: >
            用一个数概括一组数据的集中情况，
            表示这组数据在整体上的平均水平。
          learning_objectives:
            - 理解平均数的统计意义。
            - 理解平均数具有代表一组数据整体水平的作用。
            - 会计算简单数据组的平均数。
            - 能利用平均数解决简单实际问题。
            - 能结合具体数据解释平均数的实际意义。
          diagnostic_dimensions:
            - 平均数意义理解
            - 平均数计算
            - 总数量与数据个数识别
            - 平均数应用
            - 平均数代表性理解
            - 平均数结果合理性判断
          prerequisites:
            - A3-01
            - A3-04
            - D1-02
            - D1-03
          curriculum_mapping:
            2022:
              stage_2: 明确要求
              stage_3: 建立在已有平均数理解基础上应用
          notes:
            - 平均数属于统计量，不是普通算术平均题型的集合。
            - 平均数不一定等于原始数据中的某一个数。
            - 平均数应位于一组数据的最小值与最大值之间。
            - 不将加权平均数作为小学阶段统一核心要求。
            - 不将中位数、众数列为小学2022版课标明确要求。

        - id: D1-08
          name: 数据分析与统计判断
          definition: >
            根据研究问题读取、比较和解释数据，
            综合统计表、统计图和统计量中的信息，
            得出与数据相符的结论。
          learning_objectives:
            - 能根据问题选择合适的数据表达方式。
            - 能从统计表和统计图中提取有效信息。
            - 能比较数据并发现其中的变化或差异。
            - 能根据数据作出简单判断和预测。
            - 能用数据支持自己的结论。
            - 能判断结论是否超出了数据所能支持的范围。
          diagnostic_dimensions:
            - 问题与数据匹配
            - 有效信息提取
            - 数据比较
            - 变化趋势判断
            - 统计结论推断
            - 结论与证据一致性
          prerequisites:
            - D1-02
            - D1-03
            - D1-04
            - D1-05
            - D1-06
            - D1-07
          curriculum_mapping:
            2022:
              stage_2: 简单数据分析
              stage_3: 明确要求
          notes:
            - 这是综合性知识点，题目只有在主要考查数据解释或判断时才绑定。
            - 不因题目出现统计图就自动绑定本知识点。
            - 预测必须有数据依据，不将主观猜测视为统计结论。
            - 不将初中抽样推断、相关性分析等内容提前纳入。

        - id: D1-09
          name: 百分数的统计意义
          definition: >
            在统计情境中使用百分数表达部分与整体的关系，
            或表达某类数据在整体中所占的比例。
          learning_objectives:
            - 理解百分数在统计情境中的表达作用。
            - 能读取统计资料中的百分数。
            - 能解释百分数所表示的部分与整体关系。
            - 能利用百分数分析简单统计问题。
          diagnostic_dimensions:
            - 百分数信息读取
            - 整体识别
            - 部分识别
            - 部分与整体关系
            - 统计意义解释
            - 百分数应用
          prerequisites:
            - A1-09
            - A2-05
            - D1-03
          curriculum_mapping:
            2022:
              stage_3: 明确要求
          notes:
            - 百分数本身的数学意义归数与运算模块。
            - 本知识点只覆盖百分数在数据表达和统计分析中的作用。
            - 不重复建立百分数的意义、互化和计算知识点。
            - 不能将百分数直接等同于概率。

    D2:
      name: 随机现象与可能性
      description: >
        研究现实生活中的随机现象，
        识别可能发生的结果并比较不同结果发生的可能性。

      knowledge_points:

        - id: D2-01
          name: 随机现象的认识
          definition: >
            在一定条件下，结果具有不确定性的现象。
            同样条件下进行多次活动，结果可能不同。
          learning_objectives:
            - 能识别生活中的简单随机现象。
            - 理解随机现象的结果具有不确定性。
            - 能区分确定现象与随机现象。
            - 能列举简单随机现象可能出现的结果。
          diagnostic_dimensions:
            - 随机现象识别
            - 确定与不确定辨析
            - 可能结果识别
            - 现象与结果区分
          prerequisites:
            - D1-01
          curriculum_mapping:
            2022:
              stage_1: 生活经验准备
              stage_2: 生活经验准备
              stage_3: 明确要求
          notes:
            - 随机现象不是完全没有规律。
            - 不能把随机现象理解为结果完全无法判断。
            - 天气、摸球、抽签等可以作为生活情境。

        - id: D2-02
          name: 随机事件的可能结果
          definition: >
            对简单随机现象，列举可能发生的结果，
            并判断某个结果是否可能发生。
          learning_objectives:
            - 能列举简单随机现象的所有可能结果。
            - 能判断某个结果是否可能发生。
            - 能识别不可能发生和必然发生的结果。
            - 能根据试验规则判断可能结果的范围。
          diagnostic_dimensions:
            - 试验规则理解
            - 可能结果列举
            - 结果完整性
            - 结果排除
            - 必然与不可能辨析
          prerequisites:
            - D2-01
          curriculum_mapping:
            2022:
              stage_3: 明确要求
          notes:
            - 重点是简单随机现象的可能结果。
            - 不将复杂样本空间和排列组合纳入小学核心要求。
            - 必然、不可能和可能发生是对结果性质的判断。

        - id: D2-03
          name: 可能性大小的判断
          definition: >
            根据随机现象的规则、条件或已有数据，
            对不同结果发生的可能性大小进行比较和定性描述。
          learning_objectives:
            - 能比较简单随机事件发生可能性的大小。
            - 能使用可能、一定、不可能、可能性较大、可能性较小等语言描述。
            - 能根据试验条件解释可能性大小。
            - 能利用试验数据辅助判断随机现象发生的可能性。
          diagnostic_dimensions:
            - 可能性语言理解
            - 可能性大小比较
            - 试验条件识别
            - 规则与可能性关系
            - 数据辅助判断
            - 判断理由表达
          prerequisites:
            - D2-01
            - D2-02
            - D1-02
            - D1-03
          curriculum_mapping:
            2022:
              stage_3: 明确要求
          notes:
            - 小学阶段以定性描述和简单比较为主。
            - 可以通过摸球、转盘等试验感受可能性大小。
            - 试验结果具有随机性，不能要求每次结果都符合比例预期。
            - 不将古典概率公式、概率数值计算列为小学核心要求。
            - 不将频率稳定性和大数定律作为小学核心知识点。

  cross_module_capabilities:
    - id: D-CAP-01
      name: 数据收集与记录
      description: 根据问题确定数据需求，并准确记录数据。
      applies_to:
        - D1-02
        - D1-03

    - id: D-CAP-02
      name: 统计表达方式选择
      description: 根据数据特点和研究目的选择合适的统计表达方式。
      applies_to:
        - D1-04
        - D1-05
        - D1-06
        - D1-09

    - id: D-CAP-03
      name: 数据解释与证据表达
      description: 使用数据支持判断，清晰说明结论及其依据。
      applies_to:
        - D1-07
        - D1-08
        - D1-09

    - id: D-CAP-04
      name: 随机现象判断
      description: 根据试验规则和数据判断随机事件发生的可能性。
      applies_to:
        - D2-01
        - D2-02
        - D2-03

  exclusions:
    - name: 中位数与众数
      reason: 不作为2022版小学数学课程标准明确要求的核心知识点。
      destination: 第四学段统计与概率

    - name: 数值概率计算
      reason: 小学阶段主要要求定性描述简单随机现象的可能性。
      destination: 第四学段随机事件的概率

    - name: 抽样推断与统计推断
      reason: 属于更高阶段的数据分析内容。
      destination: 第四学段抽样与数据分析

    - name: 百分数的基本意义与计算
      reason: 属于数与运算模块，本领域只描述其统计应用。
      destination: A 数与运算

    - name: 排列组合
      reason: 不属于小学阶段统计与概率的核心知识点。
      destination: 后续学段扩展

  curriculum_alignment:
    authoritative_source:
      title: 义务教育数学课程标准（2022年版）
      publisher: 中华人民共和国教育部
      url: https://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582346895190.pdf

    stage_mapping:
      stage_1: 第一学段，1～2年级
      stage_2: 第二学段，3～4年级
      stage_3: 第三学段，5～6年级
      stage_4: 第四学段，7～9年级

    rules:
      - 课标明确要求与统一体系细化必须区分。
      - 学段要求不能直接推断为某一个年级的要求。
      - 教材提前或延后安排知识点，通过教材映射记录。
      - 不因教材出现某知识点，就将其标记为2022版课标明确要求。
      - 2011版与2022版课标差异单独记录，不混合标注。