status: "final"
module:
  id: C2
  name: 图形的位置与运动
  version: "1.0"
  domain: 图形与几何

  description: >
    研究物体和图形的位置描述、空间方向、
    图形的平移、旋转、轴对称及放大缩小，
    理解图形在运动和变换过程中的位置与形状关系。

  boundary:
    includes:
      - 方向与位置描述
      - 路线与位置关系
      - 有序数对表示位置
      - 比例尺
      - 图形的平移
      - 图形的旋转
      - 轴对称
      - 图形的放大与缩小

    excludes:
      - 图形本身的性质（C1）
      - 图形周长、面积、表面积和体积计算（C1）
      - 比的意义和比值计算（B4）
      - 正比例与反比例（B5）
      - 坐标系中的函数图像
      - 向量及其运算
      - 初中解析几何

  knowledge_points:

    - id: C2-01
      name: 方向与位置描述
      definition: >
        根据参照点、方向和距离描述物体的位置，
        理解位置描述依赖于参照点和方向基准。
      learning_objectives:
        - 理解参照点的意义
        - 认识东、南、西、北等基本方向
        - 认识东南、东北、西南、西北等方向
        - 能根据参照点描述物体所在方向
        - 能结合方向和距离确定物体位置
        - 能根据位置描述确定物体所在位置
        - 能描述简单路线图
      diagnostic_dimensions:
        - 参照点识别
        - 方向辨认
        - 方位描述
        - 距离信息识别
        - 方向与距离综合定位
        - 路线图读取
        - 路线描述
      prerequisites:
        - C1-01
      curriculum:
        stage_1:
          status: 基础经验
          description: 认识简单方向和位置关系
        stage_2:
          status: 基础要求
          description: 结合实际情境描述物体的位置和方向
        stage_3:
          status: 明确要求
          description: 根据参照点的方向和距离确定物体位置并描述路线

    - id: C2-02
      name: 有序数对表示位置
      definition: >
        使用两个有顺序的数表示平面上方格纸中点的位置，
        理解两个数的顺序与位置对应关系。
      learning_objectives:
        - 理解有序数对的意义
        - 能在方格纸上确定点的位置
        - 能用有序数对表示点的位置
        - 理解两个数的顺序不能随意交换
        - 能根据有序数对找到对应位置
        - 能在简单情境中使用数对描述位置
      diagnostic_dimensions:
        - 有序数对概念
        - 第一个数的含义
        - 第二个数的含义
        - 数对与点的位置对应
        - 数对书写
        - 数对读取
        - 顺序错误辨析
      prerequisites:
        - C2-01
      curriculum:
        stage_3:
          status: 明确要求
          description: 用有序数对（限于自然数）表示点的位置，理解数对与方格纸上点的对应关系
      notes:
        - 本知识点限定小学阶段的方格纸位置表达。
        - 不扩展为完整平面直角坐标系。
        - 不将数对中的两个数理解为可以交换的无序数据。

    - id: C2-03
      name: 比例尺
      definition: >
        图上距离与实际距离的比称为比例尺，
        用于描述图形或地图与实际对象之间的缩小关系。
      learning_objectives:
        - 理解比例尺的意义
        - 能区分图上距离和实际距离
        - 能识别比例尺的表示形式
        - 能根据比例尺求图上距离
        - 能根据比例尺求实际距离
        - 能根据图上距离和实际距离确定比例尺
        - 能解决简单地图和图纸中的比例尺问题
      diagnostic_dimensions:
        - 比例尺概念理解
        - 图上距离识别
        - 实际距离识别
        - 单位统一
        - 比例尺求解
        - 图上距离求解
        - 实际距离求解
        - 结果合理性判断
      prerequisites:
        - B4-01
        - B4-02
        - B4-04
        - C2-01
        - C1-10
      curriculum:
        stage_3:
          status: 明确要求
          description: 了解比例尺，利用方格纸按比例放大或缩小简单图形
      notes:
        - 比例尺归入图形的位置与运动。
        - 比例尺使用比的知识，但不重复建立B4知识点。
        - 方向和距离定位与比例尺计算属于不同诊断内容。

    - id: C2-04
      name: 图形的平移
      definition: >
        图形上的所有点沿同一方向移动相同的距离，
        得到的新图形与原图形形状和大小相同。
      learning_objectives:
        - 理解平移的意义
        - 能识别生活中的平移现象
        - 能判断图形平移的方向
        - 能判断图形平移的距离
        - 能在方格纸上进行简单图形平移
        - 能确定平移前后对应点的位置
        - 理解平移前后图形的形状和大小不变
      diagnostic_dimensions:
        - 平移现象识别
        - 平移方向判断
        - 平移距离判断
        - 对应点识别
        - 方格平移操作
        - 平移后图形绘制
        - 平移性质理解
      prerequisites:
        - C1-02
        - C2-01
      curriculum:
        stage_2:
          status: 基础要求
          description: 通过操作感知简单图形运动
        stage_3:
          status: 明确要求
          description: 在方格纸上进行简单图形的平移
      notes:
        - 平移不改变图形的形状和大小。
        - 平移不等同于图形的放大或缩小。

    - id: C2-05
      name: 图形的旋转
      definition: >
        图形绕一个固定点按照一定方向转动一定角度，
        得到新的图形。
      learning_objectives:
        - 理解旋转的意义
        - 能识别生活中的旋转现象
        - 能识别旋转中心
        - 能判断旋转方向
        - 能判断旋转角度
        - 能在方格纸上进行简单图形旋转
        - 能确定旋转前后对应点的位置
        - 理解旋转前后图形的形状和大小不变
      diagnostic_dimensions:
        - 旋转现象识别
        - 旋转中心识别
        - 旋转方向判断
        - 旋转角度判断
        - 对应点识别
        - 方格旋转操作
        - 旋转后图形绘制
        - 旋转性质理解
      prerequisites:
        - C1-01
        - C1-02
        - C2-01
      curriculum:
        stage_2:
          status: 基础要求
          description: 通过操作感知简单图形运动
        stage_3:
          status: 明确要求
          description: 在方格纸上进行简单图形的旋转
      notes:
        - 旋转不改变图形的形状和大小。
        - 旋转必须明确旋转中心、方向和角度。
        - 不将旋转与平移混为同一种运动。

    - id: C2-06
      name: 轴对称
      definition: >
        如果一个图形沿某条直线对折后，
        直线两侧的部分能够完全重合，
        则该图形是轴对称图形，这条直线称为对称轴。
      learning_objectives:
        - 理解轴对称的意义
        - 能识别轴对称图形
        - 能判断图形的对称轴
        - 理解对称轴两侧图形的对应关系
        - 能在方格纸上补全简单的轴对称图形
        - 能识别生活中的轴对称现象
        - 能利用轴对称设计简单图案
      diagnostic_dimensions:
        - 轴对称概念理解
        - 轴对称图形识别
        - 对称轴识别
        - 对应点识别
        - 对称距离判断
        - 方格补全
        - 对称图案设计
      prerequisites:
        - C1-02
      curriculum:
        stage_2:
          status: 基础要求
          description: 通过观察和操作认识简单轴对称现象
        stage_3:
          status: 明确要求
          description: 认识轴对称图形和对称轴，在方格纸上补全简单轴对称图形
      notes:
        - 轴对称属于图形变换与位置关系。
        - 对称轴两侧对应点到对称轴的距离相等。
        - 轴对称与旋转对称不是同一概念。

    - id: C2-07
      name: 图形的放大与缩小
      definition: >
        将图形各部分按照相同的比例放大或缩小，
        在改变图形大小的同时保持其形状不变。
      learning_objectives:
        - 理解图形放大与缩小的意义
        - 能识别放大和缩小的图形
        - 理解对应线段长度按照相同比例变化
        - 理解放大或缩小前后图形形状不变
        - 能在方格纸上按比例放大简单图形
        - 能在方格纸上按比例缩小简单图形
        - 能比较放大或缩小前后的图形
      diagnostic_dimensions:
        - 放大与缩小概念
        - 原图与新图对应关系
        - 比例确定
        - 对应边长度计算
        - 方格放大操作
        - 方格缩小操作
        - 形状不变理解
        - 放大缩小结果判断
      prerequisites:
        - B4-01
        - B4-02
        - C1-02
        - C2-03
      curriculum:
        stage_3:
          status: 明确要求
          description: 了解比例尺，能利用方格纸按比例放大或缩小简单图形
      notes:
        - 放大与缩小改变图形大小，不改变图形形状。
        - 对应边长度按相同比例变化。
        - 面积变化不等于边长变化比例，涉及面积计算时关联C1-08。
        - 不在本知识点引入相似三角形的系统理论。

  cross_module_abilities:

    - id: C2-C01
      name: 空间定位能力
      description: >
        能根据参照点、方向、距离和数对确定位置，
        并使用语言、符号或图形表达位置关系。
      uses:
        - C2-01
        - C2-02

    - id: C2-C02
      name: 空间路径理解
      description: >
        能读取、描述和分析简单路线，
        理解物体运动过程中的位置变化。
      uses:
        - C2-01
        - C2-04
        - C2-05

    - id: C2-C03
      name: 图形变换理解
      description: >
        能识别图形变换方式，
        理解变换前后图形的位置、形状和大小关系。
      uses:
        - C2-04
        - C2-05
        - C2-06
        - C2-07

    - id: C2-C04
      name: 图形变换操作
      description: >
        能在方格纸或其他表示工具上完成简单图形变换，
        并准确表达变换条件和结果。
      uses:
        - C2-04
        - C2-05
        - C2-06
        - C2-07

    - id: C2-C05
      name: 空间表达与设计
      description: >
        能通过位置描述和图形变换表达空间关系，
        并利用图形变换设计简单图案。
      uses:
        - C2-01
        - C2-02
        - C2-04
        - C2-05
        - C2-06

  curriculum_mapping_policy:
    source: 义务教育数学课程标准（2022年版）

    stage_1:
      grades: "1-2"
      status: 基础经验
      description: >
        通过生活情境认识简单方向、位置和图形运动。

    stage_2:
      grades: "3-4"
      status: 基础学习
      description: >
        通过观察、操作和简单情境，
        建立位置与图形运动的初步认识。

    stage_3:
      grades: "5-6"
      status: 明确要求
      requirements:
        - 根据参照点的方向和距离确定物体位置
        - 描述简单路线图
        - 用有序数对表示点的位置
        - 了解比例尺
        - 按比例放大或缩小简单图形
        - 在方格纸上进行简单图形平移和旋转
        - 认识轴对称图形和对称轴
        - 在方格纸上补全简单轴对称图形
        - 欣赏和设计简单图案

    textbook_mapping:
      rule: >
        各教材版本分别记录知识点的年级、册次、
        单元、课时及教学顺序。
        不因教材章节拆分或合并而改变统一知识点ID。

  diagnostic_policy:
    rules:
      - 每道题绑定实际考查的知识点ID。
      - 位置描述与数对表示分开诊断。
      - 方向判断与距离判断分开诊断。
      - 平移与旋转分开诊断。
      - 旋转题必须明确旋转中心、方向和角度。
      - 轴对称识别与轴对称图形补全分开诊断。
      - 比例尺计算与图形放大缩小分开诊断。
      - 图形放大缩小不能只考查边长计算，还应检查形状是否保持。
      - 综合题允许绑定多个知识点。
      - 跨模块能力不能替代具体知识点绑定。

    examples:
      - question: 根据东偏北方向和距离确定物体位置
        primary: C2-01

      - question: 根据数对找到方格纸上的点
        primary: C2-02

      - question: 根据比例尺计算实际距离
        primary: C2-03

      - question: 将图形向右平移若干格
        primary: C2-04

      - question: 将图形绕指定点顺时针旋转90度
        primary: C2-05

      - question: 找出图形的对称轴
        primary: C2-06

      - question: 按指定比例放大一个简单图形
        primary: C2-07

  id_policy:
    format: "C2-{sequence}"
    rules:
      - ID一经分配不得复用。
      - 知识点拆分、合并和迁移必须记录变更。
      - 不同教材版本不得重复创建相同数学知识点。
      - 教材章节名称不能直接作为知识点定义。