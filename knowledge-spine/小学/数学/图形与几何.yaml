status: "final"
domain:
  id: C
  name: 图形与几何
  version: "1.0"
  description: >
    研究现实世界中物体的形状、大小、位置和运动，
    通过图形抽象、几何度量、空间描述和图形变换，
    发展空间观念、几何直观、量感和推理意识。

  principles:
    - 知识体系独立于教材版本
    - 平面图形与立体图形分别建模
    - 图形认识与图形测量相互关联，但不混为同一知识点
    - 图形性质、计算方法和实际应用分别定义
    - 图形的位置与运动独立于图形的认识与测量
    - 题型不直接作为知识点
    - 空间观念、几何直观和推理能力作为跨模块能力

  submodules:

    - id: C1
      name: 图形的认识与测量
      description: >
        研究点、线、角、平面图形和立体图形的特征，
        以及图形长度、角度、周长、面积、表面积和体积的度量。
      topics:
        - 点、线与角
        - 平面图形的认识
        - 平面图形的周长与面积
        - 立体图形的认识
        - 立体图形的表面积与体积
        - 长度、角度、面积和体积单位
        - 图形的分解、组合与测量

    - id: C2
      name: 图形的位置与运动
      description: >
        研究平面上点和图形的位置表示，
        以及图形经过平移、旋转、轴对称、
        放大和缩小后的变化规律。
      topics:
        - 方向与位置
        - 数对与坐标
        - 比例尺
        - 平移
        - 旋转
        - 轴对称
        - 图形的放大与缩小

  cross_module_abilities:
    - id: C-C01
      name: 空间观念
      description: >
        能够从现实物体抽象出几何图形，
        理解图形之间的位置、形状和空间关系。

    - id: C-C02
      name: 几何直观
      description: >
        能够借助图形理解数量关系、几何性质和问题结构，
        并利用图形辅助分析和解决问题。

    - id: C-C03
      name: 几何推理
      description: >
        能够根据图形特征、已知条件和几何关系，
        进行观察、归纳、判断和简单推理。

    - id: C-C04
      name: 几何度量
      description: >
        能够选择适当的度量单位和方法，
        测量或计算图形的大小。

    - id: C-C05
      name: 图形表达与转换
      description: >
        能够通过图形、语言、符号和操作表达几何关系，
        并在不同表示方式之间转换。

  curriculum_mapping:
    source: 义务教育数学课程标准（2022年版）

    stage_1:
      grades: "1-2"
      topics:
        - 简单立体图形和平面图形
        - 长度测量
      submodules:
        - C1

    stage_2:
      grades: "3-4"
      topics:
        - 线段、射线和直线
        - 角
        - 三角形和四边形
        - 长度、角度和面积单位
        - 周长与面积
        - 观察物体
        - 平移、旋转和轴对称
      submodules:
        - C1
        - C2

    stage_3:
      grades: "5-6"
      topics:
        - 三角形性质
        - 圆和扇形
        - 圆周率、圆的周长与面积
        - 多边形面积
        - 体积与容积
        - 长方体、正方体和圆柱
        - 表面积与体积
        - 方向、距离和数对
        - 比例尺
        - 图形平移、旋转、放大与缩小
        - 轴对称图形
      submodules:
        - C1
        - C2

  textbook_mapping_policy:
    rule: >
      每个教材版本独立记录知识点的年级、册次、
      单元、课时和教学顺序。
      教材中的知识点可以拆分、组合或跨年级安排，
      但不得因此改变统一知识点ID。

  diagnostic_policy:
    rules:
      - 每道题必须绑定实际考查的知识点ID
      - 图形识别与性质判断分开诊断
      - 公式理解与公式应用分开诊断
      - 单位换算与实际度量分开诊断
      - 图形运动的方向、距离、角度和对应点分别诊断
      - 综合题允许绑定多个知识点
      - 跨模块能力不代替具体知识点绑定

  id_policy:
    format: "C{module}-{sequence}"
    examples:
      - C1-01
      - C1-02
      - C2-01
    rules:
      - 知识点ID一经使用不得复用
      - 拆分、合并和迁移必须保留变更记录
      - 不因教材版本不同重复创建相同知识点

  external_boundaries:
    - name: 比例尺
      belongs_to: C2
      note: >
        比例尺是图形的位置与运动中的内容，
        使用比表示图上距离与实际距离的关系。
        不在B4重复建立知识点。

    - name: 正比例与反比例
      belongs_to: B5
      note: >
        研究变量之间的数量变化关系，
        不因图形中出现比例关系而归入本领域。

    - name: 图形中的数量计算
      belongs_to: C1
      note: >
        周长、面积、表面积和体积的计算属于几何度量，
        不归入数与运算。