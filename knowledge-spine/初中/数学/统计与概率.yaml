schema_version: "1.0"
status: "final"

domain:
  id: D
  name: 统计与概率

stage:
  id: junior
  name: 初中
  grades: [7, 8, 9]

knowledge_points:

  # =====================================
  # D1 抽样与数据分析
  # =====================================

  - id: J-D1-01
    name: 总体、个体、样本与样本容量
    definition: >
      统计调查中，所要考察对象的全体称为总体，
      组成总体的每一个考察对象称为个体，
      从总体中抽取的一部分个体称为样本，
      样本中个体的数量称为样本容量。
    learning_objectives:
      - 理解总体与个体的意义。
      - 理解样本与样本容量的意义。
      - 能根据调查问题确定总体和个体。
      - 能识别样本及其样本容量。
      - 理解样本应当具有代表性。
    diagnostic_dimensions:
      - 总体识别
      - 个体识别
      - 样本识别
      - 样本容量判断
      - 样本代表性理解
    prerequisites:
      - D1-02
      - D1-01
      - D1-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 总体是调查对象的全体，不是调查得到的数据集合。
      - 样本是总体的一部分，不等于样本容量。

  - id: J-D1-02
    name: 抽样调查与简单随机抽样
    definition: >
      抽样调查是从总体中抽取部分个体进行调查，
      并利用样本信息了解总体特征的方法。
      简单随机抽样要求总体中的每个个体都有相同的机会被抽取。
    learning_objectives:
      - 理解全面调查与抽样调查的区别。
      - 体会抽样调查的必要性。
      - 理解简单随机抽样的基本特点。
      - 能根据调查目的选择调查方式。
      - 能设计简单随机抽样方案。
      - 能识别抽样过程中的偏差。
    diagnostic_dimensions:
      - 全面调查与抽样调查辨析
      - 抽样必要性判断
      - 简单随机抽样理解
      - 抽样方案设计
      - 抽样偏差识别
      - 调查方式选择
    prerequisites:
      - J-D1-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 重点是抽样的合理性和代表性。
      - 不将分层抽样、整群抽样等复杂抽样方法列为初中核心要求。

  - id: J-D1-03
    name: 统计调查的设计与实施
    definition: >
      根据调查目的确定调查对象、调查内容和数据收集方式，
      通过问卷或其他适当方式收集数据，
      并对数据进行整理和分析。
    learning_objectives:
      - 能明确调查目的。
      - 能设计简单调查问卷。
      - 能选择合适的数据收集方式。
      - 能实施简单随机抽样调查。
      - 能整理调查结果。
      - 能解释调查结果并形成结论。
    diagnostic_dimensions:
      - 调查目的确定
      - 调查对象确定
      - 问卷设计
      - 数据收集方法选择
      - 调查实施
      - 数据整理
      - 调查结论表达
    prerequisites:
      - J-D1-01
      - J-D1-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 统计调查是完整的数据处理活动。
      - 调查设计与数据分析可以在实际题目中组合考查。

  - id: J-D1-04
    name: 统计图表的选择与表达
    definition: >
      根据数据特征和研究目的，
      选择适当的统计图表整理、描述和表达数据。
    learning_objectives:
      - 能读取条形统计图。
      - 能读取折线统计图。
      - 能读取扇形统计图。
      - 能读取频数直方图。
      - 能根据数据特点选择适当的统计图。
      - 能制作扇形统计图和频数直方图。
      - 能从统计图中提取并解释信息。
    diagnostic_dimensions:
      - 条形统计图读取
      - 折线统计图读取
      - 扇形统计图读取
      - 频数直方图读取
      - 统计图制作
      - 统计图选择
      - 图表信息解释
    prerequisites:
      - D1-03
      - D1-04
      - D1-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 条形图、折线图在小学已经学习，初中重点是选择和综合分析。
      - 扇形统计图和频数直方图是初中重点拓展内容。
      - 不把每一种统计图单独建成知识点。

  - id: J-D1-05
    name: 平均数、中位数与众数
    definition: >
      平均数、中位数和众数是描述一组数据集中趋势的统计量，
      分别从不同角度反映数据的代表性水平。
    learning_objectives:
      - 理解平均数的意义。
      - 理解中位数的意义。
      - 理解众数的意义。
      - 能计算一组数据的中位数和众数。
      - 能计算加权平均数。
      - 能根据数据特征选择适当的统计量。
      - 能解释不同统计量的实际意义。
    diagnostic_dimensions:
      - 平均数理解
      - 中位数理解
      - 众数理解
      - 中位数计算
      - 众数计算
      - 加权平均数计算
      - 权重理解
      - 统计量选择
      - 统计量解释
    prerequisites:
      - D1-07
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学平均数作为前置，不重复建立。
      - 加权平均数是初中阶段重点拓展。
      - 三种统计量分别描述集中趋势，不能互相替代。

  - id: J-D1-06
    name: 数据的离散程度与方差
    definition: >
      数据的离散程度描述一组数据相对于其中心位置的波动情况，
      方差通过各数据与平均数之差的平方的平均值刻画这种波动。
    learning_objectives:
      - 理解数据离散程度的意义。
      - 理解离差平方和。
      - 理解方差的意义。
      - 能计算一组简单数据的离差平方和。
      - 能计算一组简单数据的方差。
      - 能利用方差比较数据的稳定程度。
    diagnostic_dimensions:
      - 离散程度理解
      - 平均数计算
      - 离差计算
      - 离差平方和计算
      - 方差计算
      - 方差意义解释
      - 数据稳定性比较
    prerequisites:
      - J-D1-05
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 方差越小，数据相对于平均数的波动通常越小。
      - 方差与平均数描述的是不同的数据特征。
      - 标准差不作为本知识点的初中核心要求。

  - id: J-D1-07
    name: 频数、频率与频数分布
    definition: >
      频数表示某类数据出现的次数，
      频率表示该类数据出现次数占数据总量的比例，
      频数分布描述数据在不同范围内的分布情况。
    learning_objectives:
      - 理解频数的意义。
      - 理解频率的意义。
      - 能计算简单数据的频数和频率。
      - 理解频数分布的意义。
      - 能根据数据制作频数分布表。
      - 能利用频数直方图解释数据分布。
    diagnostic_dimensions:
      - 频数识别
      - 频率计算
      - 频数与频率辨析
      - 分组整理
      - 频数分布表
      - 频数直方图
      - 数据分布解释
    prerequisites:
      - J-D1-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 频数是次数，频率是比例。
      - 频率与随机事件概率有关，但两者不能直接等同。

  - id: J-D1-08
    name: 数据分类与聚类
    definition: >
      根据数据的特征和研究目的，
      将数据划分为若干类别，
      通过类别内部的相似性和类别之间的差异性认识数据结构。
    learning_objectives:
      - 理解数据分类的意义。
      - 能根据数据特征进行分类。
      - 理解组内离差平方和的意义。
      - 了解按照组内离差平方和最小原则进行数据分类的方法。
      - 能解释分类结果。
    diagnostic_dimensions:
      - 分类标准确定
      - 数据分类
      - 类别特征分析
      - 组内离差平方和理解
      - 分类结果解释
    prerequisites:
      - J-D1-05
      - J-D1-06
      - J-D1-07
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 本知识点依据2022版课标的数据分类要求。
      - 不扩展到机器学习中的复杂聚类算法。

  - id: J-D1-09
    name: 样本估计总体
    definition: >
      通过样本数据的统计特征估计总体的统计特征，
      利用样本平均数估计总体平均数，
      利用样本方差估计总体方差。
    learning_objectives:
      - 理解样本与总体的关系。
      - 理解样本统计量与总体统计量的区别。
      - 能利用样本平均数估计总体平均数。
      - 能利用样本方差估计总体方差。
      - 能解释估计结果的意义。
      - 理解样本代表性对估计结果的影响。
    diagnostic_dimensions:
      - 样本与总体辨析
      - 样本平均数计算
      - 总体平均数估计
      - 样本方差计算
      - 总体方差估计
      - 估计结果解释
      - 样本代表性分析
    prerequisites:
      - J-D1-01
      - J-D1-02
      - J-D1-05
      - J-D1-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 样本统计量用于估计总体特征，不代表总体真实值必然相等。
      - 重点是理解统计推断的基本思想。

  - id: J-D1-10
    name: 四分位数、百分位数与箱线图
    definition: >
      四分位数和百分位数描述数据在排序后的位置特征，
      箱线图通过四分位数等统计量直观表达数据分布。
    learning_objectives:
      - 理解四分位数的意义。
      - 能计算一组简单数据的四分位数。
      - 理解百分位数的意义。
      - 了解箱线图的基本组成。
      - 能根据箱线图识别数据分布特征。
    diagnostic_dimensions:
      - 数据排序
      - 四分位数理解
      - 四分位数计算
      - 百分位数理解
      - 箱线图结构识别
      - 箱线图信息读取
    prerequisites:
      - J-D1-05
      - J-D1-07
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 百分位数侧重理解意义。
      - 箱线图重点是读取和解释，不扩展到复杂统计分析。

  - id: J-D1-11
    name: 数据趋势分析与判断
    definition: >
      通过统计表、折线图、趋势图及数据特征，
      分析数据变化趋势，并根据数据作出合理判断和预测。
    learning_objectives:
      - 能识别数据随时间或条件变化的趋势。
      - 能利用统计图分析数据变化。
      - 能结合平均数、中位数、众数分析数据。
      - 能结合方差等统计量分析数据波动。
      - 能根据样本数据作出简单判断和预测。
      - 能解释分析结论的合理性和局限性。
    diagnostic_dimensions:
      - 数据变化趋势识别
      - 统计图趋势分析
      - 集中趋势分析
      - 离散程度分析
      - 数据预测
      - 结论合理性判断
      - 数据分析表达
    prerequisites:
      - J-D1-04
      - J-D1-05
      - J-D1-06
      - J-D1-09
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 统计分析不是单纯计算统计量。
      - 预测必须结合数据和问题背景，不能将趋势外推视为必然结果。

  # =====================================
  # D2 随机事件的概率
  # =====================================

  - id: J-D2-01
    name: 随机现象与随机事件
    definition: >
      在一定条件下，结果不能事先确定的现象称为随机现象；
      随机现象中可能发生的结果或情况称为随机事件。
    learning_objectives:
      - 理解随机现象的意义。
      - 理解必然事件、不可能事件和随机事件。
      - 能识别简单随机事件。
      - 能列举随机事件可能发生的结果。
      - 理解随机事件发生的不确定性。
    diagnostic_dimensions:
      - 随机现象识别
      - 必然事件识别
      - 不可能事件识别
      - 随机事件识别
      - 可能结果列举
      - 事件类型辨析
    prerequisites:
      - D2-01
      - D2-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学阶段主要定性描述可能性，初中进一步学习概率。
      - 事件是否发生与事件发生的可能性大小是不同问题。

  - id: J-D2-02
    name: 随机事件的所有可能结果
    definition: >
      对简单随机试验，通过列举、列表或画树状图等方法，
      系统表示试验可能出现的结果及指定事件包含的结果。
    learning_objectives:
      - 理解一次随机试验的基本结果。
      - 能列举简单随机试验的所有可能结果。
      - 能使用列表法表示可能结果。
      - 能使用树状图表示可能结果。
      - 能确定指定事件包含的结果。
      - 能避免重复或遗漏。
    diagnostic_dimensions:
      - 随机试验识别
      - 基本结果识别
      - 列表法
      - 树状图
      - 事件结果筛选
      - 结果完整性检查
    prerequisites:
      - J-D2-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 重点是系统列举有限个可能结果。
      - 列表法和树状图是解决问题的方法，不单独建立知识点。

  - id: J-D2-03
    name: 等可能事件与概率
    definition: >
      对于所有可能结果有限且每个结果发生机会相等的简单随机试验，
      事件发生的概率等于该事件包含的可能结果数
      与全部可能结果数的比值。
    learning_objectives:
      - 理解等可能结果的意义。
      - 理解概率的意义。
      - 理解概率的取值范围。
      - 能根据所有可能结果计算简单事件的概率。
      - 能计算互斥结果组成的简单事件概率。
      - 能解释概率的实际意义。
    diagnostic_dimensions:
      - 等可能性判断
      - 全部结果数确定
      - 有利结果数确定
      - 概率计算
      - 概率范围判断
      - 概率意义解释
    prerequisites:
      - J-D2-01
      - J-D2-02
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 等可能性是使用结果数之比计算概率的前提。
      - 不能仅因为结果数量有限，就认定所有结果等可能。
      - 不扩展到复杂条件概率和独立事件理论。

  - id: J-D2-04
    name: 频率估计概率
    definition: >
      在大量重复试验中，
      随机事件发生的频率通常会逐渐稳定在某个数值附近，
      可以利用稳定的频率估计事件发生的概率。
    learning_objectives:
      - 理解频率的意义。
      - 能计算随机事件发生的频率。
      - 理解大量重复试验中频率的稳定性。
      - 理解频率与概率的关系。
      - 能利用频率估计概率。
      - 能解释估计结果的不确定性。
    diagnostic_dimensions:
      - 试验次数识别
      - 事件发生次数统计
      - 频率计算
      - 频率与概率辨析
      - 频率稳定性理解
      - 概率估计
      - 估计结果解释
    prerequisites:
      - J-D1-07
      - J-D2-01
      - J-D2-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 频率是试验数据的结果，概率描述随机事件发生的可能性。
      - 频率不必等于概率。
      - 试验次数越多，频率通常越能体现概率的稳定特征。

  - id: J-D2-05
    name: 概率与统计的综合应用
    definition: >
      综合使用统计调查、数据分析、随机试验和概率估计等方法，
      分析现实问题中的不确定现象并作出合理判断。
    learning_objectives:
      - 能根据实际问题设计简单随机试验。
      - 能收集并整理试验数据。
      - 能利用频率估计概率。
      - 能结合概率解释随机现象。
      - 能利用统计数据分析和比较随机事件。
      - 能表达结论及其适用范围。
    diagnostic_dimensions:
      - 实际问题建模
      - 随机试验设计
      - 数据收集与整理
      - 频率计算
      - 概率估计
      - 统计与概率综合分析
      - 结论解释
    prerequisites:
      - J-D1-03
      - J-D1-07
      - J-D1-11
      - J-D2-02
      - J-D2-03
      - J-D2-04
    curriculum_mapping:
      2022:
        stage_4: 体系细化
    notes:
      - 这是综合应用知识点，不代表新增的独立概率理论。
      - 只有题目实际考查统计与概率综合分析时才绑定。

cross_module_capabilities:

  - id: J-D-CAP-01
    name: 数据收集与整理
    description: >
      能根据研究目的收集数据，
      并选择合适的方法整理和表达数据。
    applies_to:
      - J-D1-01
      - J-D1-02
      - J-D1-03
      - J-D1-04
      - J-D1-07

  - id: J-D-CAP-02
    name: 数据特征分析
    description: >
      能利用集中趋势、离散程度和数据分布特征，
      描述和比较数据。
    applies_to:
      - J-D1-05
      - J-D1-06
      - J-D1-07
      - J-D1-08
      - J-D1-10

  - id: J-D-CAP-03
    name: 统计推断与决策
    description: >
      能根据样本数据分析总体特征，
      并结合问题背景作出合理判断和预测。
    applies_to:
      - J-D1-02
      - J-D1-09
      - J-D1-11

  - id: J-D-CAP-04
    name: 随机性与概率分析
    description: >
      能识别随机现象，
      利用概率和频率分析随机事件发生的可能性。
    applies_to:
      - J-D2-01
      - J-D2-02
      - J-D2-03
      - J-D2-04
      - J-D2-05

exclusions:

  - name: 数据分类与简单统计图表
    destination: 小学统计与概率
    reason: 小学已建立基本知识，初中在此基础上拓展。

  - name: 平均数的基础意义
    destination: 小学统计与概率
    reason: 初中只在 J-D1-05 中进一步研究其统计意义和应用。

  - name: 简单可能性大小的定性描述
    destination: 小学统计与概率
    reason: 初中 D2 研究概率的定量表达。

  - name: 复杂抽样理论
    destination: 高中及后续统计学
    reason: 超出初中简单随机抽样的核心范围。

  - name: 条件概率与独立事件
    destination: 高中及后续数学
    reason: 不属于初中概率核心要求。

  - name: 正态分布与统计推断理论
    destination: 高中及后续统计学
    reason: 超出初中统计分析要求。

curriculum_alignment:

  authoritative_source:
    title: 义务教育数学课程标准（2022年版）
    publisher: 中华人民共和国教育部
    url: https://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220510531636118932.pdf

  stage_mapping:
    stage_4: 第四学段，7～9年级

  themes:
    - 抽样与数据分析
    - 随机事件的概率

  rules:
    - 小学统计与概率知识作为前置，不重复建立。
    - 课标明确要求与体系细化必须区分。
    - 数据的集中趋势与离散程度分别建点。
    - 样本统计量与总体统计量必须区分。
    - 频率与概率必须区分。
    - 等可能概率计算必须满足等可能条件。
    - 教材年级分布单独维护。