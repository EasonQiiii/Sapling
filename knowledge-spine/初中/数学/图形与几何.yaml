schema_version: "1.0"
status: "final"

domain:
  id: C
  name: 图形与几何

stage:
  id: junior
  name: 初中
  grades: [7, 8, 9]

knowledge_points:

  # =====================================
  # C5 图形的性质
  # =====================================

  - id: C5-01
    name: 点、线、面与距离
    definition: >
      研究几何体、平面、直线、点等基本几何对象，
      以及线段长度、线段中点和两点间距离等概念。
    learning_objectives:
      - 理解点、线、面等基本几何概念。
      - 理解线段的和、差及中点。
      - 掌握两点确定一条直线的基本事实。
      - 理解两点之间线段最短。
      - 理解两点间距离的意义。
      - 能进行简单尺规作图。
    diagnostic_dimensions:
      - 基本几何对象识别
      - 线段长短比较
      - 线段和差计算
      - 中点性质理解
      - 基本事实应用
      - 两点间距离理解
      - 尺规作图
    prerequisites:
      - C1-01
      - C1-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 重点是从小学直观认识过渡到几何概念理解。
      - 点、线、面作为几何研究对象，不与立体图形分类重复。

  - id: C5-02
    name: 角及角的度量
    definition: >
      研究角的形成、大小关系及角的度量，
      包括角的和差、度分秒单位及角平分线。
    learning_objectives:
      - 理解角的概念。
      - 能比较角的大小。
      - 理解度、分、秒之间的关系。
      - 能进行简单角度单位换算。
      - 能计算角的和与差。
      - 理解角平分线的意义。
      - 能用尺规作图作已知角的平分线。
    diagnostic_dimensions:
      - 角的概念理解
      - 角大小比较
      - 度分秒换算
      - 角的和差计算
      - 角平分线性质
      - 角度尺规作图
    prerequisites:
      - C1-01
      - C1-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 角平分线的性质定理及其逆命题归入三角形相关知识。

  - id: C5-03
    name: 相交线与垂线
    definition: >
      研究两条直线相交形成的角之间的关系，
      以及垂直、垂线段和点到直线距离等概念与性质。
    learning_objectives:
      - 理解对顶角、余角和补角。
      - 掌握对顶角相等。
      - 掌握同角或等角的余角相等、补角相等。
      - 理解垂线和垂线段。
      - 掌握过一点有且只有一条直线与已知直线垂直。
      - 理解点到直线的距离。
      - 能进行相关尺规作图。
    diagnostic_dimensions:
      - 对顶角识别与计算
      - 余角与补角关系
      - 垂直关系识别
      - 垂线性质
      - 垂线段理解
      - 点到直线距离
      - 垂线作图
    prerequisites:
      - C1-01
      - C5-01
      - C5-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 垂线段最短是距离概念的重要基础。
      - 点到直线距离指垂线段的长度。

  - id: C5-04
    name: 平行线及其性质与判定
    definition: >
      研究同一平面内两条直线平行的条件，
      以及平行线被第三条直线所截形成的角之间的关系。
    learning_objectives:
      - 理解平行线的概念。
      - 识别同位角、内错角和同旁内角。
      - 掌握平行线的基本事实。
      - 掌握平行线的性质定理。
      - 掌握平行线的判定定理。
      - 能利用平行线性质与判定进行简单推理。
      - 能进行平行线尺规作图。
    diagnostic_dimensions:
      - 平行线识别
      - 三线八角识别
      - 平行线基本事实
      - 平行线判定
      - 平行线性质
      - 性质与判定辨析
      - 平行线推理
    prerequisites:
      - C5-02
      - C5-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 性质是由平行推出角的关系。
      - 判定是由角的关系推出平行。
      - 重点诊断推理方向混淆。

  - id: C5-05
    name: 三角形的基本性质
    definition: >
      研究三角形的组成元素、分类及基本性质，
      包括内角和、外角、边角关系和三角形稳定性。
    learning_objectives:
      - 理解三角形及其内角、外角。
      - 理解中线、高线和角平分线。
      - 理解三角形的稳定性。
      - 掌握三角形内角和定理。
      - 掌握三角形外角性质。
      - 理解三角形任意两边之和大于第三边。
    diagnostic_dimensions:
      - 三角形组成元素识别
      - 中线、高线、角平分线辨析
      - 内角和计算
      - 外角性质应用
      - 三边关系判断
      - 三角形存在性判断
    prerequisites:
      - C1-02
      - C1-03
      - C5-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学三角形分类及初步性质作为前置。
      - 初中重点转向性质证明和推理。

  - id: C5-06
    name: 全等三角形
    definition: >
      两个能够完全重合的三角形称为全等三角形，
      对应边和对应角分别相等。
    learning_objectives:
      - 理解全等三角形的意义。
      - 能识别全等三角形的对应元素。
      - 掌握边角边、角边角、边边边全等判定。
      - 掌握角角边全等判定。
      - 掌握直角三角形斜边、直角边全等判定。
      - 能利用全等三角形证明线段和角相等。
    diagnostic_dimensions:
      - 全等概念理解
      - 对应边识别
      - 对应角识别
      - 全等判定条件
      - 判定方法选择
      - 全等推理表达
      - 全等性质应用
    prerequisites:
      - C5-05
      - C5-03
      - C5-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 全等三角形判定条件必须区分。
      - SSA不是一般三角形的全等判定条件。
      - 全等是三角形性质证明的重要工具。

  - id: C5-07
    name: 等腰三角形与等边三角形
    definition: >
      研究具有相等边或相等角特征的特殊三角形，
      以及它们的性质和判定方法。
    learning_objectives:
      - 理解等腰三角形的概念。
      - 掌握等腰三角形的性质定理。
      - 掌握等腰三角形的判定定理。
      - 理解等边三角形的概念。
      - 掌握等边三角形的性质与判定。
      - 能利用性质和判定进行几何推理。
    diagnostic_dimensions:
      - 等腰三角形识别
      - 底角性质
      - 三线合一
      - 等腰三角形判定
      - 等边三角形性质
      - 等边三角形判定
      - 综合推理
    prerequisites:
      - C5-05
      - C5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 等腰三角形性质和判定应分别诊断。
      - 等边三角形是特殊的等腰三角形。

  - id: C5-08
    name: 直角三角形
    definition: >
      研究含有一个直角的三角形的性质、判定和应用。
    learning_objectives:
      - 理解直角三角形的概念。
      - 掌握两个锐角互余。
      - 掌握斜边上的中线等于斜边的一半。
      - 掌握有两个角互余的三角形是直角三角形。
      - 掌握直角三角形全等判定。
      - 能利用直角三角形性质解决问题。
    diagnostic_dimensions:
      - 直角三角形识别
      - 锐角互余
      - 斜边中线性质
      - 直角三角形判定
      - 直角三角形全等
      - 性质综合应用
    prerequisites:
      - C5-05
      - C5-06
      - C5-07
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 锐角三角函数归入 C6-06。
      - 勾股定理归入 C5-09。

  - id: C5-09
    name: 勾股定理及其逆定理
    definition: >
      在直角三角形中，两条直角边的平方和等于斜边的平方；
      其逆定理可以根据三边长度判断三角形是否为直角三角形。
    learning_objectives:
      - 理解勾股定理。
      - 能利用勾股定理求直角三角形边长。
      - 理解勾股定理的逆定理。
      - 能利用逆定理判断直角三角形。
      - 能解决简单实际问题。
    diagnostic_dimensions:
      - 勾股定理识别
      - 直角边与斜边辨析
      - 勾股定理计算
      - 逆定理应用
      - 计算结果合理性
      - 实际问题建模
    prerequisites:
      - C5-08
      - A5-05
      - A5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 勾股定理与其逆定理是不同的推理方向。
      - 不把常见勾股数记忆单独建为知识点。

  - id: C5-10
    name: 四边形与多边形
    definition: >
      研究多边形的基本组成、内角和与外角和，
      以及平行四边形、矩形、菱形、正方形和梯形的概念及关系。
    learning_objectives:
      - 理解多边形及其组成元素。
      - 掌握多边形内角和与外角和公式。
      - 理解特殊四边形的概念。
      - 理解特殊四边形之间的包含关系。
      - 了解四边形的不稳定性。
    diagnostic_dimensions:
      - 多边形元素识别
      - 内角和计算
      - 外角和计算
      - 特殊四边形识别
      - 四边形包含关系
      - 四边形性质辨析
    prerequisites:
      - C1-02
      - C5-01
      - C5-02
      - C5-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 多边形范围按课标的凸多边形理解。
      - 特殊四边形的性质和判定分别在后续知识点研究。

  - id: C5-11
    name: 平行四边形及特殊四边形的性质与判定
    definition: >
      研究平行四边形、矩形、菱形和正方形的性质、
      判定条件以及它们之间的关系。
    learning_objectives:
      - 掌握平行四边形的性质和判定。
      - 掌握矩形的性质和判定。
      - 掌握菱形的性质和判定。
      - 理解正方形同时具有矩形和菱形的性质。
      - 掌握三角形中位线定理。
      - 能利用特殊四边形性质解决几何问题。
    diagnostic_dimensions:
      - 平行四边形性质
      - 平行四边形判定
      - 矩形性质与判定
      - 菱形性质与判定
      - 正方形性质
      - 四边形包含关系
      - 三角形中位线定理
      - 综合推理
    prerequisites:
      - C5-06
      - C5-10
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 性质和判定不能混淆。
      - 正方形是矩形与菱形的特殊情况。
      - 三角形中位线定理放在此处作为几何关系知识，不重复建点。

  - id: C5-12
    name: 圆的基本性质
    definition: >
      研究圆、弧、弦、圆心角和圆周角等基本概念，
      以及点与圆的位置关系和圆的对称性。
    learning_objectives:
      - 理解圆、弧、弦、圆心角和圆周角。
      - 了解等圆和等弧。
      - 探索并掌握点与圆的位置关系。
      - 掌握垂径定理。
      - 理解圆周角与圆心角的关系。
      - 理解圆内接四边形的对角互补。
      - 了解三角形内心和外心。
    diagnostic_dimensions:
      - 圆及相关元素识别
      - 点与圆的位置关系
      - 垂径定理应用
      - 圆心角与圆周角关系
      - 圆周角定理应用
      - 圆内接四边形性质
      - 内心与外心理解
    prerequisites:
      - C1-04
      - C5-05
      - C5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学圆的基本认识作为前置。
      - 圆周长和圆面积不重复建点。
      - 重点是初中阶段新增的圆的几何性质。

  - id: C5-13
    name: 直线与圆的位置关系
    definition: >
      研究直线与圆之间的位置关系，
      包括相离、相切和相交，以及切线的基本性质。
    learning_objectives:
      - 理解直线与圆的位置关系。
      - 掌握切线的概念。
      - 能根据圆心到直线的距离判断位置关系。
      - 能结合半径理解切线性质。
      - 能进行简单圆的尺规作图。
    diagnostic_dimensions:
      - 直线与圆位置识别
      - 圆心到直线距离
      - 切线概念
      - 切线性质应用
      - 位置关系判断
      - 尺规作图
    prerequisites:
      - C5-03
      - C5-12
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 过圆外一点作圆的切线属于选学内容。
      - 切线长定理属于选学内容，不作为统一核心要求。

  - id: C5-14
    name: 圆的弧长与扇形面积
    definition: >
      根据圆的半径、圆心角等条件，
      计算弧长和扇形面积。
    learning_objectives:
      - 理解弧长与圆心角之间的关系。
      - 理解扇形面积与圆心角之间的关系。
      - 能计算简单弧长。
      - 能计算简单扇形面积。
      - 能解决简单实际问题。
    diagnostic_dimensions:
      - 弧长公式理解
      - 扇形面积公式理解
      - 圆心角与比例关系
      - 公式选择
      - 计算准确性
      - 实际问题应用
    prerequisites:
      - C1-04
      - C1-08
      - C5-02
      - C5-12
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 圆周长与圆面积的基础公式属于小学知识。
      - 本知识点只覆盖初中新增的弧长和扇形面积。

  - id: C5-15
    name: 定义、命题与几何证明
    definition: >
      研究数学定义、命题、定理和推论的意义，
      通过已知事实和逻辑推理证明几何结论。
    learning_objectives:
      - 理解定义、命题、定理和推论。
      - 能识别命题的条件和结论。
      - 理解原命题和逆命题。
      - 理解证明的意义和必要性。
      - 能使用综合法表达简单证明过程。
      - 理解反例的作用。
      - 通过实例体会反证法。
    diagnostic_dimensions:
      - 定义与命题辨析
      - 条件与结论识别
      - 原命题与逆命题
      - 定理与推论理解
      - 推理依据选择
      - 证明过程完整性
      - 反例构造
      - 反证法理解
    prerequisites:
      - C5-01
      - C5-03
      - C5-04
      - C5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 几何证明是贯穿本领域的能力，不只用于本知识点。
      - 不将每一个定理的证明过程单独建立知识点。
      - 证明格式与逻辑依据应分别诊断。

  # =====================================
  # C6 图形的变化
  # =====================================

  - id: C6-01
    name: 图形的轴对称
    definition: >
      一个图形沿某条直线折叠后，
      直线两侧的部分能够互相重合，
      这种图形变化称为轴对称。
    learning_objectives:
      - 理解轴对称的意义。
      - 掌握轴对称图形的基本性质。
      - 理解对应点连线被对称轴垂直平分。
      - 能作简单图形关于给定直线的对称图形。
      - 理解特殊图形的轴对称性质。
    diagnostic_dimensions:
      - 轴对称识别
      - 对称轴识别
      - 对应点关系
      - 对称图形绘制
      - 特殊图形对称性
      - 轴对称性质应用
    prerequisites:
      - C2-06
      - C5-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学轴对称的初步认识作为前置。
      - 初中重点研究对应点之间的几何关系。

  - id: C6-02
    name: 图形的旋转与中心对称
    definition: >
      图形绕一个固定点按一定方向旋转一定角度，
      形成旋转变换；特殊情况下，对应点关于一个中心对称。
    learning_objectives:
      - 理解图形旋转的意义。
      - 掌握旋转的基本性质。
      - 理解中心对称的意义。
      - 理解中心对称图形的意义。
      - 掌握中心对称的基本性质。
      - 认识特殊图形的中心对称性质。
    diagnostic_dimensions:
      - 旋转中心识别
      - 旋转角度判断
      - 对应点距离关系
      - 对应角关系
      - 中心对称识别
      - 中心对称性质
      - 图形旋转作图
    prerequisites:
      - C2-05
      - C5-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 中心对称是旋转的特殊情形。
      - 旋转与中心对称应分别诊断。

  - id: C6-03
    name: 图形的平移
    definition: >
      图形上的每个点沿相同方向移动相同距离，
      所形成的图形变化称为平移。
    learning_objectives:
      - 理解图形平移的意义。
      - 掌握平移的基本性质。
      - 理解对应点连线平行或在同一直线上且相等。
      - 能画出简单图形平移后的图形。
      - 能利用平移设计简单图案。
    diagnostic_dimensions:
      - 平移方向识别
      - 平移距离判断
      - 对应点关系
      - 平移图形绘制
      - 平移性质应用
    prerequisites:
      - C2-04
      - C5-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 平移不改变图形的形状和大小。
      - 重点研究对应点及对应线段之间的关系。

  - id: C6-04
    name: 图形的相似
    definition: >
      形状相同但大小不一定相同的图形称为相似图形，
      相似多边形的对应角相等、对应边成比例。
    learning_objectives:
      - 理解比例的基本性质及线段的比。
      - 理解成比例线段。
      - 认识相似图形。
      - 理解相似多边形和相似比。
      - 掌握平行线截线段成比例的基本事实。
      - 理解图形位似的意义。
    diagnostic_dimensions:
      - 线段比计算
      - 成比例线段识别
      - 相似图形识别
      - 相似比理解
      - 对应角关系
      - 对应边比例关系
      - 位似识别
    prerequisites:
      - B4-01
      - B4-06
      - C2-07
      - C5-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 相似与全等不同，全等是相似比为1的特殊情况。
      - 黄金分割属于了解内容。
      - 相似三角形判定和性质在 C6-05 中细化。

  - id: C6-05
    name: 相似三角形的判定与性质
    definition: >
      对应角相等、对应边成比例的两个三角形称为相似三角形，
      可以利用相似关系研究线段比例及面积关系。
    learning_objectives:
      - 理解相似三角形的判定条件。
      - 掌握两角分别相等的判定方法。
      - 了解两边成比例且夹角相等的判定方法。
      - 了解三边成比例的判定方法。
      - 理解对应线段比等于相似比。
      - 理解面积比等于相似比的平方。
      - 能利用相似三角形解决简单实际问题。
    diagnostic_dimensions:
      - 相似条件识别
      - 对应角判断
      - 对应边判断
      - 相似比计算
      - 判定方法选择
      - 面积比计算
      - 实际问题应用
    prerequisites:
      - C6-04
      - C5-05
      - C5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 相似三角形判定定理的证明属于了解内容。
      - 对应关系识别是常见诊断重点。

  - id: C6-06
    name: 锐角三角函数
    definition: >
      在直角三角形中，对于一个锐角，
      其正弦、余弦和正切分别表示特定边长比。
    learning_objectives:
      - 理解正弦、余弦和正切的意义。
      - 理解锐角三角函数与直角三角形边角关系。
      - 掌握30°、45°、60°角的三角函数值。
      - 能使用计算器求已知锐角的三角函数值。
      - 能根据三角函数值求对应锐角。
    diagnostic_dimensions:
      - 直角三角形边识别
      - 对边与邻边辨析
      - 正弦意义
      - 余弦意义
      - 正切意义
      - 特殊角三角函数值
      - 计算器使用
    prerequisites:
      - C5-08
      - C5-09
      - C6-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 三角函数的学习建立在相似直角三角形基础上。
      - 不扩展到高中三角函数恒等变换。

  - id: C6-07
    name: 解直角三角形及其应用
    definition: >
      根据直角三角形中已知的边和角，
      利用勾股定理和锐角三角函数求出未知边角，
      并解决相关实际问题。
    learning_objectives:
      - 理解解直角三角形的基本条件。
      - 能使用勾股定理求边长。
      - 能使用锐角三角函数求边角。
      - 能根据实际问题建立直角三角形模型。
      - 能解决简单测量和实际应用问题。
    diagnostic_dimensions:
      - 已知条件识别
      - 直角三角形建模
      - 勾股定理应用
      - 三角函数选择
      - 未知边角求解
      - 实际问题解释
    prerequisites:
      - C5-08
      - C5-09
      - C6-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 仰角、俯角、坡度等属于常见应用情境。
      - 不把每一种应用题型单独建成知识点。

  - id: C6-08
    name: 图形的投影与视图
    definition: >
      研究物体在光线照射下形成的投影，
      以及从不同方向观察立体图形得到的平面视图。
    learning_objectives:
      - 理解中心投影和平行投影。
      - 能画出简单直棱柱、圆柱、圆锥和球的三视图。
      - 能根据三视图判断简单几何体。
      - 了解直棱柱和圆锥的侧面展开图。
      - 能根据展开图想象和制作简单模型。
    diagnostic_dimensions:
      - 中心投影识别
      - 平行投影识别
      - 主视图识别
      - 左视图识别
      - 俯视图识别
      - 三视图与立体图形对应
      - 侧面展开图理解
    prerequisites:
      - C1-05
      - C1-11
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 视图和展开图都属于空间图形与平面表示之间的转换。
      - 不重复小学立体图形的基本认识。

  # =====================================
  # C7 图形与坐标
  # =====================================

  - id: C7-01
    name: 平面直角坐标系
    definition: >
      由两条互相垂直且具有公共原点的数轴组成的坐标系统，
      可以用有序数对表示平面上点的位置。
    learning_objectives:
      - 理解平面直角坐标系的概念。
      - 认识横轴、纵轴、原点和象限。
      - 能画出平面直角坐标系。
      - 能根据坐标描点。
      - 能根据点的位置写出坐标。
      - 能在实际问题中建立适当的坐标系。
    diagnostic_dimensions:
      - 坐标系结构识别
      - 横纵坐标辨析
      - 象限判断
      - 坐标描点
      - 坐标读取
      - 实际位置表示
    prerequisites:
      - C2-02
      - A5-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学有序数对是前置知识。
      - 坐标系是数轴在平面上的拓展。
      - 函数图象中的坐标应用由 B 模块引用。

  - id: C7-02
    name: 图形的坐标表示与运动
    definition: >
      在平面直角坐标系中，
      利用点的坐标描述图形的位置及其对称、平移和位似变化。
    learning_objectives:
      - 能根据坐标写出图形对称后的顶点坐标。
      - 能根据坐标写出图形平移后的顶点坐标。
      - 理解连续沿两个坐标轴平移的坐标变化。
      - 理解顶点坐标按相同比例扩大或缩小时的图形关系。
      - 能利用坐标描述简单图形的变化。
    diagnostic_dimensions:
      - 对称后的坐标变化
      - 平移后的坐标变化
      - 横坐标变化
      - 纵坐标变化
      - 位似坐标变化
      - 图形与坐标对应
    prerequisites:
      - C7-01
      - C6-01
      - C6-02
      - C6-03
      - C6-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 主要研究坐标轴对称、沿坐标轴方向平移及位似。
      - 不将高中向量和矩阵变换纳入本知识点。

cross_module_capabilities:

  - id: C-CAP-08
    name: 几何直观与图形分析
    description: >
      能根据文字条件构建几何图形，
      利用图形分析已知条件和待求关系。
    applies_to:
      - C5-01
      - C5-02
      - C5-05
      - C5-10
      - C5-12
      - C7-01

  - id: C-CAP-09
    name: 几何推理与证明
    description: >
      能根据定义、基本事实和定理，
      组织逻辑推理并表达证明过程。
    applies_to:
      - C5-03
      - C5-04
      - C5-05
      - C5-06
      - C5-07
      - C5-08
      - C5-09
      - C5-10
      - C5-11
      - C5-12
      - C5-13
      - C5-15

  - id: C-CAP-10
    name: 图形变换与不变量分析
    description: >
      能从运动变化的角度研究图形，
      识别变换前后的对应关系及保持不变的性质。
    applies_to:
      - C6-01
      - C6-02
      - C6-03
      - C6-04
      - C6-05
      - C7-02

  - id: C-CAP-11
    name: 空间想象与视图转换
    description: >
      能在立体图形与平面视图之间进行转换，
      理解不同观察方向下图形的变化。
    applies_to:
      - C6-08

  - id: C-CAP-12
    name: 数形结合与坐标分析
    description: >
      能利用坐标表达图形位置和变化，
      并使用代数方法分析几何问题。
    applies_to:
      - C7-01
      - C7-02

exclusions:

  - name: 基础周长与面积计算
    destination: 小学图形与几何
    reason: 小学已经建立基本度量知识，初中不重复建点。

  - name: 基础体积与表面积计算
    destination: 小学图形与几何
    reason: 初中图形与几何侧重性质、变化和坐标，不重复小学基础计算。

  - name: 比例的基本意义
    destination: 小学数量关系与代数
    reason: 相似图形引用比与比例知识，不重复建立。

  - name: 函数图象及函数性质
    destination: 初中数量关系与代数
    reason: 函数关系及其分析归 B，坐标系本身归 C。

  - name: 向量与解析几何
    destination: 高中数学
    reason: 超出初中图形与几何的统一核心范围。

  - name: 复杂空间几何体证明
    destination: 高中数学
    reason: 不属于初中阶段的统一核心要求。

curriculum_alignment:
  authoritative_source:
    title: 义务教育数学课程标准（2022年版）
    publisher: 中华人民共和国教育部
    url: https://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220510531636118932.pdf

  stage_mapping:
    stage_4: 第四学段，7～9年级

  themes:
    - 图形的性质
    - 图形的变化
    - 图形与坐标

  rules:
    - 小学已有知识作为前置，不重复建立。
    - 课标明确要求与体系细化必须区分。
    - 选学内容单独标注，不作为统一核心要求。
    - 教材年级分布单独维护。
    - 几何证明能力贯穿多个知识点，不等同于单一题型。
    - 图形性质、图形变化和图形坐标之间允许建立交叉引用。