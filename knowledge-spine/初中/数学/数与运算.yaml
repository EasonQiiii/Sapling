schema_version: "1.0"
status: "final"

domain:
  id: A
  name: 数与运算

stage:
  id: junior
  name: 初中
  grades: [7, 8, 9]

knowledge_points:

  - id: A5-01
    name: 有理数的意义
    definition: >
      有理数包括整数和分数，可以表示为两个整数之比，
      其中分母不为零。正数、负数和零都属于有理数。
    learning_objectives:
      - 理解有理数的意义。
      - 认识正数、负数和零。
      - 理解整数与分数都是有理数。
      - 能识别有理数与非有理数。
      - 能在具体情境中用有理数表示具有相反意义的量。
    diagnostic_dimensions:
      - 有理数概念理解
      - 正数与负数辨析
      - 整数与分数关系
      - 有理数范围识别
      - 实际情境中的正负数表示
    prerequisites:
      - A1-01
      - A1-09
      - A2-04
      - A1-11
    curriculum_mapping:
      2022:
        stage_3: 小学阶段的数与运算基础
        stage_4: 明确要求
    notes:
      - 小学负数的初步认识作为前置。
      - 初中系统建立有理数概念。
      - 不重复建立整数、分数的基本意义。

  - id: A5-02
    name: 数轴
    definition: >
      规定了原点、正方向和单位长度的直线，
      可以用数轴上的点表示有理数和实数。
    learning_objectives:
      - 理解数轴的三要素。
      - 能正确画出数轴。
      - 能在数轴上表示有理数。
      - 能根据数轴上的位置比较数的大小。
      - 能借助数轴理解相反数和绝对值。
    diagnostic_dimensions:
      - 原点识别
      - 正方向理解
      - 单位长度理解
      - 数轴绘制
      - 数与点的对应
      - 数轴上的大小比较
    prerequisites:
      - A5-01
      - A2-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 数轴是数形结合的重要工具。
      - 不把平面直角坐标系归入本知识点。

  - id: A5-03
    name: 相反数与绝对值
    definition: >
      相反数是只有符号不同的两个数之间的关系；
      一个数的绝对值表示该数到数轴原点的距离。
    learning_objectives:
      - 理解相反数的意义。
      - 能求一个有理数的相反数。
      - 理解绝对值的几何意义。
      - 能求有理数的绝对值。
      - 能利用绝对值比较简单数值关系。
    diagnostic_dimensions:
      - 相反数概念理解
      - 相反数求解
      - 绝对值几何意义
      - 绝对值计算
      - 正负数绝对值辨析
      - 绝对值性质应用
    prerequisites:
      - A5-01
      - A5-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 相反数与绝对值是不同概念。
      - 绝对值不等于去掉负号。
      - 绝对值的核心意义是距离。

  - id: A5-04
    name: 有理数的大小比较
    definition: >
      根据数的性质及数轴上的位置，
      比较两个或多个有理数的大小。
    learning_objectives:
      - 能利用数轴比较有理数大小。
      - 理解正数大于零、零大于负数。
      - 能比较两个负数的大小。
      - 能利用绝对值辅助比较负数。
    diagnostic_dimensions:
      - 正负数大小关系
      - 负数大小比较
      - 数轴比较方法
      - 绝对值辅助比较
      - 大小关系表达
    prerequisites:
      - A5-01
      - A5-02
      - A5-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学已有的数的大小比较作为前置。
      - 本知识点重点覆盖负数及有理数范围内的比较。

  - id: A5-05
    name: 有理数的四则运算
    definition: >
      在有理数范围内进行加法、减法、乘法和除法运算，
      并理解运算规则及其适用条件。
    learning_objectives:
      - 掌握有理数加法和减法法则。
      - 掌握有理数乘法和除法法则。
      - 理解减法转化为加法的运算关系。
      - 理解除法转化为乘法的运算关系。
      - 能进行有理数四则混合运算。
      - 能运用运算律简化计算。
      - 能判断运算结果的符号和合理性。
    diagnostic_dimensions:
      - 有理数加法法则
      - 有理数减法法则
      - 有理数乘法法则
      - 有理数除法法则
      - 符号判断
      - 运算律应用
      - 混合运算顺序
      - 计算结果检验
    prerequisites:
      - A3-01
      - A3-02
      - A3-03
      - A3-04
      - A1-09
      - A4-01
      - A4-02
      - A4-03
      - A5-01
      - A5-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学整数、分数四则运算作为基础，不重复建点。
      - 本知识点重点覆盖负数参与的运算。
      - 除数不能为零。
      - 不能将符号错误和普通计算错误混为一类。

  - id: A5-06
    name: 乘方与整数指数幂
    definition: >
      求几个相同因数的积的运算叫乘方，
      乘方的结果叫幂。指数可以表示相同因数的个数。
    learning_objectives:
      - 理解乘方的意义。
      - 认识底数、指数和幂。
      - 能进行简单的乘方运算。
      - 理解正数、负数和零的乘方规律。
      - 了解整数指数幂的意义和基本性质。
      - 能运用幂的基本性质进行简单计算。
    diagnostic_dimensions:
      - 乘方概念理解
      - 底数与指数识别
      - 负数乘方符号判断
      - 零指数幂理解
      - 幂的基本性质
      - 乘方计算
    prerequisites:
      - A5-01
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 乘方与乘法是不同的运算。
      - 注意负数作为底数时括号的作用。
      - 整数指数幂的基本性质按课标要求掌握。
      - 不把高中阶段的指数函数纳入本知识点。

  - id: A5-07
    name: 科学记数法
    definition: >
      将绝对值较大的数或较小的数表示为
      a × 10^n 的形式，其中 a 和 n 满足相应规定。
    learning_objectives:
      - 理解科学记数法的表示形式。
      - 能使用科学记数法表示数。
      - 能将科学记数法还原为一般形式。
      - 能比较科学记数法表示的数的大小。
      - 能在实际情境中使用科学记数法。
    diagnostic_dimensions:
      - 表示形式理解
      - 系数范围判断
      - 指数确定
      - 数值转换
      - 数量级比较
      - 实际情境应用
    prerequisites:
      - A1-10
      - A2-01
      - A5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 科学记数法依赖整数指数幂。
      - 重点诊断指数确定和小数点移动错误。
      - 不将数量级估算与科学记数法混为同一个能力。

  - id: A5-08
    name: 实数及其大小比较
    definition: >
      实数由有理数和无理数组成，
      可以用数轴上的点表示，并按照数轴上的位置比较大小。
    learning_objectives:
      - 理解实数的分类。
      - 了解无理数的意义。
      - 能识别常见无理数。
      - 能在数轴上表示简单实数。
      - 能比较实数的大小。
      - 理解有理数和无理数都是实数。
      - 能用有理数估计无理数的大致范围。
    diagnostic_dimensions:
      - 实数概念理解
      - 有理数与无理数辨析
      - 无理数识别
      - 实数数轴表示
      - 实数大小比较
      - 无理数范围估计
    prerequisites:
      - A5-01
      - A5-02
      - A5-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 无理数不能表示为两个整数之比。
      - 无限不循环小数是无理数的典型表现。
      - 不能将无限小数全部判断为无理数。
      - 圆周率等常见无理数可作为学习实例。

  - id: A5-09
    name: 平方根与算术平方根
    definition: >
      若一个数的平方等于 a，则这个数是 a 的平方根。
      非负数 a 的非负平方根称为算术平方根。
    learning_objectives:
      - 理解平方根的意义。
      - 理解算术平方根的意义。
      - 区分平方根与算术平方根。
      - 能求简单数的平方根和算术平方根。
      - 理解正数有两个平方根，零的平方根是零。
      - 了解平方根与平方运算互为逆运算。
      - 能使用计算器求平方根。
    diagnostic_dimensions:
      - 平方根概念
      - 算术平方根概念
      - 两者关系辨析
      - 平方根个数判断
      - 平方根求解
      - 完全平方数识别
      - 计算器使用
    prerequisites:
      - A5-06
      - A5-08
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 平方根与算术平方根不能混淆。
      - 负数在实数范围内没有平方根。
      - 课标要求掌握百以内完全平方数的平方根求解。

  - id: A5-10
    name: 立方根
    definition: >
      若一个数的立方等于 a，则这个数称为 a 的立方根。
    learning_objectives:
      - 理解立方根的意义。
      - 能求简单数的立方根。
      - 理解立方根与立方运算互为逆运算。
      - 能判断正数、负数和零的立方根。
      - 能使用计算器求立方根。
    diagnostic_dimensions:
      - 立方根概念
      - 立方根符号判断
      - 立方根求解
      - 完全立方数识别
      - 计算器使用
    prerequisites:
      - A5-06
      - A5-08
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 正数、负数和零均有唯一的实数立方根。
      - 课标要求掌握千以内完全立方数及对应负整数的立方根。

  - id: A5-11
    name: 实数的运算
    definition: >
      在实数范围内进行运算，
      包括有理数运算以及涉及平方根等数的简单运算。
    learning_objectives:
      - 能进行简单实数运算。
      - 能使用运算律进行实数运算。
      - 能进行简单的平方根加减乘除运算。
      - 能理解乘方与开方之间的关系。
      - 能根据问题要求选择适当的计算方法。
    diagnostic_dimensions:
      - 实数四则运算
      - 根式运算
      - 运算律应用
      - 运算顺序
      - 乘方与开方关系
      - 运算结果合理性
    prerequisites:
      - A5-05
      - A5-06
      - A5-09
      - A5-10
      - A5-13
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 根式运算仅覆盖课标要求的简单范围。
      - 不扩展为高中复杂根式化简。
      - 根式的代数表达和相关代数式变形不在此处重复建点。
      - 二次根式专名与法则见 A5-13；本点侧重实数综合运算。

  - id: A5-12
    name: 近似数与近似计算
    definition: >
      近似数是在一定精度要求下对准确数值的近似表示，
      近似计算是在实际问题中根据精度要求进行数值计算。
    learning_objectives:
      - 理解近似数的意义。
      - 了解精确度和近似数之间的关系。
      - 能根据要求进行简单的近似计算。
      - 能使用计算器进行近似计算。
      - 能结合实际问题判断近似结果是否合理。
    diagnostic_dimensions:
      - 近似数概念
      - 精度要求理解
      - 近似结果处理
      - 计算器使用
      - 结果合理性判断
    prerequisites:
      - A5-05
      - A5-08
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 近似数与准确数需要区分。
      - 近似结果应满足具体问题的精度要求。
      - 不将高中误差理论纳入本知识点。

  - id: A5-13
    name: 二次根式
    definition: >
      形如 √a（a≥0）的式子称为二次根式。
      最简二次根式指被开方数不含分母、不含可开得尽方的因数等
      满足初中了解级要求的最简情形。
      在根号下仅限于数的范围内，二次根式可进行简单的加、减、乘、除运算。
    learning_objectives:
      - 了解二次根式的概念，能识别二次根式。
      - 了解最简二次根式的概念，能对简单数值情形作出判断。
      - 了解二次根式加减乘除运算法则，能进行简单四则运算（根号下为数）。
      - 能说明简单化简步骤与最简形式的关系。
    diagnostic_dimensions:
      - 二次根式概念识别
      - 最简二次根式判断
      - 二次根式加减
      - 二次根式乘除
      - 化简边界（不超课标）
    prerequisites:
      - A5-09
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - √(a²)=|a| 不是 2022 课标二次根式条目的明文要求。
      - 若题目考查该性质，主诊断应落在 A5-03（绝对值）与 A5-09（平方根）的综合，或标教材拓展，不要默认绑 A5-13 并声称课标要求。
      - 不重复建立实数运算；综合实数运算仍归 A5-11。
      - 根号下含字母的复杂化简、分母有理化等超出本点范围。

cross_module_capabilities:

  - id: A-CAP-05
    name: 数与形的相互表示
    description: >
      能利用数轴等几何工具表示数，
      并利用图形直观理解数的性质和关系。
    applies_to:
      - A5-02
      - A5-03
      - A5-04
      - A5-08

  - id: A-CAP-06
    name: 数值估算与合理性判断
    description: >
      能根据数的范围、运算性质和实际情境，
      估计数值并判断计算结果是否合理。
    applies_to:
      - A5-04
      - A5-07
      - A5-08
      - A5-11
      - A5-12

  - id: A-CAP-07
    name: 运算方法选择
    description: >
      能根据数的特点和问题要求，
      选择适当的运算方法和工具。
    applies_to:
      - A5-05
      - A5-06
      - A5-11
      - A5-12
      - A5-13

exclusions:

  - name: 整式运算
    destination: 数量关系与代数
    reason: 属于代数式的运算，不属于数与运算。

  - name: 分式运算
    destination: 数量关系与代数
    reason: 属于代数式及其运算。

  - name: 方程与不等式
    destination: 数量关系与代数
    reason: 属于数量关系与代数模型。

  - name: 函数
    destination: 数量关系与代数
    reason: 属于变量关系及函数模型。

  - name: 平面直角坐标系
    destination: 图形与几何
    reason: 属于图形的位置与坐标表示。

  - name: 复杂根式化简
    destination: 高中数学
    reason: 超出初中课程标准要求的简单根式运算范围。

curriculum_alignment:
  authoritative_source:
    title: 义务教育数学课程标准（2022年版）
    publisher: 中华人民共和国教育部
    url: https://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220420582346895190.pdf

  stage_mapping:
    stage_4: 第四学段，7～9年级

  rules:
    - 本文件只描述初中阶段知识内容。
    - 小学知识通过前置关系引用，不重复建立。
    - 课标明确要求与体系细化内容必须区分。
    - 不根据某个教材版本的年级编排推断统一年级要求。
    - 教材版本及年级映射单独维护。