schema_version: "1.0"
status: "final"

domain:
  id: B
  name: 数量关系与代数

stage:
  id: junior
  name: 初中
  grades: [7, 8, 9]

knowledge_points:

  # =========================
  # B6 数与式
  # =========================

  - id: B6-01
    name: 代数式的意义
    definition: >
      用运算符号把数、表示数的字母连接起来形成的式子，
      可以表示数量、数量关系和一般规律。
    learning_objectives:
      - 理解代数式的意义。
      - 能用代数式表示简单数量关系。
      - 能解释代数式中各部分的实际意义。
      - 能根据实际情境写出代数式。
    diagnostic_dimensions:
      - 代数式概念理解
      - 数量关系抽象
      - 字母与数的识别
      - 运算结构识别
      - 实际情境表达
    prerequisites:
      - B1-01
      - B1-02
      - B2-01
      - B2-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 不重复小学用字母表示数的基础知识。
      - 重点是从具体数量关系过渡到代数表达。

  - id: B6-02
    name: 代数式的值
    definition: >
      用数值代替代数式中的字母，
      按照运算规则计算得到的结果。
    learning_objectives:
      - 理解代数式求值的意义。
      - 能正确代入字母的数值。
      - 能按照运算顺序计算代数式的值。
      - 能利用整体代入等方法简化求值过程。
    diagnostic_dimensions:
      - 字母代入
      - 负数代入
      - 括号使用
      - 运算顺序
      - 代数式计算
      - 求值方法选择
    prerequisites:
      - B1-03
      - A5-05
      - B6-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学简单字母式求值作为前置。
      - 重点覆盖初中代数式结构及负数代入。

  - id: B6-03
    name: 整式与单项式、多项式
    definition: >
      数与字母的积组成的代数式，以及若干单项式的和，
      统称整式。整式包括单项式和多项式。
    learning_objectives:
      - 理解整式的意义。
      - 认识单项式和多项式。
      - 能识别单项式的系数和次数。
      - 能识别多项式的项和次数。
      - 能区分整式与其他代数式。
    diagnostic_dimensions:
      - 整式识别
      - 单项式识别
      - 多项式识别
      - 系数识别
      - 次数判断
      - 项的识别
    prerequisites:
      - B6-01
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 分式不属于整式。
      - 单项式次数与系数是不同概念。
      - 多项式次数由最高次项决定。

  - id: B6-04
    name: 合并同类项与去括号
    definition: >
      利用代数式的运算性质，
      合并同类项并去掉括号，
      将整式化为更简洁的形式。
    learning_objectives:
      - 理解同类项的意义。
      - 能正确识别同类项。
      - 掌握合并同类项法则。
      - 掌握去括号法则。
      - 能进行简单整式加减运算。
    diagnostic_dimensions:
      - 同类项识别
      - 同类项系数处理
      - 字母与指数处理
      - 去括号符号变化
      - 整式加减
      - 化简结果检查
    prerequisites:
      - B6-03
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 合并同类项不能改变字母及其指数。
      - 去括号时重点诊断符号错误。
      - 不将复杂代数恒等变形纳入本知识点。

  - id: B6-05
    name: 整式乘法
    definition: >
      根据乘法分配律及幂的运算性质，
      对单项式与单项式、单项式与多项式、
      多项式与多项式进行乘法运算。
    learning_objectives:
      - 掌握单项式乘单项式。
      - 掌握单项式乘多项式。
      - 掌握简单多项式乘法。
      - 能进行一次式与一次式的乘法。
      - 能进行一次式与二次式的乘法。
    diagnostic_dimensions:
      - 系数乘法
      - 同底数幂运算
      - 单项式乘多项式
      - 多项式乘法展开
      - 项的对应关系
      - 结果合并同类项
    prerequisites:
      - B6-03
      - B6-04
      - A5-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 多项式乘法范围按课标限定。
      - 不扩展到任意次数多项式的系统乘法。

  - id: B6-06
    name: 乘法公式
    definition: >
      具有特定结构的整式乘法关系，
      可以使用平方差公式和完全平方公式简化计算。
    learning_objectives:
      - 理解平方差公式。
      - 理解完全平方公式。
      - 了解公式的几何背景。
      - 能识别适用公式的代数式结构。
      - 能利用公式进行简单计算和推理。
    diagnostic_dimensions:
      - 公式结构识别
      - 平方差公式应用
      - 完全平方公式应用
      - 符号处理
      - 公式选择
      - 几何意义理解
    prerequisites:
      - B6-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 仅覆盖平方差公式和完全平方公式。
      - 不将复杂恒等变形作为核心要求。

  - id: B6-07
    name: 因式分解
    definition: >
      将一个多项式化为几个整式乘积的形式，
      是整式乘法的逆向过程。
    learning_objectives:
      - 理解因式分解的意义。
      - 能识别因式分解与整式乘法的关系。
      - 掌握提公因式法。
      - 掌握平方差公式法。
      - 掌握完全平方公式法。
      - 能检查因式分解结果。
    diagnostic_dimensions:
      - 因式分解概念
      - 公因式识别
      - 提公因式
      - 平方差公式识别
      - 完全平方公式识别
      - 分解结果完整性
      - 乘法检验
    prerequisites:
      - B6-04
      - B6-05
      - B6-06
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 因式分解与整式乘法互为逆向过程。
      - 重点覆盖提公因式法和公式法。
      - 不将十字相乘法等教材拓展方法全部视为课标统一要求。

  - id: B6-08
    name: 分式的意义与基本性质
    definition: >
      形如 A/B 的式子称为分式，
      其中 A、B 为整式且 B 不为零。
      分式具有与分数类似的基本性质。
    learning_objectives:
      - 理解分式的意义。
      - 能识别分式。
      - 理解分式的分母不能为零。
      - 理解分式的基本性质。
      - 能利用基本性质进行约分和通分。
    diagnostic_dimensions:
      - 分式识别
      - 分母非零条件
      - 分式基本性质
      - 约分
      - 通分
      - 最简分式判断
    prerequisites:
      - A1-09
      - B6-03
      - B6-07
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 分式与分数有联系，但分式的分子和分母是整式。
      - 分母非零条件必须保留。
      - 分式基本性质不等同于解分式方程。

  - id: B6-09
    name: 分式的运算
    definition: >
      根据分式的基本性质和运算法则，
      对分式进行约分、通分以及加、减、乘、除运算。
    learning_objectives:
      - 掌握简单分式的乘法和除法。
      - 掌握简单分式的加法和减法。
      - 能进行异分母分式加减运算。
      - 能将运算结果化为最简分式。
      - 能判断分式运算中的限制条件。
    diagnostic_dimensions:
      - 分式乘法
      - 分式除法
      - 分式通分
      - 分式加减
      - 约分化简
      - 分母限制条件
      - 运算结果检查
    prerequisites:
      - B6-08
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 仅覆盖简单分式运算。
      - 分母非零条件应贯穿运算过程。
      - 不把分式方程归入本知识点。

  # =========================
  # B7 方程与不等式
  # =========================

  - id: B7-01
    name: 方程与方程的解
    definition: >
      含有未知数的等式称为方程，
      使方程左右两边相等的未知数的值称为方程的解。
    learning_objectives:
      - 理解方程的意义。
      - 理解方程解的意义。
      - 能判断给定数值是否为方程的解。
      - 能根据实际问题建立简单方程。
    diagnostic_dimensions:
      - 方程识别
      - 未知数识别
      - 方程解的理解
      - 代入验证
      - 数量关系转化
    prerequisites:
      - B3-01
      - B6-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学方程基础作为前置。
      - 本知识点侧重初中方程概念的系统理解。
      - optional_prior_exposure: [B3-02, B3-04]

  - id: B7-02
    name: 等式的基本性质
    definition: >
      在等式两边同时加上或减去同一个数，
      或同时乘以或除以同一个非零数，
      等式仍然成立。
    learning_objectives:
      - 理解等式的基本性质。
      - 能根据等式性质进行等式变形。
      - 能解释等式变形的依据。
      - 理解除以同一个非零数的限制。
    diagnostic_dimensions:
      - 等式性质理解
      - 两边同加减
      - 两边同乘除
      - 非零条件
      - 等式变形合理性
    prerequisites:
      - B3-03
      - B7-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学阶段的初步经验作为前置（B3-03 为理解级）。
      - 初中阶段强调性质的掌握级应用，并服务于解方程。
      - 本点不覆盖小学第三学段 CR-023；小学课标达标题主绑定 B3-03，禁止绑 B7-02 并声称覆盖小学要求。

  - id: B7-03
    name: 一元一次方程
    definition: >
      只含有一个未知数，且未知数的次数为一次的方程。
    learning_objectives:
      - 理解一元一次方程的结构。
      - 掌握解一元一次方程的基本步骤。
      - 能运用等式基本性质进行变形。
      - 能解含括号和分母的一元一次方程。
      - 能检验方程的解。
    diagnostic_dimensions:
      - 方程结构识别
      - 去括号
      - 去分母
      - 移项
      - 合并同类项
      - 系数化为一
      - 解的检验
    prerequisites:
      - B7-01
      - B7-02
      - B6-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 解方程步骤是诊断过程，不是多个独立知识点。
      - 重点区分去分母错误、符号错误和移项错误。

  - id: B7-04
    name: 二元一次方程组
    definition: >
      由两个或多个方程组成，
      含有两个未知数且各方程均为一次方程的方程组。
    learning_objectives:
      - 理解二元一次方程及方程组的意义。
      - 理解方程组解的意义。
      - 掌握代入消元法。
      - 掌握加减消元法。
      - 能根据方程组特点选择合适方法。
      - 能检验方程组的解。
    diagnostic_dimensions:
      - 方程组概念
      - 方程组解的理解
      - 代入消元
      - 加减消元
      - 消元方法选择
      - 方程组求解
      - 解的检验
    prerequisites:
      - B7-03
      - B6-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 两个方程必须同时成立。
      - 简单三元一次方程组属于选学内容，不列入核心知识点。

  - id: B7-05
    name: 分式方程
    definition: >
      分母中含有未知数的方程称为分式方程。
    learning_objectives:
      - 理解分式方程的意义。
      - 能确定分式方程的限制条件。
      - 能通过去分母转化为整式方程。
      - 能求解可化为一元一次方程的分式方程。
      - 能检验解并判断增根。
    diagnostic_dimensions:
      - 分式方程识别
      - 最简公分母确定
      - 去分母
      - 整式方程求解
      - 增根识别
      - 解的检验
      - 实际意义判断
    prerequisites:
      - B6-08
      - B6-09
      - B7-03
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 去分母可能产生增根。
      - 必须保留原方程的限制条件。
      - 不将复杂高次分式方程纳入本知识点。

  - id: B7-06
    name: 一元二次方程
    definition: >
      只含有一个未知数，且未知数最高次数为二次的整式方程。
    learning_objectives:
      - 理解一元二次方程的标准形式。
      - 能判断方程是否为一元二次方程。
      - 掌握配方法。
      - 掌握公式法。
      - 掌握因式分解法。
      - 能根据方程特点选择求解方法。
      - 能结合实际情境解释方程的解。
    diagnostic_dimensions:
      - 标准形式识别
      - 一般形式化简
      - 配方法
      - 求根公式应用
      - 因式分解法
      - 解法选择
      - 解的检验
    prerequisites:
      - B6-04
      - B6-06
      - B6-07
      - B7-01
      - B7-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 只覆盖数字系数的一元二次方程。
      - 不将复杂参数方程纳入统一核心要求。

  - id: B7-07
    name: 一元二次方程根的判别式
    definition: >
      对一元二次方程 ax²+bx+c=0，
      通过判别式 b²-4ac 判断方程实数根的情况。
    learning_objectives:
      - 理解根的判别式。
      - 能计算判别式。
      - 能判断方程是否有实数根。
      - 能判断两个实数根是否相等。
      - 能将判别式与根的情况联系起来。
    diagnostic_dimensions:
      - 判别式表达式
      - 判别式计算
      - 实数根判断
      - 两实根相等判断
      - 判别式应用
    prerequisites:
      - B7-06
      - A5-05
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 判别式大于零、等于零、小于零对应不同根的情况。
      - 根与系数的关系不在此处重复建点。

  - id: B7-08
    name: 不等式的意义与性质
    definition: >
      用不等号连接两个代数式形成的不等式，
      用于表示两个数量之间的不等关系。
    learning_objectives:
      - 理解不等式的意义。
      - 能识别不等式。
      - 理解不等式的基本性质。
      - 能利用不等式性质进行变形。
      - 理解不等号方向变化的条件。
    diagnostic_dimensions:
      - 不等式识别
      - 不等关系表达
      - 两边同加减
      - 正数乘除
      - 负数乘除与方向变化
      - 不等式变形
    prerequisites:
      - B7-01
      - B7-02
      - A5-04
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 不等式与方程的相等关系不同。
      - 重点诊断负数乘除时不等号方向变化。

  - id: B7-09
    name: 一元一次不等式
    definition: >
      只含有一个未知数，且未知数次数为一次的不等式。
    learning_objectives:
      - 理解一元一次不等式的结构。
      - 能利用不等式性质求解。
      - 能将解集表示在数轴上。
      - 能根据实际问题建立一元一次不等式。
    diagnostic_dimensions:
      - 一元一次不等式识别
      - 不等式变形
      - 解集求解
      - 数轴表示
      - 实际问题建模
    prerequisites:
      - B7-08
      - B7-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 不等式的解通常是一个数的集合。
      - 注意数轴端点的实心点和空心点。

  - id: B7-10
    name: 一元一次不等式组
    definition: >
      由两个或多个一元一次不等式组成的不等式组，
      其解集是各不等式解集的公共部分。
    learning_objectives:
      - 理解不等式组的意义。
      - 能分别求出各不等式的解集。
      - 能确定各解集的公共部分。
      - 能在数轴上表示不等式组的解集。
    diagnostic_dimensions:
      - 不等式组识别
      - 单个不等式求解
      - 公共部分识别
      - 数轴表示
      - 空集与无界解集判断
    prerequisites:
      - B7-09
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 解集是各不等式解集的交集。
      - 重点诊断公共部分判断错误。

  # =========================
  # B8 函数
  # =========================

  - id: B8-01
    name: 变量与函数关系
    definition: >
      在某种变化过程中，存在两个变量，
      当一个变量取定一个值时，另一个变量有唯一确定的值，
      两个变量之间形成函数关系。
    learning_objectives:
      - 认识实际问题中的变量。
      - 能识别自变量和因变量。
      - 理解变量之间的对应关系。
      - 理解函数关系中的唯一对应性。
      - 能从实际情境中识别函数关系。
    diagnostic_dimensions:
      - 变量识别
      - 自变量与因变量辨析
      - 对应关系识别
      - 唯一对应性理解
      - 实际情境抽象
    prerequisites:
      - B1-04
      - B2-01
      - B2-04
      - B2-05
      - B5-01
      - B5-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 变量与函数是不同层次的概念。
      - 两个量同时变化不一定构成函数关系。
      - 重点理解唯一对应关系。

  - id: B8-02
    name: 函数的表示方法
    definition: >
      函数关系可以通过解析式、表格和图象等方式表示，
      不同表示方式可以反映同一函数关系。
    learning_objectives:
      - 认识函数的解析式表示。
      - 认识函数的表格表示。
      - 认识函数的图象表示。
      - 能在不同表示方式之间进行转换。
      - 能从图象和表格中读取函数信息。
    diagnostic_dimensions:
      - 解析式理解
      - 表格读取
      - 图象读取
      - 表示方式转换
      - 函数信息提取
    prerequisites:
      - C7-01
      - B8-01
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 图象属于函数关系的表达方式。
      - 坐标系本身的知识归图形与几何模块。
      - 不将绘图操作与函数概念混为一谈。

  - id: B8-03
    name: 函数的性质与实际意义
    definition: >
      通过函数解析式、表格和图象，
      分析变量之间的对应关系及变化规律，
      并解释其实际意义。
    learning_objectives:
      - 能根据函数表示分析变量关系。
      - 能识别函数值的变化情况。
      - 能结合图象理解函数变化趋势。
      - 能解释函数关系在实际情境中的意义。
      - 能根据函数信息解决简单问题。
    diagnostic_dimensions:
      - 函数值计算
      - 变量关系分析
      - 图象变化趋势
      - 函数实际意义
      - 函数信息应用
    prerequisites:
      - B8-01
      - B8-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 不把高中函数单调性、奇偶性等系统理论提前纳入。
      - 重点是初中阶段函数表示、变化规律和实际解释。

  - id: B8-04
    name: 正比例函数
    definition: >
      形如 y=kx（k 为不等于零的常数）的函数。
    learning_objectives:
      - 理解正比例函数的意义。
      - 能识别正比例函数。
      - 能求正比例函数的解析式。
      - 能绘制正比例函数图象。
      - 理解比例系数与图象之间的关系。
      - 能利用正比例函数解决简单问题。
    diagnostic_dimensions:
      - 函数形式识别
      - 比例系数确定
      - 解析式求解
      - 图象绘制
      - 图象性质理解
      - 实际问题应用
    prerequisites:
      - B5-02
      - B8-01
      - B8-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学正比例作为前置经验。
      - 初中进一步建立函数解析式与图象之间的联系。

  - id: B8-05
    name: 一次函数
    definition: >
      形如 y=kx+b（k 不等于零）的函数，
      其图象为直线。
    learning_objectives:
      - 理解一次函数的意义。
      - 能识别一次函数。
      - 能根据条件确定函数解析式。
      - 能绘制一次函数图象。
      - 理解 k 和 b 对图象的影响。
      - 能利用一次函数解决实际问题。
    diagnostic_dimensions:
      - 一次函数识别
      - 解析式确定
      - 待定系数求解
      - 图象绘制
      - k 的意义
      - b 的意义
      - 实际问题应用
    prerequisites:
      - C7-01
      - B8-04
      - B8-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 正比例函数是一次函数的特殊形式。
      - 重点理解解析式参数与图象的对应关系。
      - 不将复杂函数变换纳入本知识点。

  - id: B8-06
    name: 反比例函数
    definition: >
      形如 y=k/x（k 不等于零）的函数，
      其中自变量 x 不等于零。
    learning_objectives:
      - 理解反比例函数的意义。
      - 能识别反比例函数。
      - 能根据条件确定解析式。
      - 能绘制反比例函数图象。
      - 理解比例系数与图象之间的关系。
      - 能利用反比例函数解决简单问题。
    diagnostic_dimensions:
      - 函数形式识别
      - 自变量限制
      - 比例系数确定
      - 解析式求解
      - 图象绘制
      - 图象性质理解
      - 实际问题应用
    prerequisites:
      - B5-05
      - B8-01
      - B8-02
    curriculum_mapping:
      2022:
        stage_4: 明确要求
    notes:
      - 小学反比例经验作为前置。
      - 初中进一步学习反比例函数解析式和图象。
      - 注意自变量不能为零。

  - id: B8-07
    name: 二次函数
    definition: >
      形如 y=ax²+bx+c（a 不等于零）的函数，
      其图象为抛物线。
    learning_objectives:
      - 了解二次函数的意义。
      - 能根据具体情境认识简单二次函数关系。
      - 能结合图象分析简单二次函数的变化规律。
      - 能利用简单二次函数解决实际问题。
    diagnostic_dimensions:
      - 二次关系识别
      - 函数解析式理解
      - 图象特征识别
      - 变化规律分析
      - 实际情境解释
    prerequisites:
      - B8-01
      - B8-02
      - B8-03
    curriculum_mapping:
      2022:
        stage_4: 不列为明确要求
    notes:
      - 二次函数系统学习不属于2022版初中数学课程标准的核心要求。
      - 可以作为教材拓展或后续学习内容。
      - 不应与一元二次方程混为一谈。

cross_module_capabilities:

  - id: B-CAP-01
    name: 代数抽象与符号表达
    description: >
      能从具体数量关系中抽象出代数对象，
      使用符号表达数量关系和一般规律。
    applies_to:
      - B6-01
      - B6-02
      - B6-03
      - B8-01

  - id: B-CAP-02
    name: 代数运算与变形
    description: >
      能根据代数运算法则进行运算和变形，
      并解释运算依据。
    applies_to:
      - B6-04
      - B6-05
      - B6-06
      - B6-07
      - B6-08
      - B6-09

  - id: B-CAP-03
    name: 方程与不等式建模
    description: >
      能从实际问题中抽象数量关系，
      建立方程或不等式并解释求解结果。
    applies_to:
      - B7-01
      - B7-03
      - B7-04
      - B7-05
      - B7-06
      - B7-09
      - B7-10

  - id: B-CAP-04
    name: 函数建模与解释
    description: >
      能从现实问题中识别变量关系，
      建立函数模型并利用函数表示分析变化规律。
    applies_to:
      - B8-01
      - B8-02
      - B8-03
      - B8-04
      - B8-05
      - B8-06

  - id: B-CAP-05
    name: 代数推理
    description: >
      了解代数推理的意义，能在整式变形与方程求解等过程中
      说明运算或变形的依据，体会从特殊到一般的推理方式。
      本能力对应课标方法性要求（例66），不单建知识点；
      禁止将 CAP ID 写入 prerequisites。
    applies_to:
      - B6-01
      - B6-02
      - B6-03
      - B6-04
      - B6-05
      - B6-07
      - B7-02
      - B7-03
      - B7-05
    diagnostic_dimensions:
      - 推理依据识别
      - 运算变形说理
      - 从特殊到一般
      - 代数推理意识
    curriculum_notes: >
      对应课标 CR-090；能力已承载，课标映射记 partial
      （非 learning_objectives 级完整覆盖）。

exclusions:

  - name: 有理数与实数的数值运算
    destination: 数与运算
    reason: 数值对象及其运算归 A 领域。

  - name: 正比例与反比例的基础意义
    destination: 小学数量关系
    reason: 小学已有基础知识，本模块只建立初中函数层面的深化。

  - name: 平面直角坐标系
    destination: 图形与几何
    reason: 坐标系属于图形的位置与坐标表示；函数模块引用其能力。

  - name: 二次函数系统学习
    destination: 高中数学
    reason: 不属于2022版初中数学课程标准的明确核心要求。

  - name: 三元一次方程组
    destination: 拓展内容
    reason: 2022版课标标记为选学内容，不列为统一核心知识点。

curriculum_alignment:
  authoritative_source:
    title: 义务教育数学课程标准（2022年版）
    publisher: 中华人民共和国教育部
    url: https://www.moe.gov.cn/srcsite/A26/s8001/202204/W020220510531636118932.pdf

  stage_mapping:
    stage_4: 第四学段，7～9年级

  rules:
    - 本文件只描述初中阶段的数量关系与代数内容。
    - 小学知识作为前置，不重复建立。
    - 课标明确要求与体系细化、教材拓展必须区分。
    - 教材年级分布单独维护，不从课标学段要求推断具体年级。
    - 二次函数等拓展内容不能标记为2022版课标明确要求。